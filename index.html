// ---- 码位挑战：60 秒看字猜码位 ----
const EGG_GAME_SEC = 60;
const EGG_BEST_STORE = 'unicode_egg_best';
const EGG_DELTAS = [1, -1, 2, -2, 3, -3, 0x10, -0x10, 0x11, -0x11, 0x100, -0x100];
function eggGamePick() {
  const ch = EGG_CHARS[Math.floor(Math.random() * EGG_CHARS.length)];
  const cp = ch.codePointAt(0);
  const hex = cp.toString(16).toUpperCase();
  const opts = [hex];
  let guard = 0;
  while (opts.length < 4 && guard++ < 200) {
    const v = cp + EGG_DELTAS[Math.floor(Math.random() * EGG_DELTAS.length)];
    if (v < 0x20 || v > 0x10FFFF || (v >= 0xD800 && v <= 0xDFFF)) continue;
    const h = v.toString(16).toUpperCase();
    if (opts.indexOf(h) < 0) opts.push(h);
  }
  while (opts.length < 4) opts.push((cp + opts.length * 0x1000).toString(16).toUpperCase());
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = opts[i]; opts[i] = opts[j]; opts[j] = t;
  }
  return { ch: ch, hex: hex, opts: opts, ans: opts.indexOf(hex) };
}
function eggGameOpen() {
  eggGameStop();
  _eggGame = { score: 0, left: EGG_GAME_SEC, cur: null, answered: false };
  showModal(ic('zap') + '码位挑战',
    '<p style="font-size:12px;color:var(--muted);margin:0 0 6px">60 秒，看字猜码位。每个答案都是这个字符自己的码位现场算出来的——本应用的主业就是干这个。</p><div id="eggGameMain"></div>', '');
  eggGameNext();
  eggGameStopTimer();
  _eggTimer = setInterval(eggGameTick, 1000);
}
function eggGameStopTimer() { if (_eggTimer) { clearInterval(_eggTimer); _eggTimer = null; } }
function eggGameStop() { eggGameStopTimer(); _eggGame = null; }
function eggGameReopen() { eggGameOpen(); }
function eggGameTick() {
  const g = _eggGame;
  if (!g) return;
  if (!document.getElementById('eggGameMain')) { eggGameStop(); return; }  // 弹窗被关了
  g.left--;
  const t = document.getElementById('eggGameTime');
  if (t) t.textContent = '⏱ ' + g.left + 's ｜ 得分 ' + g.score;
  if (g.left <= 0) eggGameEnd();
}
function eggGameNext() {
  const g = _eggGame;
  if (!g) return;
  const q = eggGamePick();
  g.cur = q; g.answered = false;
  const main = document.getElementById('eggGameMain');
  if (!main) { eggGameStop(); return; }
  main.innerHTML = '<div style="text-align:center">'
    + '<div id="eggGameTime" style="font-size:12px;color:var(--muted)">⏱ ' + g.left + 's ｜ 得分 ' + g.score + '</div>'
    + '<div style="font-size:60px;line-height:1.25;margin:8px 0">' + escapeHtml(q.ch) + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">'
    + q.opts.map(function (h, i) {
        return '<button class="tp-btn" onclick="eggGameAnswer(' + i + ')" style="min-width:106px;font-family:Consolas,monospace">U+' + h + '</button>';
      }).join('')
    + '</div><div id="eggGameFb" style="font-size:12px;min-height:18px;margin-top:8px"></div></div>';
}
function eggGameAnswer(i) {
  const g = _eggGame;
  if (!g || g.answered) return;
  g.answered = true;
  const q = g.cur;
  const ok = i === q.ans;
  if (ok) g.score++;
  const fb = document.getElementById('eggGameFb');
  if (fb) fb.innerHTML = ok
    ? '<span style="color:#43a047">✓ 答对了！U+' + q.hex + '</span>'
    : '<span style="color:#e53935">✗ 正确是 U+' + q.hex + '</span>';
  setTimeout(function () { if (_eggGame) eggGameNext(); }, ok ? 380 : 950);
}
function eggGameEnd() {
  eggGameStopTimer();
  const g = _eggGame;
  _eggGame = null;
  if (!g) return;
  let best = 0;
  try { best = parseInt(localStorage.getItem(EGG_BEST_STORE) || '0', 10) || 0; } catch (e) {}
  const isBest = g.score > best;
  if (isBest) { try { localStorage.setItem(EGG_BEST_STORE, String(g.score)); } catch (e) {} }
  const rank = g.score >= 10 ? 'U+5B57 转世' : g.score >= 7 ? '人形码表' : g.score >= 4 ? '码表在手' : g.score >= 1 ? '初识 Unicode' : '一块豆腐块';
  const main = document.getElementById('eggGameMain');
  if (main) main.innerHTML = '<div style="text-align:center">'
    + '<div style="font-size:34px">' + (isBest ? '🏆' : '🎉') + '</div>'
    + '<div style="font-size:15px;font-weight:700;margin:6px 0">得分 ' + g.score + ' ｜ ' + rank + '</div>'
    + '<div style="font-size:12px;color:var(--muted)">' + (isBest ? '新纪录！（原纪录 ' + best + '）' : '最佳纪录：' + Math.max(best, g.score)) + '</div>'
    + '<button class="file-upload-btn" onclick="eggGameReopen()" style="margin-top:12px">再来一局</button></div>';
  addLog('彩蛋', '码位挑战得分 ' + g.score);
  if (isBest) showToast('🏆 码位挑战新纪录：' + g.score);
}

const SETTINGS_FOLD_STORE = 'unicode_settings_fold'; // 旧版本残留的键，v0.2.12 起不再读写
let _settingsFold = {};

const RELEASE_PAGE_URL = 'https://gitee.com/i-dont-want-to-pick-a-name/unicode-chaxun/releases';

// 渲染完设置内容后调用：把每个 .settings-section 里 h3 之后的内容包进 .sec-body，
// 给 h3 加上箭头和点击事件，再按记忆决定谁展开
function initSettingsFold(root) {
  if (!root) return;
  const cfg = settingsFoldCfg();
  const secs = Array.prototype.slice.call(root.querySelectorAll('.settings-section'));
  secs.forEach(function (sec) {
    if (sec.__foldInit) return;
    const h3 = sec.querySelector('h3');
    if (!h3) return;
    sec.__foldInit = true;
    // h3 之后的所有兄弟节点都算区块内容
    const body = document.createElement('div');
    body.className = 'sec-body';
    let node = h3.nextSibling;
    while (node) {
      const next = node.nextSibling;
      body.appendChild(node);
      node = next;
    }
    sec.appendChild(body);
    sec.classList.add('foldable');
    // 区块标题当 key（图标 svg 没有文字，textContent 就是标题本身）
    const key = h3.textContent.trim();
    sec.setAttribute('data-fold-key', key);
    h3.setAttribute('onclick', 'toggleSettingsSec(this)');
    h3.insertAdjacentHTML('beforeend', '<svg class="ni fold-arrow"><use href="#i-chev-r" xlink:href="#i-chev-r"/></svg>');
    if (cfg[key] === true) sec.classList.add('open');
  });
}

// ---- v0.2.5：扩展区字体包（Jigmo 字雲，CC0 公有领域）----
// CJK 扩展 B–J 区的字符系统字体基本都没有，界面全靠方框撑场面。
// Jigmo（2025-09-12 版）是目前唯一覆盖 Unicode 17.0 全部 CJK 扩展区的免费字体，
// 按「UnicodeExt」注册成最后一级后备：只有系统字体缺字形时才用，常用字不受影响。
// 单个 OpenType 字体最多 65,535 个字形，所以官方拆成 3 个文件；
// 我们只取平面 2/3 的两个（扩展 B–J），BMP 常用字交给系统字体，体积省一半。
const EXT_FONT_IDB = 'unicode_extfont';
const EXT_FONT_VERSION = 'Jigmo 2025-09-12';
const EXT_FONT_FAMILY = 'UnicodeExt';
const EXT_FONT_FILES = [
  { file: 'Jigmo2.woff2', label: '扩展 B–F、I' },
  { file: 'Jigmo3.woff2', label: '扩展 G、H、J' },
];
// 网页版在线源：自家站点（解封后上架）→ jsDelivr 上的官方原包（CORS 全开，原版 ttf 会大一些）
const EXT_FONT_URL_BASES = [
  'https://unchaxun.pages.dev/fonts/',
  'https://cdn.jsdelivr.net/npm/fontpkg-jigmo@2025.9.12/',
];
let extFontLoaded = false;
let _extFontInstalling = false;

function extFontLooksValid(buf) {
  if (!buf || buf.byteLength < 1000) return false;
  try {
    const b = new Uint8Array(buf, 0, 4);
    // OTTO(CFF) / 0x00010000(TrueType) / wOFF / wOF2 —— 是真字体才收
    return (b[0] === 0x4F && b[1] === 0x54 && b[2] === 0x54 && b[3] === 0x4F)
        || (b[0] === 0x00 && b[1] === 0x01 && b[2] === 0x00 && b[3] === 0x00)
        || (b[0] === 0x77 && b[1] === 0x4F && b[2] === 0x46 && b[3] === 0x46)
        || (b[0] === 0x77 && b[1] === 0x4F && b[2] === 0x46 && b[3] === 0x32);
  } catch (e) { return false; }
}
// APK / 桌面版：字体就在包里，file:// 只能用 XHR 读（fetch 对 file: 一律拒绝，v0.1.8 老朋友了）
function extFontFetchBundled(file) {
  return new Promise(function (res) {
    const isLocal = location.protocol === 'file:'
      || /^(127\.0\.0\.1|localhost)$/i.test(location.hostname || '');
    if (!isLocal) { res(null); return; }
    try {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'fonts/' + file, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function () {
        if ((xhr.status === 200 || xhr.status === 0) && extFontLooksValid(xhr.response)) res(xhr.response);
        else res(null);
      };
      xhr.onerror = function () { res(null); };
      xhr.send();
    } catch (e) { res(null); }
  });
}
async function extFontApply(files) {
  if (!files || !files.length || !window.FontFace) return false;
  let okCount = 0;
  for (let i = 0; i < files.length; i++) {
    try {
      const ff = new FontFace(EXT_FONT_FAMILY, files[i].buf);
      await ff.load();
      document.fonts.add(ff);
      okCount++;
    } catch (e) { /* 单个文件失败不影响其他 */ }
  }
  extFontLoaded = okCount > 0;
  return okCount === files.length;
}
async function extFontInstall() {
  if (_extFontInstalling) return;
  _extFontInstalling = true;
  const btn = document.getElementById('extFontBtn');
  if (btn) { btn.disabled = true; btn.textContent = '下载中…'; }
  try {
    const got = [];
    for (let i = 0; i < EXT_FONT_FILES.length; i++) {
      const spec = EXT_FONT_FILES[i];
      let buf = await extFontFetchBundled(spec.file);
      if (!buf) {
        for (let j = 0; j < EXT_FONT_URL_BASES.length; j++) {
          try {
            const r = await fetch(EXT_FONT_URL_BASES[j] + spec.file, { cache: 'force-cache' });
            if (!r.ok) continue;
            const b = await r.arrayBuffer();
            if (extFontLooksValid(b)) { buf = b; break; }
          } catch (e) { /* 换下一个源 */ }

    else {

            <li><b>同步预览不再被设置卡片盖住</b>：从设置小卡片里点「领取」，弹出的预览窗原来压在卡片后面，内容看不到、合并 / 覆盖也点不到。现在浮层层级统一成一套刻度（设置面板 200 → 小卡片 250 → 弹窗 300 → 字体对比 310 → 确认框 500 → toast 600），需要盖住已有浮层时按「当前最高 +1」动态抬，不再写死数字</li>

let _swAnimId = null;

function refreshSettingsDisplay() {

  const _ov = document.getElementById('settingsOverlay');
  if (_ov && _ov.classList.contains('show')) {
    // v0.2.28：重建会重置滚动位置，还会把正打开的卡片冲掉。

    // 改个动画档位不该被弹回顶部，也不该变成另一张卡的样子。
    const _cardOv = document.getElementById('settingsCardOverlay');
    const _reopenId = (_cardOv && _cardOv.classList.contains('show')) ? _settingsCardId : null;
    const _cb0 = document.getElementById('settingsCardBody');
    const _mb0 = document.getElementById('settingsBody');
    const _cardScroll = _cb0 ? _cb0.scrollTop : 0;
    const _mainScroll = _mb0 ? _mb0.scrollTop : 0;
    renderSettingsBody();
    if (_reopenId) {
      openSettingsCard(_reopenId);
      const _cb1 = document.getElementById('settingsCardBody');
      if (_cb1) _cb1.scrollTop = _cardScroll;
      const _mb1 = document.getElementById('settingsBody');
      if (_mb1) _mb1.scrollTop = _mainScroll;
    } else {
      const _mb2 = document.getElementById('settingsBody');
      if (_mb2) _mb2.scrollTop = _mainScroll;
    }
  }
  // 滑块动画只在切换后的那一次重渲染里播放，用完即清，避免别的重渲染误触发
  _swAnimId = null;
}

// 复制 QQ 群号（阻止事件冒泡，避免触发卡片跳转）
function copyQQGroup(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const num = '1037376837';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(num).then(
      () => showToast(`群号 ${num} 已复制`),
      () => {
        // 回退方案
        const ta = document.createElement('textarea');
        ta.value = num; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast(`群号 ${num} 已复制`); }
        catch(e) { showToast('复制失败，请手动复制'); }
        finally { document.body.removeChild(ta); }
      }
    );
  } else {
    const ta = document.createElement('textarea');
    ta.value = num; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast(`群号 ${num} 已复制`); }
    catch(e) { showToast('复制失败，请手动复制'); }
    finally { document.body.removeChild(ta); }
  }
}

// 动画效果：三档 + 速度微调
function applyAnimSetting() {
  document.body.classList.toggle('no-animations', animLevel === 'off');
  document.body.classList.toggle('anim-bouncy', animLevel === 'bouncy');
  document.body.style.setProperty('--anim-speed', String(animSpeed));
}
function setAnimLevel(level) {
  animLevel = level;
  // 存 'on' 保持与旧版本兼容（旧代码只认 on/off）
  lsSetRaw('unicode_anim', level === 'normal' ? 'on' : level);
  applyAnimSetting();
  _swAnimId = 'anim';
  refreshSettingsDisplay();
}
function setAnimSpeed(v) {
  const n = parseFloat(v);
  animSpeed = isNaN(n) ? 1 : Math.min(1.6, Math.max(0.6, n));
  lsSetRaw('unicode_anim_speed', String(animSpeed));
  applyAnimSetting();
  const out = document.getElementById('animSpeedVal');
  if (out) out.textContent = animSpeed.toFixed(1) + '×';
}

    const onclk = cell.getAttribute('onclick') || '';
    if (!re.test(onclk)) return;
    const star = cell.querySelector('.quick-fav');
    if (star) {
      star.classList.toggle('on', nowFav);
      star.textContent = nowFav ? '★' : '☆';
      star.title = nowFav ? '已收藏' : '未收藏';
    }
    cell.classList.toggle('is-fav', nowFav);
    // 收藏视图里取消收藏：同步数据并刷新（平铺虚拟滚动重渲染窗口；分组模式就地移除）
    if (!nowFav && currentView === 'favorites') {
      if (typeof favFlatState !== 'undefined' && favFlatState.cps) {
        const i = favFlatState.cps.indexOf(cp);
        if (i !== -1) favFlatState.cps.splice(i, 1);
      }
      // 分组模式下同步更新组计数 / 移除空组
      const group = cell.closest('.fav-group');
      if (group) {
        cell.remove();
        const remaining = group.querySelectorAll('.cell').length;
        if (remaining === 0) { group.remove(); }
        else {
          const cnt = group.querySelector('.fav-group-count');
          if (cnt) cnt.textContent = `${remaining} 个`;
        }
      } else if (typeof favFlatState._refresh === 'function') {
        favFlatState._refresh(); // 平铺模式：虚拟滚动重算高度 + 重渲染窗口
      }
      setCount(`共 ${favorites.size} 个收藏`);
    }
  });
  // U5：收藏视图里「新增」收藏时页面没有对应格子，就地更新改不到它 → 整体重绘一次才会出现
  if (nowFav && currentView === 'favorites') {
    renderFavorites();
    setCount(`共 ${favorites.size} 个收藏`);
    return;
  }
  // 只更新控制栏上的数字文本，不重写整个控制栏（避免闪烁 / 按钮状态丢失）
  if (currentView === 'favorites') return;
  // 区块视图：直接更新 blockFavInfo
  const info = document.getElementById('blockFavInfo');
  if (info && typeof blockScrollState !== 'undefined' && blockScrollState.cps && blockScrollState.cps.length) {
    let faved = 0;
    for (const c of blockScrollState.cps) if (favorites.has(c)) faved++;
    info.textContent = `⭐ ${faved.toLocaleString()} / ${blockScrollState.cps.length.toLocaleString()} 已收藏`;
    return;
  }
  // 普通网格视图（含全部字符 / 分页视图）：只更新 .ctrl-fav-progress 文本
  const prog = document.querySelector('.ctrl-fav-progress');
  if (prog) {
    const start = currentPage * PAGE_SIZE;
    const pageCps = (currentView === 'all') ? getAllCharsPage(start, PAGE_SIZE) : currentChars.slice(start, start + PAGE_SIZE);
    let faved = 0;
    for (const c of pageCps) if (favorites.has(c)) faved++;
    prog.textContent = `⭐ ${faved} / ${pageCps.length} 已收藏`;
  }
}

// 点击收藏模式：直接 toggle 收藏，不弹详情模态框（避免背景变暗）
function quickToggleFav(cp) {
  if (!clickFavMode) { showDetail(cp); return; }
  const ch = safeChr(cp) || '?';
  const hex = cp.toString(16).toUpperCase().padStart(cp > 0xFFFF ? 5 : 4, '0');
  const wasFav = favorites.has(cp);
  if (wasFav) favorites.delete(cp); else favorites.add(cp);
  favEggCheck();
  // D2：先落盘再提示，避免配额满时星标亮了但刷新后消失
  const ok = saveFavorites();
  if (ok) {
    showToast(wasFav ? `已取消 ${ch} (U+${hex})` : `已收藏 ${ch} (U+${hex})`);
    addLog(wasFav ? '取消收藏' : '加入收藏', `${ch} (U+${hex})`);
  } else if (!wasFav) {
    favorites.delete(cp);
  }
  updateFavCount();
  applyFavVisualUpdate(cp); // 就地更新，不刷新
}

function setClickFavMode(on) {
  clickFavMode = !!on;
  // 不重绘整页：只更新所有 cell 的 onclick 和视觉类
  const cells = document.querySelectorAll('.cell');
  cells.forEach(cell => {
    // 提取码点
    const m = (cell.getAttribute('onclick') || '').match(/(?:showDetail|quickToggleFav)\((\d+)\)/);
    if (!m) return;
    const cp = parseInt(m[1], 10);
    if (clickFavMode) {
      cell.setAttribute('onclick', `quickToggleFav(${cp})`);
      cell.classList.add('cell-favmode');
      cell.setAttribute('title', favorites.has(cp) ? '点击取消收藏' : '点击加入收藏');
    } else {
      cell.setAttribute('onclick', `showDetail(${cp})`);
      cell.classList.remove('cell-favmode');
      // 还原为"字符名称"提示，而不是留一个空 title
      const nm = cell.getAttribute('data-name'), hx = cell.getAttribute('data-hex');
      if (nm && hx) cell.setAttribute('title', `${nm} (U+${hx})`);
      else cell.removeAttribute('title');
    }
  });
  // 同步所有控制栏按钮视觉 + onclick（关键：不更新 onclick 会导致开关永远朝同一方向拨）
  const btns = document.querySelectorAll('.ctrl-click-fav');
  btns.forEach(btn => {
    btn.classList.toggle('on', clickFavMode);
    btn.textContent = clickFavMode ? '🖱️ 点击收藏：开' : '🖱️ 点击收藏：关';
    btn.title = clickFavMode ? '关闭点击收藏，点击字符恢复查看详情（会弹模态框）' : '点击收藏模式：点击字符直接收藏或取消，不弹模态框';
    btn.setAttribute('onclick', `setClickFavMode(${clickFavMode ? 'false' : 'true'})`);
  });
  showToast(clickFavMode ? '已开启点击收藏：点字符直接收藏/取消' : '已关闭点击收藏：点字符查看详情');
}

// ============================================================
// 初始化
// ============================================================
showOverview();
updateFavCount();
applyAnimSetting();
// 恢复上次的主题选择（此前每次刷新都会回到浅色）
applyTheme(lsGetRaw('unicode_theme', 'light') === 'dark');
// 界面风格（原版 / Material You，v0.2.20）
applyUiStyle();
// 版本更新后弹「本次更新」（v0.2.20）；延迟一点让首屏先稳
setTimeout(checkWhatsNew, 800);
// 左右滑动切栏目（v0.2.3）：监听挂在 document 上，手机上整个内容区都能划
initSwipeNav();
// 键盘左右箭头：在详情弹窗中切换前/后字符
document.addEventListener('keydown', (e) => {
  // v0.2.12：自定义确认弹窗层级最高，它开着时按键归它的处理器管（Esc=取消/Enter=确定），别穿透给下层
  const cfm = document.getElementById('confirmOverlay');
  if (cfm && cfm.classList.contains('show')) return;
  // 放大预览位于详情之上：优先处理它，且不把按键穿透给下层详情
  const zoom = document.getElementById('zoomOverlay');
  if (zoom.classList.contains('show')) {
    if (e.key === 'Escape') { e.preventDefault(); closeZoomPreview(); }
    return;
  }
  // v0.2.24：设置里的小卡片层级高于设置面板，Esc 先收卡片
  const sc = document.getElementById('settingsCardOverlay');
  if (sc.classList.contains('show')) {
    if (e.key === 'Escape') { e.preventDefault(); closeSettingsCard(); }
    return;
  }
  // 设置面板
  const settings = document.getElementById('settingsOverlay');
  if (settings.classList.contains('show')) {
    if (e.key === 'Escape') { e.preventDefault(); closeSettings(); }
    return;
  }
  const overlay = document.getElementById('modalOverlay');
  if (!overlay.classList.contains('show')) return;
  // Esc 永远生效（含输入框聚焦时）——必须排在输入框守卫之前，否则在「自定义含义」里打字时按 Esc 没反应
  if (e.key === 'Escape') {
    e.preventDefault();
    if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName || '') && e.target.blur) e.target.blur();
    closeModal();
    return;
  }
  // 忽略输入框中的按键
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); navigateDetail(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); navigateDetail(1); }
});
// 异步加载已存储的 Unicode 数据（不阻塞初始渲染）
unicodeDataReady = loadStoredUnicodeData().then(function () {
  // v0.2.2 离线模式：APK / 桌面版自带完整数据包，本机还没有缓存时自动解包一次，
  // 全程不联网；解包完写进 IndexedDB，之后的启动走缓存不再重复解。
  const isLocalApp = location.protocol === 'file:'
    || /^(127\.0\.0\.1|localhost)$/i.test(location.hostname || '');
  const hasData = unicodeData.charMap && unicodeData.charMap.size > 0;
  if (isLocalApp && !hasData) {
    // 必须调 Core 版：loadBundledUCD 会 await unicodeDataReady（就是本条链），互相等会永久卡死
    return loadBundledUCDCore(true).then(function (ok) {
      if (ok && currentView === 'overview') showOverview();
      else if (!ok) showToast('内置数据解包失败，重启应用试试，或到设置里重试');
    });
  }
});
// U4：概览页是同步渲染的，早于 IndexedDB 加载完成 → 「字符条目」会一直是「—」。
// 数据到位后如果在概览页就重绘一次。
unicodeDataReady.then(() => {
  if (currentView === 'overview') showOverview();
}).catch(() => {});
// 异步加载已安装的外置字体
loadCustomFonts();
// v0.2.5：本机装过扩展区字体包就直接生效（IndexedDB 里存的是 ArrayBuffer 列表）
idbGet(EXT_FONT_IDB).then(function (rec) {
  if (rec && rec.files && rec.files.length) return extFontApply(rec.files);
}).catch(function () {});
// v0.2.17：本机装过 BabelStone Han 字库包就直接生效（IndexedDB 里存的是 ArrayBuffer 列表）
idbGet(BSH_FONT_IDB).then(function (rec) {
  if (rec && rec.files && rec.files.length && rec.files[0] && rec.files[0].buf) return bshFontApply(rec.files[0].buf);
}).catch(function () {});
// v0.2.18：字典按需加载。网络不差就静默预热一份，第一次点开字符详情不用等；
// 省流量模式 / 2G 网络不预热，等用户真点开字典时再读
setTimeout(function () {
  const c = navigator.connection || {};
  if (c.saveData || /(^|-)2g$/.test(c.effectiveType || '')) return;
  wordDictEnsure();
}, 2500);
// 启动时（可选）检查一次新版本：延迟几秒，等首屏和字符数据都加载完再发
scheduleUpdateCheck();
// 初始化完成：此后的脚本错误属于可恢复的运行时错误，不该再升级成「页面未能正常启动」横幅
try { const _sp = document.getElementById('loadingSplash'); if (_sp) _sp.remove(); } catch (_) {}
appReady = true;
window.__uchxReady = true;  // v0.2.16：给头部看门狗用的就绪标志


</script>
