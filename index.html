function doLookalike() {
  var out = document.getElementById('lkResult');
  if (!out) return;
  var raw = (document.getElementById('lkInput') || {}).value || '';
  var chars = Array.from(raw);
  if (!chars.length) { out.innerHTML = '<div class="lk-empty">先输入一个字，比如 O、日、①、A，或者一个空格。</div>'; return; }
  var ch = chars[0], cp = ch.codePointAt(0);
  var groups = [], seenAll = {}, i, j, e, arr, ccp, inGroup;
  for (i = 0; i < LOOKALIKE_GROUPS.length; i++) {
    e = LOOKALIKE_GROUPS[i];
    arr = Array.from(e.s);
    var hit = false;
    for (j = 0; j < arr.length; j++) if (arr[j] === ch) { hit = true; break; }
    if (!hit) continue;
    var cps = []; inGroup = {};
    for (j = 0; j < arr.length; j++) {
      ccp = arr[j].codePointAt(0);
      if (ccp === cp || inGroup[ccp] || seenAll[ccp]) continue;
      inGroup[ccp] = 1; seenAll[ccp] = 1; cps.push(ccp);
    }
    if (cps.length) groups.push({ t: e.t, cps: cps });
  }
  var auto = lkAutoCandidates(cp), byTag = {}, order = [];
  for (i = 0; i < auto.length; i++) {
    var a = auto[i];
    if (a.cp === cp || seenAll[a.cp]) continue;
    seenAll[a.cp] = 1;
    if (!byTag[a.t]) { byTag[a.t] = []; order.push(a.t); }
    byTag[a.t].push(a.cp);
  }
  for (i = 0; i < order.length; i++) groups.push({ t: order[i], cps: byTag[order[i]] });
  if (!groups.length) {
    out.innerHTML = '<div class="lk-empty">没给 <b>' + escapeHtml(lkInvisible(cp) ? '(空白)' : ch)
      + '</b>（U+' + lkHex(cp) + '）找到内置形近字。试试这几个：'
      + '<button onclick="lkQuick(\'O\')">O</button>'
      + '<button onclick="lkQuick(\'日\')">日</button>'
      + '<button onclick="lkQuick(\'①\')">①</button>'
      + '<button onclick="lkQuick(\'A\')">A</button>'
      + '<button onclick="lkQuick(\' \')">空格</button></div>';
    return;
  }
  var total = 0;
  for (i = 0; i < groups.length; i++) total += groups[i].cps.length;
  var html = '<div style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.9">查的是 <b style="font-size:19px;color:var(--text)">'
    + escapeHtml(lkInvisible(cp) ? '(空白)' : ch) + '</b> U+' + lkHex(cp)
    + '　·　找到 <b style="color:var(--accent)">' + total + '</b> 个形近字'
    + (chars.length > 1 ? '（只查了第一个字）' : '') + '</div>';
  for (i = 0; i < groups.length; i++) {
    html += '<div class="lk-group"><div class="lk-gh">' + escapeHtml(groups[i].t)
      + ' · ' + groups[i].cps.length + ' 个</div><div class="lk-grid">';
    for (j = 0; j < groups[i].cps.length; j++) html += lkCardHTML(groups[i].cps[j]);
    html += '</div></div>';
  }
  out.innerHTML = html;
}

      <div class="tp-title">${ic('compare')}字符对比</div>
      <div class="tp-sub">输入两个字符，对比 Unicode 编码、HTML 实体、CSS 转义、代理对等差异。适用于外观相似的兼容字。</div>
      <div class="tp-row">
        <input type="text" id="cmpA" placeholder="字符 A (如: 中)" maxlength="8">
        <input type="text" id="cmpB" placeholder="字符 B (如: 中/兼容字)" maxlength="8">
        <button class="tp-btn" onclick="doCompare()">对比</button>
        <button class="tp-btn sec" onclick="document.getElementById('cmpA').value='';document.getElementById('cmpB').value='';document.getElementById('cmpResult').innerHTML='';">清空</button>
      </div>
      <div id="cmpResult"></div>
    </div>
  `;
  // v0.2.12：不再自动 focus——一进页面键盘就弹出来挡住半屏，太烦；想输入自己点输入框
  document.getElementById('cmpA').addEventListener('keydown', e=>{ if(e.key==='Enter') doCompare(); });
  document.getElementById('cmpB').addEventListener('keydown', e=>{ if(e.key==='Enter') doCompare(); });
}

function doCompare() {
  const a = document.getElementById('cmpA').value.trim();
  const b = document.getElementById('cmpB').value.trim();
  const out = document.getElementById('cmpResult');
  if (!a || !b) { out.innerHTML = ''; return; }
  const aChars = [...a], bChars = [...b];
  const ca = aChars[0]; // 只对比第一个字符
  const cb = bChars[0];
  // 输入了多个字符时明确提示，不再"静默只取第一个"
  const extraNote = (aChars.length > 1 || bChars.length > 1)
    ? `<div style="margin:10px 0;padding:8px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.6">
         ℹ️ ${aChars.length > 1 ? `字符 A 输入了 ${aChars.length} 个字符` : ''}${aChars.length > 1 && bChars.length > 1 ? '，' : ''}${bChars.length > 1 ? `字符 B 输入了 ${bChars.length} 个字符` : ''}，这里只对比各自的第一个字符。
       </div>`
    : '';
  const da = analyzeChar(ca);
  const db = analyzeChar(cb);
  const eq = da.cp === db.cp;

  const fieldEq = (va, vb) => va === vb;
  const clsEq = (va, vb) => fieldEq(va, vb) ? 'eq' : 'neq';

  // 大字符显示：不可见字符用标记
  const dispCh = (d) => {
    if (d.flags.isInvisible) {
      return `<span style="color:#d32f2f;font-weight:700;padding:2px 6px;border:2px dashed currentColor;border-radius:6px">${escapeHtml(d.display)}</span>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${escapeHtml(d.flags.invisibleDesc||'不可见')}</div>`;
    }
    return escapeHtml(d.char);
  };

  const surTag = (d) => d.isSurrogatePair ? '<span class="surrogate-tag">代理对</span>' : '';

  out.innerHTML = `
    ${extraNote}
    <div class="compare-result">
      <div class="compare-header">
        <div class="compare-char-cell">
          <div class="compare-char-big ${eq?'same':'diff'}">${dispCh(da)}</div>
          <div class="compare-char-meta"><b>U+${da.cpHex}</b> · ${escapeHtml(da.name)}${surTag(da)}</div>
        </div>
        <div class="compare-vs ${eq?'eq':'neq'}">${eq?'=' : '≠'}</div>
        <div class="compare-char-cell">
          <div class="compare-char-big ${eq?'same':'diff'}">${dispCh(db)}</div>
          <div class="compare-char-meta"><b>U+${db.cpHex}</b> · ${escapeHtml(db.name)}${surTag(db)}</div>
        </div>
      </div>
      <div class="compare-status ${eq?'same':'diff'}">${eq?'✅ 两字符编码完全相同（是同一个字）' : '❌ 编码不同 — 外观可能相似但非同一字符！'}</div>
      <div class="compare-glyphs" id="cmpGlyphBox">
        <div class="cmp-glyph-head">${ic('globe')}联网字形对比 <span style="font-size:11px;color:var(--muted)">（GlyphWiki · 本机字体缺字形时用它看权威字形）</span></div>
        <div class="cmp-glyph-row">
          <div class="cmp-glyph-slot" id="cmpGlyphSlotA"><span class="cmp-glyph-tag">A</span><button class="toggle-btn" onclick="cmpLoadGlyphs()">加载 A 的字形</button></div>
          <div class="cmp-glyph-slot" id="cmpGlyphSlotB"><span class="cmp-glyph-tag">B</span><button class="toggle-btn" onclick="cmpLoadGlyphs()">加载 B 的字形</button></div>
        </div>
      </div>
      <div class="compare-detail">
        <table>          <tr><th>码点</th><td><code class="${clsEq(da.cp,db.cp)}">U+${da.cpHex} (${da.cp})</code>${da.isSurrogatePair?` <span class="surrogate-tag">代理对</span>`:''}</td><td><code class="${clsEq(da.cp,db.cp)}">U+${db.cpHex} (${db.cp})</code>${db.isSurrogatePair?` <span class="surrogate-tag">代理对</span>`:''}</td></tr>
          ${da.isSurrogatePair ? `<tr><th>高代理</th><td><code>U+${da.highSurrogate.toString(16).toUpperCase().padStart(4,'0')}</code></td><td>${db.isSurrogatePair?`<code>U+${db.highSurrogate.toString(16).toUpperCase().padStart(4,'0')}</code>`:'—'}</td></tr>`:''}
          ${da.isSurrogatePair ? `<tr><th>低代理</th><td><code>U+${da.lowSurrogate.toString(16).toUpperCase().padStart(4,'0')}</code></td><td>${db.isSurrogatePair?`<code>U+${db.lowSurrogate.toString(16).toUpperCase().padStart(4,'0')}</code>`:'—'}</td></tr>`:''}
          <tr><th>UTF-16</th><td><code class="${clsEq(da.utf16,db.utf16)}">${escapeHtml(da.utf16)}</code></td><td><code class="${clsEq(da.utf16,db.utf16)}">${escapeHtml(db.utf16)}</code></td></tr>
          <tr><th>UTF-8</th><td><code class="${clsEq(da.utf8,db.utf8)}">${escapeHtml(da.utf8)}</code></td><td><code class="${clsEq(da.utf8,db.utf8)}">${escapeHtml(db.utf8)}</code></td></tr>
          <tr><th>HTML 实体</th><td><code class="${clsEq(da.html,db.html)}">${escapeHtml(da.html)}</code></td><td><code class="${clsEq(da.html,db.html)}">${escapeHtml(db.html)}</code></td></tr>
          <tr><th>CSS 转义</th><td><code class="${clsEq(da.css,db.css)}">${escapeHtml(da.css)}</code></td><td><code class="${clsEq(da.css,db.css)}">${escapeHtml(db.css)}</code></td></tr>
          <tr><th>URL 编码</th><td><code class="${clsEq(da.url,db.url)}">${escapeHtml(da.url)}</code></td><td><code class="${clsEq(da.url,db.url)}">${escapeHtml(db.url)}</code></td></tr>
          <tr><th>区块</th><td><code class="${clsEq(da.blockEn,db.blockEn)}">${escapeHtml(da.blockCn)} (${escapeHtml(da.blockEn)})</code></td><td><code class="${clsEq(da.blockEn,db.blockEn)}">${escapeHtml(db.blockCn)} (${escapeHtml(db.blockEn)})</code></td></tr>
          <tr><th>类别</th><td><code class="${clsEq(da.category,db.category)}">${escapeHtml(da.categoryCn)} (${escapeHtml(da.category)})</code></td><td><code class="${clsEq(da.category,db.category)}">${escapeHtml(db.categoryCn)} (${escapeHtml(db.category)})</code></td></tr>
        </table>
      </div>
    </div>
  `;

  // 记住这次对比的两个码点，「加载联网字形」用
  cmpGlyphCps = [da.cp, db.cp];
  cmpGlyphDone = false;
}

// ---- v0.2.5：对比页的联网字形 ----
let cmpGlyphCps = null;
let cmpGlyphDone = false;
async function cmpLoadGlyphs() {
  if (!cmpGlyphCps || cmpGlyphDone) return;
  cmpGlyphDone = true;
  const slots = [document.getElementById('cmpGlyphSlotA'), document.getElementById('cmpGlyphSlotB')];
  showToast('正在联网取字形…');
  for (let i = 0; i < 2; i++) {
    const tag = i === 0 ? 'A' : 'B';
    const cp = cmpGlyphCps[i];
    if (!slots[i]) continue;
    slots[i].innerHTML = '<span class="cmp-glyph-tag">' + tag + '</span><span class="cmp-glyph-loading">拉取中…</span>';
    const durl = await aiGlyphDataUrl(cp);
    if (durl) {
      slots[i].innerHTML = '<span class="cmp-glyph-tag">' + tag + '</span>'
        + '<img src="' + durl + '" alt="字形" style="width:110px;height:110px;object-fit:contain">'
        + '<span class="cmp-glyph-hex">U+' + cp.toString(16).toUpperCase().padStart(4, '0') + '</span>';
    } else {
      slots[i].innerHTML = '<span class="cmp-glyph-tag">' + tag + '</span>'
        + '<span class="cmp-glyph-none">GlyphWiki 没有这个字形</span>';
    }
  }
}

let lastBatchData = [];
let batchMode = 'encode'; // 'encode' 字符→编码  |  'decode' 编码→字符
let lastBatchSep = ' ';
// 单次解析上限：表格是逐字符一行渲染的，粘贴几万字会直接卡死页面，宁可截断并明确告知
const BATCH_MAX_CHARS = 2000;

function showBatch() {
  currentView = 'batch';
  currentChars = [];
  setActiveNav('batch');
  clearControlBar();
  setTitle('批量字符解析', 'batch');
  setCount('');
  document.getElementById('pagination').innerHTML = '';
  lastBatchData = [];

  const el = document.getElementById('content');
  el.innerHTML = `

      <div class="batch-mode-switch" id="batchModeSwitch">

      </div>

      <div class="tp-row" style="margin-top:8px;align-items:center;flex-wrap:wrap;gap:8px">

          <input type="checkbox" id="batchLiveToggle" checked style="margin:0"> 实时解析
        </label>
        <button class="tp-btn" onclick="doBatch()">${ic('zap')}立即解析</button>
        <button class="tp-btn sec" onclick="clearBatchInput()">清空</button>
      </div>
      <div id="batchResult"></div>
    </div>
  `;
  const ta = document.getElementById('batchInput');
  // v0.2.13：不再自动 focus——进页面就弹键盘挡半屏；想粘贴/输入自己点输入框
  // Ctrl+Enter 立即解析
  ta.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') doBatch(); });
  // 实时解析（input 事件 + 防抖 120ms）
  ta.addEventListener('input', () => {
    const live = document.getElementById('batchLiveToggle');
    if (!live || !live.checked) {
      document.getElementById('batchStatus').textContent = '已暂停实时解析';
      return;
    }
    clearTimeout(batchTimer);
    document.getElementById('batchStatus').textContent = '正在输入…';
    batchTimer = setTimeout(() => {
      doBatch(true);

let batchTimer = null;

function switchBatchMode(mode) {
  batchMode = mode;
  clearTimeout(batchTimer); // 取消待处理的实时解析定时器
  const sw = document.getElementById('batchModeSwitch');
  if (sw) {
    sw.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    sw.querySelectorAll('button')[mode === 'encode' ? 0 : 1].classList.add('active');
  }
  const sub = document.getElementById('batchSub');
  const ta = document.getElementById('batchInput');
  if (mode === 'encode') {
    if (sub) sub.innerHTML = '粘贴或输入任意文本，<b>实时</b>逐字符解析出 Unicode 编码、HTML 实体、CSS 转义、URL 编码等。支持代理对识别，并用 / 隔开批量复制。<b>点击字符单元格可查看详情</b>。';
    if (ta) ta.placeholder = '请在此粘贴/输入要解析的字符... 例如：Hello,世界! 😀 你好世界。';
  } else {
    if (sub) sub.innerHTML = '粘贴或输入 Unicode 编码，自动<b>反向解析</b>为对应字符。支持格式：<code>U+4E16</code>、<code>\\u4e16</code>、<code>\\u{1F600}</code>、<code>0x4E16</code>、<code>&#19990;</code>、<code>&#x4e16;</code>、<code>&amp;amp;</code>、<code>\\4E16</code>（CSS）、<code>%E4%B8%AD</code>（URL）、纯十进制 <code>19990</code>、纯十六进制 <code>4E16</code>。多个编码用空格/逗号/分号/换行分隔，也支持编码与文本混合。';
    if (ta) ta.placeholder = '支持多种格式混合输入：\nU+4E16 \\u4e16 0x1F600 &#19990; &#x4e16; \\4E16 %E4%B8%AD &amp; 19990 4e16\n也可直接粘贴含编码的混合文本，工具会自动提取。';
  }
  // 保存当前分隔符
  const sepInput = document.getElementById('batchSepInput');
  if (sepInput) lastBatchSep = sepInput.value;
  // 清空旧结果
  const out = document.getElementById('batchResult');
  if (out) out.innerHTML = '';
  const s = document.getElementById('batchStatus');
  if (s) s.textContent = '等待输入…';
  lastBatchData = [];
  // v0.2.13：切模式不再自动 focus 弹键盘
  // 切换后如果输入框有内容，立即按新模式重新解析
  if (ta && ta.value) {
    doBatch();
  }
}

function clearBatchInput() {
  const ta = document.getElementById('batchInput');
  if (ta) ta.value = '';
  const out = document.getElementById('batchResult');
  if (out) out.innerHTML = '';
  const s = document.getElementById('batchStatus');
  if (s) s.textContent = '已清空';
  lastBatchData = [];
}

function doBatch(isLive) {
  const text = document.getElementById('batchInput').value;
  const out = document.getElementById('batchResult');
  const status = document.getElementById('batchStatus');
  if (!text) { out.innerHTML = ''; lastBatchData = []; if (status) status.textContent = '等待输入…'; return; }

  if (batchMode === 'decode') {
    // 反向模式：编码 → 字符
    let cps = parseCodepoints(text);
    if (!cps.length) {
      out.innerHTML = '';
      lastBatchData = [];
      if (status) status.textContent = '⚠ 未识别到有效编码，请检查格式';
      return;
    }
    const cpsTotal = cps.length;
    const cutDecode = cpsTotal > BATCH_MAX_CHARS;
    if (cutDecode) cps = cps.slice(0, BATCH_MAX_CHARS);
    lastBatchData = cps.map(cp => {
      const ch = safeChr(cp);
      return ch ? analyzeChar(ch) : { cp, char: '', display: '∅', name: '无效码点', cpHex: cp.toString(16).toUpperCase().padStart(4,'0'), isSurrogatePair: false, flags: {}, blockCn: '—', categoryCn: '—', category: '—', utf16: '—', utf8: '—', html: '—', htmlHex: '—', css: '—', url: '—' };
    });
    renderBatchResult();
    restoreBatchSep();
    // 显示拼接结果
    const sepEl = document.getElementById('batchSepInput');
    let sep = sepEl ? sepEl.value : lastBatchSep;
    if (sep === '\\n') sep = '\n';
    const joinedStr = lastBatchData.map(d => d.char).join(sep);
    const joinedDiv = document.createElement('div');
    joinedDiv.className = 'batch-joined-result';
    joinedDiv.innerHTML = '<span style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">拼接结果：</span>' +
      '<span id="batchJoinedText">' + escapeHtml(joinedStr) + '</span>' +
      '<button class="copy-joined" onclick="copyText(document.getElementById(\'batchJoinedText\').textContent);showToast(\'已复制\')">复制</button>';
    out.insertBefore(joinedDiv, out.firstChild);
    if (status) {
      const t = lastBatchData.length;
      const invalid = lastBatchData.filter(d => d.name === '无效码点').length;
      status.textContent = `✓ 已解析 ${t} 个编码${invalid ? `（${invalid} 个无效）` : ''}`
        + (cutDecode ? `　⚠ 共识别到 ${cpsTotal} 个编码，为避免卡顿仅解析前 ${BATCH_MAX_CHARS} 个，可分段粘贴` : '');
    }
    return;
  }

  // 正向模式：字符 → 编码
  const allChars = [...text];
  const cutEncode = allChars.length > BATCH_MAX_CHARS;
  const chars = cutEncode ? allChars.slice(0, BATCH_MAX_CHARS) : allChars;
  lastBatchData = chars.map(ch => analyzeChar(ch));
  renderBatchResult();
  restoreBatchSep();
  if (status) {
    const t = lastBatchData.length;
    const sur = lastBatchData.filter(d => d.isSurrogatePair).length;
    status.textContent = `✓ 已解析 ${t} 个字符${sur ? `（含 ${sur} 个代理对）` : ''}`
      + (cutEncode ? `　⚠ 原文共 ${allChars.length} 个字符，为避免卡顿仅解析前 ${BATCH_MAX_CHARS} 个，可分段粘贴` : '');
  }
}

// HTML 命名实体映射

// 从文本中提取所有码点（支持多种格式）
function parseCodepoints(text) {
  // 支持的格式：
  //  1. U+XXXX / u+XXXX
  //  2. \uXXXX / \u{XXXX} (JS 转义，含代理对自动合并)
  //  3. 0xXXXX
  //  4. &#NNNN; (十进制 HTML 实体，含代理对自动合并)
  //  5. &#xXXXX; (十六进制 HTML 实体，含代理对自动合并)
  //  6. &name; (HTML 命名实体，如 &amp; &copy; &lt; 等)
  //  7. \XXXX (CSS 转义，1-6 位十六进制)
  //  8. %XX (URL 编码，自动解码多字节 UTF-8)
  //  9. 纯十进制码点
  // 10. 纯十六进制码点
  // 支持分隔输入与混合文本（自动提取有明确标记的编码）

  const cps = [];
  let pos = 0;
  const len = text.length;

  // 检测是否含有明确编码标记（用于区分分隔输入与混合文本）
  const hasMarker = /[Uu]\+|\\u[\d{]|0[xX]|&#|&[a-zA-Z]+;|\\[0-9A-Fa-f]{1,6}(?:\s|$)|%[0-9A-Fa-f]{2}/.test(text);

  function pushCp(cp) {
    if (cp !== null && cp >= 0 && cp <= 0x10FFFF && !(cp >= 0xD800 && cp <= 0xDFFF)) {
      cps.push(cp);
    }
  }

  // 合并 UTF-16 代理对：高位代理先暂存，遇到低位代理时合并为补充码点
  // 注意：不能走 pushCp（它会把 D800-DFFF 直接丢掉，导致配对永远无法发生）
  function pushCpWithSurrogate(cp) {
    if (cp === null || cp < 0 || cp > 0x10FFFF) return;
    if (cp >= 0xD800 && cp <= 0xDBFF) {
      const prev = cps.length ? cps[cps.length - 1] : null;
      if (prev !== null && prev >= 0xD800 && prev <= 0xDBFF) cps[cps.length - 1] = cp; // 连续高位代理，后者覆盖
      else cps.push(cp);
      return;
    }
    if (cp >= 0xDC00 && cp <= 0xDFFF) {
      const prev = cps.length ? cps[cps.length - 1] : null;
      if (prev !== null && prev >= 0xD800 && prev <= 0xDBFF) {
        // 合并代理对
        cps[cps.length - 1] = (prev - 0xD800) * 0x400 + (cp - 0xDC00) + 0x10000;
        return;
      }
      return; // 孤立低位代理，丢弃
    }
    pushCp(cp);
  }

  while (pos < len) {
    const ch = text[pos];
    let matched = false;

    // --- 1. U+XXXX / u+XXXX ---
    if ((ch === 'U' || ch === 'u') && pos + 1 < len && text[pos + 1] === '+') {
      const m = text.slice(pos).match(/^[Uu]\+([0-9A-Fa-f]{1,6})/);
      if (m) { pushCp(parseInt(m[1], 16)); pos += m[0].length; matched = true; }
    }

    // --- 2. \uXXXX / \u{XXXX} (JS 转义) ---
    if (!matched && ch === '\\' && pos + 1 < len && text[pos + 1] === 'u') {
      // \u{XXXXX}
      let m = text.slice(pos).match(/^\\u\{([0-9A-Fa-f]{1,6})\}/);
      if (m) {
        pushCpWithSurrogate(parseInt(m[1], 16));
        pos += m[0].length; matched = true;
      }
      // \uXXXX (恰好 4 位十六进制)
      if (!matched) {
        m = text.slice(pos).match(/^\\u([0-9A-Fa-f]{4})/);
        if (m) {
          pushCpWithSurrogate(parseInt(m[1], 16));
          pos += m[0].length; matched = true;
        }
      }
    }

    // --- 3. 0xXXXX ---
    if (!matched && ch === '0' && pos + 1 < len && (text[pos + 1] === 'x' || text[pos + 1] === 'X')) {
      const m = text.slice(pos).match(/^0[xX]([0-9A-Fa-f]{1,6})/);
      if (m) { pushCp(parseInt(m[1], 16)); pos += m[0].length; matched = true; }
    }

    // --- 4 & 5. &#NNNN; / &#xXXXX; (HTML 数字实体) ---
    if (!matched && ch === '&' && pos + 1 < len && text[pos + 1] === '#') {
      let m = text.slice(pos).match(/^&#[xX]([0-9A-Fa-f]{1,6});?/);
      if (m) {
        pushCpWithSurrogate(parseInt(m[1], 16));
        pos += m[0].length; matched = true;
      }
      if (!matched) {
        m = text.slice(pos).match(/^&#(\d+);?/);
        if (m) {
          pushCpWithSurrogate(parseInt(m[1], 10));
          pos += m[0].length; matched = true;
        }
      }
    }

    // --- 6. &name; (HTML 命名实体) ---
    if (!matched && ch === '&' && pos + 1 < len && /[a-zA-Z]/.test(text[pos + 1])) {
      const m = text.slice(pos).match(/^&[a-zA-Z]+;/);
      if (m && HTML_NAMED_ENTITIES[m[0]] !== undefined) {
        pushCp(HTML_NAMED_ENTITIES[m[0]]);
        pos += m[0].length; matched = true;
      }
    }

    // --- 7. \XXXX (CSS 转义，1-6 位十六进制，可跟一个可选空格) ---
    if (!matched && ch === '\\') {
      const m = text.slice(pos).match(/^\\([0-9A-Fa-f]{1,6})\s?/);
      if (m) {
        // 排除已被上面 \u 处理的情况（\u 开头且后面不是 { 也不是恰好 4 位十六进制时，才可能是 CSS）
        // 实际上 \uXXXX 已在第 2 步处理，此处 \u 开头的不会再匹配到（因为第 2 步优先）
        pushCp(parseInt(m[1], 16));
        pos += m[0].length; matched = true;
      }
    }

    // --- 8. %XX (URL 编码，连续 %XX 序列解码为 UTF-8) ---
    if (!matched && ch === '%' && pos + 2 < len && /[0-9A-Fa-f]{2}/.test(text.slice(pos + 1, pos + 3))) {
      let end = pos;
      const bytes = [];
      while (end < len && text[end] === '%' && end + 2 < len && /[0-9A-Fa-f]{2}/.test(text.slice(end + 1, end + 3))) {
        bytes.push(parseInt(text.slice(end + 1, end + 3), 16));
        end += 3;
      }
      try {
        const decoded = new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array(bytes));
        for (const c of decoded) pushCp(c.codePointAt(0));
        pos = end; matched = true;
      } catch (e) {
        // UTF-8 解码失败，逐字节当作 Latin-1 处理
        for (const b of bytes) pushCp(b);
        pos = end; matched = true;
      }
    }

    // --- 9 & 10. 纯十进制 / 纯十六进制（仅在分隔 token 中尝试） ---
    if (!matched && !hasMarker) {
      const m = text.slice(pos).match(/^(\d{1,7}|[0-9A-Fa-f]{1,6})(?=[\s,;，；|\t\n\r]|$)/);
      if (m) {
        const tok = m[1];
        let cp;
        if (/^\d+$/.test(tok)) {
          cp = parseInt(tok, 10);
        } else {
          cp = parseInt(tok, 16);
        }
        if (cp >= 0 && cp <= 0x10FFFF) pushCp(cp);
        pos += m[0].length; matched = true;
      }
    }

    if (!matched) pos++;
  }

  // 清理未能配对的孤立代理码点
  return cps.filter(cp => !(cp >= 0xD800 && cp <= 0xDFFF));
}

function updateBatchPreview() {
  const preview = document.getElementById('batchPreview');
  if (!preview || !lastBatchData.length) return;
  // 解码模式已有拼接结果，隐藏复制预览
  if (batchMode === 'decode') { preview.style.display = 'none'; return; }
  preview.style.display = '';
  const col = document.getElementById('batchCopyCol').value;
  if (!col) return;
  let sep = document.getElementById('batchSepInput').value;
  if (sep === '\\n' || sep === '\n') sep = '\n';
  const colNames = {cp:'U+ 编码',cpDec:'十进制',html:'HTML(十进制)',htmlHex:'HTML(十六进制)',css:'CSS',utf8:'UTF-8',utf16:'UTF-16',url:'URL',char:'原字符',display:'显示标记'};
  const values = lastBatchData.map(d => {
    let v = {cp:`U+${d.cpHex}`,cpDec:String(d.cp),html:d.html,htmlHex:d.htmlHex,css:d.css,utf8:d.utf8,utf16:d.utf16,url:d.url,char:d.char,display:d.display}[col];
    if (v === undefined) return '';
    if (col === 'utf8' || col === 'utf16') v = v.replace(/ /g, '/');
    return v;
  });
  const text = values.join(sep);
  const sepDisplay = sep === '\n' ? '↵' : (sep === ' ' ? '␣' : (sep === '' ? '∅' : sep));
  preview.innerHTML = '<span style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">复制预览 (' + (colNames[col]||col) + '，分隔符: ' + escapeHtml(sepDisplay) + '，' + values.length + ' 项)：</span>' +
    '<span style="user-select:all;cursor:text">' + escapeHtml(text) + '</span>';
}

function setBatchSep(val) {
  const input = document.getElementById('batchSepInput');
  if (!input) return;
  input.value = (val === '\\n') ? '\n' : val;
  lastBatchSep = input.value;
  syncSepBtnHighlight();
  updateBatchPreview();
}

// 同步分隔符预设按钮的高亮（表格重绘后也必须调用，否则高亮会莫名丢失）
function syncSepBtnHighlight() {
  const input = document.getElementById('batchSepInput');
  if (!input || !input.parentElement) return;
  const labels = ['/', ',', ' ', '\\n', ''];
  const cur = input.value;
  input.parentElement.querySelectorAll('.sep-btn').forEach((b, i) => {
    b.classList.toggle('on', labels[i] === cur || (labels[i] === '\\n' && cur === '\n'));
  });
}

function restoreBatchSep() {
  const input = document.getElementById('batchSepInput');
  if (input && lastBatchSep !== ' ') {
    input.value = lastBatchSep;
  }
  syncSepBtnHighlight();
  updateBatchPreview();
}

function copyBatchColumn() {
  if (!lastBatchData.length) { showToast('请先解析字符'); return; }
  const col = document.getElementById('batchCopyCol').value;
  let sep = document.getElementById('batchSepInput').value;
  if (sep === '\\n') sep = '\n';

  const values = lastBatchData.map(d => {
    let v = {
      cp: `U+${d.cpHex}`,
      cpDec: String(d.cp),
      html: d.html,
      htmlHex: d.htmlHex,
      css: d.css,
      utf8: d.utf8,
      utf16: d.utf16,
      url: d.url,
      char: d.char,
      display: d.display,
    }[col];
    if (v === undefined) return undefined;
    // UTF-8/UTF-16 字节间始终用 / 分隔，避免与字符分隔符混淆
    if (col === 'utf8' || col === 'utf16') v = v.replace(/ /g, '/');
    return v;
  }).filter(v => v !== undefined);

  const text = values.join(sep);
  copyText(text);
  showToast(`已复制 ${values.length} 项`);
}

// ============================================================
// 详情弹窗
// ============================================================
// silent=true：同一字符的原地重绘（保存编辑、切换收藏状态），
// 不重复写浏览记录/操作日志，并保留弹窗滚动位置，避免编辑长释义后被打回顶部
// 通用抬层：把要打开的弹窗顶到当前所有浮层之上。
// 不写死数字，是因为浮层来源不一（设置小卡片 250、AI 面板/同步预览 300、字体对比 310…），
// 固定数值迟早再撞一次；这里按“当前最高的那个 +1”算，关掉时各自还原。
function raiseModalAbove(el) {
  if (!el) return;
  let top = 0;
  const all = document.querySelectorAll('.modal-overlay.show, .scard-overlay.show');
  for (let i = 0; i < all.length; i++) {
    if (all[i] === el) continue;
    const z = parseInt(getComputedStyle(all[i]).zIndex, 10) || 0;
    if (z > top) top = z;
  }
  el.style.zIndex = String(Math.max(300, top + 1));
}

  `;

  // 导航栏：在字符列表中切换前/后字符
  let navHTML = '';
  if (detailList && detailList.length > 0) {
    const idx = detailList.indexOf(cp);
    if (idx >= 0) {
      let hasPrev, hasNext, posText;
      if (currentView === 'all') {
        // 全部字符视图：显示全局位置，支持跨页
        const globalIdx = currentPage * PAGE_SIZE + idx;
        hasPrev = globalIdx > 0;
        hasNext = globalIdx < allCharsTotal - 1;
        posText = `${globalIdx.toLocaleString()} / ${allCharsTotal.toLocaleString()}`;
      } else {
        hasPrev = idx > 0;
        hasNext = idx < detailList.length - 1;
        posText = `${idx + 1} / ${detailList.length}`;
      }
      navHTML = `
        <div class="detail-nav" id="detailNav">
          <button class="nav-arrow" onclick="navigateDetail(-1)" ${!hasPrev?'disabled':''} title="上一个字符（← ）">◀ 上一个</button>
          <span class="nav-pos">${posText}</span>
          <button class="nav-arrow" onclick="navigateDetail(1)" ${!hasNext?'disabled':''} title="下一个字符（→）">下一个 ▶</button>
        </div>
      `;
    }
  }
  const oldNav = document.getElementById('detailNav');
  if (oldNav) oldNav.remove();
  if (navHTML) {
    const modal = document.getElementById('modal');
    modal.insertAdjacentHTML('beforeend', navHTML);
  }

  document.getElementById('modalOverlay').classList.add('show');
  bodyEl.scrollTop = keepScroll;
}

// 切换详情弹窗到前/后字符（dir: -1 上一个, 1 下一个）
// 全部字符视图支持跨页：到页边界时自动翻到上/下一页
function navigateDetail(dir) {
  if (!detailList || detailCP === null) return;
  const idx = detailList.indexOf(detailCP);
  if (idx < 0) return;
  const next = idx + dir;

  // 常规视图：直接用列表中的下一个
  if (next >= 0 && next < detailList.length) {
    showDetail(detailList[next]);
    const modalBody = document.getElementById('modalBody');
    if (modalBody) modalBody.scrollTop = 0;
    return;
  }

  // 全部字符视图：跨页导航
  if (currentView === 'all') {
    buildAllSegIndex();
    const globalIdx = currentPage * PAGE_SIZE + idx;
    const newGlobalIdx = globalIdx + dir;
    if (newGlobalIdx < 0 || newGlobalIdx >= allCharsTotal) return;
    const newPage = Math.floor(newGlobalIdx / PAGE_SIZE);
    if (newPage !== currentPage) {
      currentPage = newPage;
      renderGrid();
      document.getElementById('contentScroll').scrollTop = 0;
    }
    const localIdx = newGlobalIdx - newPage * PAGE_SIZE;
    const newCP = currentChars[localIdx];
    if (newCP !== undefined) {
      showDetail(newCP);
      const modalBody = document.getElementById('modalBody');
      if (modalBody) modalBody.scrollTop = 0;
    }
  }
}

function renderWarningBanner(flags) {

// ============================================================
// 自定义确认/输入弹窗（v0.2.12）——替代原生 confirm() / prompt()
// file:// 环境下原生弹窗会显示「网址为"file://"的网页显示」抬头，观感极差；
// 且无法自定义按钮文字。这里统一走应用内弹窗：
//   uiConfirm(msg, opts) → Promise<boolean>
//   uiPrompt(title, msg, defVal) → Promise<string|null>（取消返回 null）
// 用法：把宿主函数改成 async，然后 if (!(await uiConfirm(...))) return;
// ============================================================
let _confirmResolve = null;
let _confirmKind = 'confirm'; // 'confirm' | 'prompt'
function _confirmKeyHandler(e) {
  if (e.key === 'Escape') { e.preventDefault(); finishConfirm(false); }
  else if (e.key === 'Enter') { e.preventDefault(); finishConfirm(true); }
}
function _openConfirmOverlay() {
  document.getElementById('confirmOverlay').classList.add('show');
  document.addEventListener('keydown', _confirmKeyHandler);
}
function cancelConfirmOverlay() { finishConfirm(false); }
function finishConfirm(ok) {
  const ov = document.getElementById('confirmOverlay');
  if (!ov || !ov.classList.contains('show')) return;
  ov.classList.remove('show');
  document.removeEventListener('keydown', _confirmKeyHandler);
  const r = _confirmResolve;
  _confirmResolve = null;
  if (!r) return;
  if (_confirmKind === 'prompt') r(ok ? document.getElementById('confirmInput').value : null);
  else r(!!ok);
}
function uiConfirm(msg, opts) {
  opts = opts || {};
  _confirmKind = 'confirm';
  document.getElementById('confirmTitle').textContent = opts.title || '确认操作';
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmInputRow').style.display = 'none';
  document.getElementById('confirmOkBtn').textContent = opts.okText || '确定';
  // 危险操作把确定键做成红色，视觉上多一道提醒
  document.getElementById('confirmOkBtn').style.background = opts.danger ? '#e53935' : 'var(--accent)';
  _openConfirmOverlay();
  return new Promise(function (res) { _confirmResolve = res; });
}
function uiPrompt(title, msg, defVal) {
  _confirmKind = 'prompt';
  document.getElementById('confirmTitle').textContent = title || '请输入';
  document.getElementById('confirmMsg').textContent = msg || '';
  document.getElementById('confirmInputRow').style.display = 'block';
  const inp = document.getElementById('confirmInput');
  inp.value = defVal || '';
  document.getElementById('confirmOkBtn').textContent = '确定';
  document.getElementById('confirmOkBtn').style.background = 'var(--accent)';
  _openConfirmOverlay();
  // 输入型弹窗聚焦输入框并全选，方便直接改（这里是用户主动点按钮进来的，弹键盘是预期行为）
  setTimeout(function () { try { inp.focus(); inp.select(); } catch (e) {} }, 60);
  return new Promise(function (res) { _confirmResolve = res; });
}
function copyText(text) {
  const str = String(text);
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(ok ? `已复制: ${str.slice(0,30)}` : '复制失败，请手动选择文本复制');
    } catch (e) {
      showToast('复制失败，请手动选择文本复制');
    }
  };
  // F1：http:// 部署（非安全上下文）下 navigator.clipboard 为 undefined，直接调用会同步抛错
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    navigator.clipboard.writeText(str).then(
      () => showToast(`已复制: ${str.slice(0,30)}`),
      () => fallback()
    );
  } else {
    fallback();
  }
}

function closeZoomPreview() {

    _zo.style.zIndex = '';   // 还原 AI 面板场景下抬高的层级
    _zo.classList.remove('show');
  }

function updateZoomPreview() {
  if (zoomCP === null) return;

  const canvas = document.getElementById('zoomCanvas');
  const ctx = canvas.getContext('2d');
  const flags = getCharFlags(zoomCP);
  const char = flags.isInvisible ? flags.invisibleMark : String.fromCodePoint(zoomCP);
  const fontSize = parseInt(document.getElementById('zoomSize').value);
  const fontColor = document.getElementById('zoomColor').value;
  const bgColor = document.getElementById('zoomBgColor').value;
  const isBold = document.getElementById('zoomBold').checked;

  document.getElementById('zoomSizeValue').textContent = fontSize;

  // 绘制背景
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制字符（不可见字符绘制标记）
  ctx.fillStyle = fontColor;
  // 不可见标记若是英文字母组合，使用更小的字号避免溢出
  const isLongMark = flags.isInvisible && flags.invisibleMark.length > 2;
  const renderFontSize = isLongMark ? fontSize * 0.6 : fontSize;
  // F2：带上已安装的外置字体，否则导出的图里自定义字体字符会变成豆腐块
  const customStack = (typeof customFonts !== 'undefined' && customFonts.length)
    ? customFonts.map(f => `"CustomFont_${f.name}"`).join(', ') + ', '
    : '';
  ctx.font = `${isBold ? 'bold ' : ''}${renderFontSize}px ${customStack}"Microsoft YaHei", "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, canvas.width / 2, canvas.height / 2);

  // 不可见字符添加虚线框提示
  if (flags.isInvisible) {
    ctx.strokeStyle = fontColor;
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 2;
    const pad = 20;
    ctx.strokeRect(pad, pad, canvas.width - pad * 2, canvas.height - pad * 2);
    ctx.setLineDash([]);
  }
}

async function exportImage(format) {
  if (zoomCP === null) return;
  // F2：等外置字体加载完再画，否则首次导出会拿到回退字体
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
    // 字体到位后重画一遍，再从 canvas 取图
    updateZoomPreview();
  }

  const canvas = document.getElementById('zoomCanvas');
  const flags = getCharFlags(zoomCP);
  const char = flags.isInvisible ? flags.invisibleMark : String.fromCodePoint(zoomCP);
  const code = zoomCP.toString(16).toUpperCase().padStart(4, '0');

  if (format === 'svg') {
    exportSVG(char, code, flags);
    return;
  }

  // 导出为位图格式
  const mimeType = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
  const ext = format === 'jpeg' ? 'jpg' : format;

  canvas.toBlob((blob) => {
    // F3：toBlob 可能返回 null；不支持 webp 时浏览器会静默回退成 png（文件名却还叫 .webp）
    if (!blob) { showToast('❌ 导出失败：浏览器不支持该图片格式，请换一种格式'); return; }
    const realExt = blob.type === 'image/jpeg' ? 'jpg'
                  : blob.type === 'image/webp' ? 'webp'
                  : blob.type === 'image/png' ? 'png' : ext;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `unicode_${code}_${char.replace(/[/\\:*?"<>|]/g, '_')}.${realExt}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(realExt !== ext ? `浏览器不支持 ${ext.toUpperCase()}，已导出为 ${realExt.toUpperCase()}` : `已导出 ${format.toUpperCase()}`);
  }, mimeType, 0.95);
}

function exportSVG(char, code, flags) {
  const fontSize = document.getElementById('zoomSize').value;
  const fontColor = document.getElementById('zoomColor').value;
  const bgColor = document.getElementById('zoomBgColor').value;
  const isBold = document.getElementById('zoomBold').checked;
  const isLongMark = flags && flags.isInvisible && flags.invisibleMark.length > 2;
  const renderFontSize = isLongMark ? fontSize * 0.6 : fontSize;
  const dashRect = flags && flags.isInvisible
    ? `<rect x="20" y="20" width="360" height="360" fill="none" stroke="${fontColor}" stroke-width="2" stroke-dasharray="8,6"/>`
    : '';

  const svgChar = String(char).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 与位图导出保持一致：带上已安装的外置字体，否则 SVG 里自定义字体字符是豆腐块
  const svgFontStack = ((typeof customFonts !== 'undefined' && customFonts.length)
    ? customFonts.map(f => `CustomFont_${f.name}`).join(', ') + ', '
    : '') + 'Microsoft YaHei, PingFang SC, sans-serif';

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="${bgColor}"/>
  ${dashRect}
  <text x="200" y="200" dominant-baseline="central" text-anchor="middle"
        font-family="${svgFontStack}"
        font-size="${renderFontSize}"
        font-weight="${isBold ? 'bold' : 'normal'}"
        fill="${fontColor}">${svgChar}</text>
</svg>`;

  const blob = new Blob([svg], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `unicode_${code}_${char.replace(/[/\\:*?"<>|]/g, '_')}.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 SVG');
}

const SYNC_API = 'https://unchaxun.pages.dev/api/sync';
const SYNC_ITEMS = [
  { key: 'favorites',  label: '收藏',       storage: 'unicode_favorites',        kind: 'list' },
  { key: 'categories', label: '收藏分类',   storage: 'unicode_fav_categories',   kind: 'map'  },
  { key: 'meanings',   label: '自定义字义', storage: 'unicode_custom_meanings',  kind: 'map'  },
  { key: 'worddict',   label: '自定义字典', storage: 'unicode_custom_word_dict', kind: 'map'  },
  { key: 'history',    label: '浏览记录',   storage: 'unicode_history',          kind: 'list' },
  { key: 'searches',   label: '最近搜索',   storage: 'recentSearches',           kind: 'list' },
  { key: 'eggs',       label: '彩蛋图鉴',   storage: 'unicode_egg_found_v2',     kind: 'list' },
];
const SYNC_ON_BY_DEFAULT = { favorites: true, categories: true, meanings: true, worddict: true, history: false, searches: false, eggs: true };
let syncSelection = Object.assign({}, SYNC_ON_BY_DEFAULT);
let syncLastPayload = null;      // 待确认的对方数据
let syncCodeTimer = null;
let syncCodeShown = null;        // 已生成的取件码，重渲染设置面板后仍显示

function syncReadItem(item) {
  const raw = lsGetRaw(item.storage, null);
  const empty = item.kind === 'list' ? [] : {};
  if (!raw) return empty;
  try {
    const v = JSON.parse(raw);
    if (item.kind === 'list') return Array.isArray(v) ? v : [];
    return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  } catch (e) { return empty; }
}

function syncCountOf(item, val) {
  if (item.kind === 'list') return Array.isArray(val) ? val.length : 0;
  return (val && typeof val === 'object') ? Object.keys(val).length : 0;
}

function buildSyncPayload(sel, includeEmpty) {
  const items = {};
  for (const it of SYNC_ITEMS) {
    if (!sel[it.key]) continue;
    const v = syncReadItem(it);
    // 备份快照要连「空的」也记下来，否则撤销时没法把同步后新增的项清回去
    if (!includeEmpty && syncCountOf(it, v) === 0) continue;
    items[it.key] = v;
  }
  return { app: 'unicode-chaxun', v: 1, at: Date.now(), items: items };
}

function syncPayloadSummary(payload) {
  const items = (payload && payload.items) || {};
  const rows = [];
  for (const it of SYNC_ITEMS) {
    if (!items[it.key]) continue;
    rows.push({ key: it.key, label: it.label, remote: syncCountOf(it, items[it.key]), local: syncCountOf(it, syncReadItem(it)) });
  }
  return rows;
}

// ---- 加解密：取件码当口令，PBKDF2 派生 -> AES-GCM ----
function bytesToB64(u8) {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function b64ToBytes(str) {
  const s = atob(str);
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
async function syncDeriveKey(code, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode('uchx-sync:' + code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 120000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function syncEncrypt(text, code) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await syncDeriveKey(code, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(text));
  return JSON.stringify({ v: 1, salt: bytesToB64(salt), iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(ct)) });
}
async function syncDecrypt(envelope, code) {
  const env = typeof envelope === 'string' ? JSON.parse(envelope) : envelope;
  const key = await syncDeriveKey(code, b64ToBytes(env.salt));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(env.iv) }, key, b64ToBytes(env.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---- 发送：取件码 ----
async function syncSendByCode() {
  const payload = buildSyncPayload(syncSelection);
  if (!Object.keys(payload.items).length) { showToast('至少勾选一项有内容的资料'); return; }
  const json = JSON.stringify(payload);
  const btn = document.getElementById('syncSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = '正在上传…'; }
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const code = String(Math.floor(100000 + Math.random() * 900000));
      const body = await syncEncrypt(json, code);
      const r = await fetch(SYNC_API + '?action=put&code=' + code, { method: 'POST', body: body });
      if (r.status === 409) continue;   // 撞码了，换一个
      if (!r.ok) { showToast('上传失败（' + r.status + '）'); return; }
      const j = await r.json();
      renderSyncCode(j.code || code);
      return;
    }
    showToast('取件码分配失败，请重试');
  } catch (e) {
    showToast('上传失败：' + (e && e.message ? e.message : '网络错误'));
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = ic('upload') + '生成取件码'; }
  }
}

function renderSyncCode(code) {
  syncCodeShown = code;
  const box = document.getElementById('syncCodeBox');
  if (!box) return;
  box.style.display = 'block';
  const num = document.getElementById('syncCodeNum');
  if (num) num.textContent = code;
  let left = 600;
  if (syncCodeTimer) clearInterval(syncCodeTimer);
  const tick = () => {
    const m = Math.floor(left / 60), s = left % 60;
    const t = document.getElementById('syncCodeTip');
    if (t) t.textContent = '请在 ' + m + ':' + (s < 10 ? '0' + s : s) + ' 内在另一台设备输入这 6 位数字；取一次即失效';
    left--;
    if (left < 0) { clearInterval(syncCodeTimer); if (t) t.textContent = '取件码已过期，重新生成即可'; }
  };
  tick();
  syncCodeTimer = setInterval(tick, 1000);
}

// ---- 接收：取件码 ----
async function syncRecvByCode() {
  const inp = document.getElementById('syncCodeInput');
  const code = (inp && inp.value ? inp.value : '').replace(/\D/g, '');
  if (code.length !== 6) { showToast('请输入 6 位取件码'); return; }
  const btn = document.getElementById('syncRecvBtn');
  if (btn) { btn.disabled = true; btn.textContent = '正在领取…'; }
  try {
    const r = await fetch(SYNC_API + '?action=get&code=' + code);
    if (r.status === 404) { showToast('取件码无效，或已过期（10 分钟内有效）'); return; }
    if (!r.ok) { showToast('领取失败（' + r.status + '）'); return; }
    const env = await r.json();
    const payload = await syncDecrypt(env, code);
    showSyncPreview(payload, '取件码 ' + code);
  } catch (e) {
    showToast('解密失败：取件码不对，或数据已损坏');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = ic('download') + '领取'; }
  }
}

// ---- 文件通道 ----
function syncExportFile() {
  const payload = buildSyncPayload(syncSelection);
  if (!Object.keys(payload.items).length) { showToast('至少勾选一项有内容的资料'); return; }
  const text = JSON.stringify(payload, null, 2);
  const name = 'unicode-sync-' + new Date().toISOString().slice(0, 10) + '.json';
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  showToast('已导出 ' + name);
}

async function syncImportFile(input) {
  const file = input && input.files && input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    if (!payload || payload.app !== 'unicode-chaxun' || !payload.items) {
      showToast('这不是本应用导出的同步文件');
      return;
    }
    showSyncPreview(payload, file.name);
  } catch (e) {
    showToast('文件读不出来，可能不是同步文件');
  } finally {
    input.value = '';
  }
}

function syncRecvToggleAll(el) {
  const box = document.getElementById('syncPreviewOverlay');

  const list = box.querySelectorAll('.sync-recv-chk');

function syncRecvAllState() {

  const all = document.getElementById('syncRecvAll');

  const list = box.querySelectorAll('.sync-recv-chk');

function syncRecvKeys() {

  if (!box) return out;

function closeSyncPreview() {

async function applySyncFromPreview(mode) {
  const payload = syncLastPayload;
  if (!payload) { closeSyncPreview(); return; }
  // v0.2.23：接收方自己挑，没勾的项目连碰都不碰
  const keys = syncRecvKeys();
  if (!keys.length) { showToast('至少要勾一项接收内容'); return; }
  const src = (payload && payload.items) || {};
  const items = {};
  for (let i = 0; i < keys.length; i++) {
    if (Object.prototype.hasOwnProperty.call(src, keys[i])) items[keys[i]] = src[keys[i]];
  }
  if (!Object.keys(items).length) { showToast('没有可接收的内容'); return; }
  if (mode === 'overwrite' && !(await uiConfirm('完全覆盖会用对方的资料替换你本地勾选的项目，没勾的原样不动。确定继续？\n（已自动备份，可撤销）', { danger: true, okText: '覆盖' }))) return;
  syncBackupNow();
  applySyncPayload({ app: 'unicode-chaxun', v: payload.v || 1, at: payload.at || Date.now(), items: items }, mode);
  closeSyncPreview();
  syncRefreshCounts();
  const n = (favorites && favorites.size) || 0;
  showToast((mode === 'overwrite' ? '已覆盖 ' : '已合并 ') + keys.length + ' 项，现有收藏 ' + n + ' 个');
  // 只刷新当前正在看的视图，别把人家切到别的页面
  try {
    if (currentView === 'favorites') showFavorites();
    else if (currentView === 'history') showHistory();
    else if (currentView === 'overview') showOverview();
  } catch (e) {}
}

function syncRefreshCounts() {
  const ov = document.getElementById('settingsOverlay');
  if (!ov || !ov.classList.contains('show')) return;
  const body = document.getElementById('settingsBody');
  const top = body ? body.scrollTop : 0;
  try { renderSettingsBody(); } catch (e) { return; }

function syncBackupNow() {
  const all = {};
  for (const it of SYNC_ITEMS) all[it.key] = true;
  const snapshot = buildSyncPayload(all, true);
  try { lsSet('unicode_sync_backup', { at: Date.now(), items: snapshot.items }); } catch (e) {}
}

async function undoLastSync() {
  const backup = lsGet('unicode_sync_backup', null, function (v) {
    return !!(v && typeof v === 'object' && v.items && typeof v.items === 'object');
  });
  if (!backup || !backup.items) { showToast('没有可撤销的同步备份'); return; }
  if (!(await uiConfirm('用备份恢复到同步之前的状态？当前数据会被替换。', { danger: true, okText: '恢复' }))) return;
  applySyncPayload({ app: 'unicode-chaxun', v: 1, at: Date.now(), items: backup.items }, 'overwrite');
  try { localStorage.removeItem('unicode_sync_backup'); } catch (e) {}
  syncRefreshCounts();
  showToast('已恢复到同步之前');
}

function applySyncPayload(payload, mode) {
  const items = (payload && payload.items) || {};
  const over = mode === 'overwrite';

  if (items.favorites && Array.isArray(items.favorites)) {
    const remote = items.favorites.filter(cp => typeof cp === 'number' && isFinite(cp));
    favorites = over ? new Set(remote) : new Set([...favorites, ...remote]);
    saveFavorites();
  }
  if (items.categories && typeof items.categories === 'object') {
    if (over) favCategories = {};
    for (const name of Object.keys(items.categories)) {
      const arr = items.categories[name];
      if (!Array.isArray(arr)) continue;
      const cur = Array.isArray(favCategories[name]) ? favCategories[name] : [];
      favCategories[name] = over ? arr.slice() : Array.from(new Set([...cur, ...arr]));
    }
    saveFavCategories();
  }
  if (items.meanings && typeof items.meanings === 'object') {
    customMeanings = over ? Object.assign({}, items.meanings) : Object.assign({}, customMeanings, items.meanings);
    saveCustomMeanings();
  }
  if (items.worddict && typeof items.worddict === 'object') {
    customWordDict = over ? Object.assign({}, items.worddict) : Object.assign({}, customWordDict, items.worddict);
    saveCustomWordDict();
  }
  if (items.history && Array.isArray(items.history)) {
    const remote = items.history.filter(cp => typeof cp === 'number');
    history = over ? remote.slice(-200) : Array.from(new Set([...remote, ...history])).slice(-200);
    saveHistory();
  }
  if (items.searches && Array.isArray(items.searches)) {
    const cur = lsGet('recentSearches', [], Array.isArray);
    const remote = items.searches.filter(x => typeof x === 'string');
    const merged = over ? remote.slice(0, 30) : Array.from(new Set([...remote, ...cur])).slice(0, 30);
    lsSet('recentSearches', merged);
  }
  if (items.eggs && Array.isArray(items.eggs)) {
    // v0.2.23：合并＝并集，覆盖＝以对方图鉴为准；非法 id 由 eggSetFoundIds 挡掉
    const cur = over ? [] : Array.from(eggFoundSet());
    eggSetFoundIds(cur.concat(items.eggs));
  }
}

// ============================================================
// AI 助手（v0.1.2）
//
// 隐私约定：API Key 只存在你这台设备的 localStorage 里，请求由浏览器直接
// 发给你填的那个接口地址，本应用不中转、不记录、也不上传任何密钥。
// 想确认的话：开 F12 → Network，看请求是发给你自己的接口地址，不是本站。
// ============================================================
const AI_STORE = 'unicode_ai';
const AI_CACHE = 'unicode_ai_cache';
const AI_CACHE_MAX = 200;
const AI_DEFAULTS = {
  on: false,
  baseUrl: 'https://api.deepseek.com/v1',
  model: 'deepseek-chat',
  key: '',
  proxy: '',
  vision: false,   // v0.2.4：把联网拉到的字形图片一起发给模型（需模型支持看图）
};

function aiLoad() {
  const c = lsGet(AI_STORE, null, function (v) { return !!(v && typeof v === 'object'); });
  return Object.assign({}, AI_DEFAULTS, c || {});
}
function aiSave() { lsSet(AI_STORE, aiCfg); }
let aiCfg = aiLoad();

let aiAbort = null;          // 正在跑的请求，停止按钮用
let aiMode = 'explain';      // explain | find
let aiPanelCP = null;        // 解读模式下锁定的字符
let aiBusy = false;

function aiReady() {
  if (!aiCfg.on) return 'AI 助手还没开启（设置 → 🤖 AI 助手）';
  if (!String(aiCfg.key || '').trim()) return '还没填 API Key（设置 → 🤖 AI 助手）';
  if (!String(aiCfg.baseUrl || '').trim() && !String(aiCfg.proxy || '').trim()) return '还没填接口地址';
  return null;
}

// 代理地址优先：填了就走它（用来绕开厂商的 CORS 限制，或连本机 Ollama）
function aiEndpoint() {
  const base = String(aiCfg.proxy || aiCfg.baseUrl || '').trim().replace(/\/+$/, '');
  return base + '/chat/completions';
}

function aiHttpMessage(status, body) {
  let detail = '';
  try {
    const j = JSON.parse(body);
    if (j && j.error) detail = j.error.message || j.error.code || JSON.stringify(j.error);
  } catch (e) {
    if (body) detail = String(body).slice(0, 120);
  }
  if (status === 401 || status === 403) return '接口拒绝了请求（' + status + '）：API Key 不对，或这个 Key 没权限用该模型。' + (detail ? ' 接口原话：' + detail : '');
  if (status === 404) return '接口地址返回 404：多半是 base URL 填错了（要填到 /v1 那一层，不是域名根）。' + (detail ? ' 接口原话：' + detail : '');
  if (status === 429) return '被限流了（429）：等一会儿再试，或看接口方的额度。';
  if (status >= 500) return '接口方服务端出错（' + status + '），跟你的配置无关，稍后再试。';
  return '请求失败（' + status + '）' + (detail ? '：' + detail : '');
}

// 流式调用 OpenAI 兼容接口，逐段回调 onDelta
async function aiChat(messages, onDelta) {
  if (aiAbort) { try { aiAbort.abort(); } catch (e) {} }
  aiAbort = new AbortController();
  const ctl = aiAbort;
  const timer = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 120000);
  try {
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + String(aiCfg.key || '').trim(),
    };
    // 填了代理地址时，告诉代理真正要转发到哪（代理是你自己部署的，见 README）
    const proxyUrl = String(aiCfg.proxy || '').trim();
    if (proxyUrl) {
      headers['X-Target-Url'] = String(aiCfg.baseUrl || '').trim().replace(/\/+$/, '') + '/chat/completions';
    }
    const r = await fetch(aiEndpoint(), {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
        model: String(aiCfg.model || '').trim(),
        messages: messages,
        stream: true,
        temperature: 0.3,
      }),
      signal: ctl.signal,
    });
    if (!r.ok) throw new Error(aiHttpMessage(r.status, await r.text().catch(function () { return ''; })));
    if (!r.body) {
      const j = await r.json().catch(function () { return null; });
      const txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (!txt) throw new Error('接口没返回内容，可能不支持流式输出，试试换个模型');
      onDelta(txt);
      return txt;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '', all = '', raw = '';
    while (true) {
      const rd = await reader.read();
      if (rd.done) break;
      const chunk = dec.decode(rd.value, { stream: true });
      raw += chunk;
      buf += chunk;
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const s = line.trim();
        if (s.indexOf('data:') !== 0) continue;
        const data = s.slice(5).trim();
        if (data === '[DONE]') return all;
        try {
          const j = JSON.parse(data);
          const c = j && j.choices && j.choices[0];
          const d = c && (c.delta || c.message);
          if (d && d.content) { all += d.content; onDelta(d.content); }
        } catch (e) { /* 心跳或非法片段，跳过 */ }
      }
    }
    // 有些接口忽略 stream:true，直接回一整个 JSON。这时上面一段都解析不出来，
    // 兜底按非流式解析一次，别让用户看到空白
    if (!all && raw.trim().charAt(0) === '{') {
      try {
        const j = JSON.parse(raw);
        const txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (txt) { all = txt; onDelta(txt); }
      } catch (e) {}
    }
    return all;
  } catch (e) {
    if (e && e.name === 'AbortError') {
      if (ctl.__userStop) throw new Error('__stopped__');
      throw new Error('等太久了（超过 2 分钟没回完），已断开。可以换个更快的模型再试');
    }
    // fetch 直接抛 TypeError 基本都是 CORS 或网络不通
    if (e instanceof TypeError || (e && e.message === 'Failed to fetch')) {
      throw new Error('连不上接口。最常见的原因是对方不允许浏览器直连（CORS）——到设置里填一个自建代理地址就能解决，详见 README');
    }
    throw e;
  } finally {
    clearTimeout(timer);
    if (aiAbort === ctl) aiAbort = null;
  }
}

// 极简 Markdown 渲染：先整体转义再放标签，AI 返回的东西不会被当 HTML 执行
function aiRender(text) {
  let h = escapeHtml(text == null ? '' : String(text));
  h = h.replace(/```([\s\S]*?)```/g, function (m, c) { return '<code>' + c.trim() + '</code>'; });
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^#{1,4}\s+(.*)$/gm, '<b>$1</b>');
  h = h.replace(/^[-*]\s+(.*)$/gm, '<span class="ul">• $1</span>');
  h = h.replace(/^\d+\.\s+(.*)$/gm, '<span class="ul">$1</span>');
  // v0.2.4：U+XXXX 码点变成可点的字符卡（点开 = 字符详情，详情里有「联网字形」）
  // 注意：String.fromCodePoint 对「单独代理项」不抛错、会返回坏字符，必须显式挡掉
  h = h.replace(/U\+([0-9A-Fa-f]{4,6})/gi, function (m, hexs) {
    const cp = parseInt(hexs, 16);
    if (cp < 0xA0 || cp > 0x10FFFF) return m;
    if (cp >= 0xD800 && cp <= 0xDFFF) return m;
    const ch = String.fromCodePoint(cp);
    if (!ch) return m;
    return '<button class="ai-cp" onclick="aiChipTap(' + cp + ')" title="点开看详情">'
      + escapeHtml(ch) + '<span>U+' + hexs.toUpperCase() + '</span></button>';
  });
  return h;
}

function aiCacheKey(prefix, body) {
  return prefix + '|' + String(aiCfg.model || '').trim() + '|' + String(body);
}
function aiCacheGet(k) {
  const c = lsGet(AI_CACHE, {}, function (v) { return !!(v && typeof v === 'object'); });
  const e = c[k];
  return (e && typeof e.t === 'string') ? e : null;
}
function aiCacheSet(k, t) {
  try {
    const c = lsGet(AI_CACHE, {}, function (v) { return !!(v && typeof v === 'object'); });
    c[k] = { t: t, model: String(aiCfg.model || ''), at: Date.now() };
    let keys = Object.keys(c);
    if (keys.length > AI_CACHE_MAX) {
      keys.sort(function (a, b) { return (c[a].at || 0) - (c[b].at || 0); });
      for (let i = 0; i < keys.length - AI_CACHE_MAX; i++) delete c[keys[i]];
    }
    lsSet(AI_CACHE, c);
  } catch (e) { /* 缓存写不进就算了，不影响主流程 */ }
}
function aiClearCache() {
  lsSet(AI_CACHE, {});
  showToast('AI 回答缓存已清除');
}

// ---- 提示词 ----
function aiExplainPrompt(cp, question) {
  const info = getCharInfo(cp);
  const ch = safeChr(cp) || '?';
  const hex = 'U+' + cp.toString(16).toUpperCase().padStart(4, '0');
  const blk = getBlockInfo(cp)[0];
  const name = (info && info.name) ? info.name : '（无名称）';
  const dict = getWordInfo(cp);
  let extra = '';
  if (dict && dict.p) extra += '本地字典给的拼音：' + dict.p + '。';
  const custom = getCustomMeaning(cp);
  if (custom) extra += '用户自己记的备注：' + custom + '。';
  return '你是 Unicode 与文字学方面的专家，回答用简体中文。\n' +
    '用户正在查这个字符：' + ch + '（码点 ' + hex + '，官方名称：' + name + '，所属区块：' + blk + '）。\n' +
    extra +
    '请讲清楚这几件事：它在自然语言里怎么读、什么意思、平常怎么用；如果是汉字，说清常用义项和一两个词例；如果有容易混淆的近似字符，指出区别。\n' +
    '要求：200 字以内，分条陈述，别复述我上面已经给出的信息，别写客套话。\n' +
    (question ? '用户额外问的是：' + question : '');
}
function aiFindPrompt(q) {
  return '你是 Unicode 字符检索助手。\n' +
    '用户想找符合下面描述的字符：' + q + '\n' +
    '请给出最匹配的 1 到 12 个 Unicode 字符，按相关度排序。\n' +
    '输出格式严格按这个样子，一行一个，不要任何多余的话：\n' +
    'U+XXXX — 字符 — 一句话说明（15 字以内）\n' +
    '注意：U+ 后面必须是 4 到 6 位十六进制码点；如果描述涉及汉字，优先给常用字。';
}
function aiExtractCPs(text) {
  const out = [], seen = {};
  const re = /U\+([0-9A-Fa-f]{4,6})/gi;   // 模型可能输出小写 u+4e00
  let m;
  while ((m = re.exec(text)) !== null) {
    const cp = parseInt(m[1], 16);
    if (cp >= 0 && cp <= 0x10FFFF && !seen[cp]) { seen[cp] = 1; out.push(cp); }
  }
  return out;
}

function aiStop(silent) {

  }
  aiBusy = false;
  const b1 = document.getElementById('aiSendBtn'), b2 = document.getElementById('aiStopBtn');
  if (b1) { b1.disabled = false; b1.textContent = '发送'; }
  if (b2) b2.style.display = 'none';
}

async function aiSend() {
  if (aiBusy) return;
  const bad = aiReady();
  if (bad) { showToast(bad); aiOpenSettings(); return; }
  const inp = document.getElementById('aiInput');
  const q = inp ? String(inp.value || '').trim() : '';
  const out = document.getElementById('aiOut');
  if (!out) return;

  aiBusy = true;
  const b1 = document.getElementById('aiSendBtn'), b2 = document.getElementById('aiStopBtn');
  if (b1) { b1.disabled = true; b1.textContent = '…'; }
  if (b2) b2.style.display = '';
  document.getElementById('aiHits').innerHTML = '';

  const cacheKey = aiMode === 'explain'
    ? aiCacheKey('x', aiPanelCP + '|' + q)
    : aiCacheKey('f', q);

  // 问过一模一样的问题就直接拿缓存；原本展示的默认解读不算（用户可能就是想重问）
  const hit = (q ? aiCacheGet(cacheKey) : null);
  if (hit) {
    out.innerHTML = aiRender(hit.t) + aiMeanRowHTML(hit.t, aiMode === 'explain' ? [aiPanelCP] : null);
    aiBusy = false;
    if (b1) { b1.disabled = false; b1.textContent = '发送'; }
    if (b2) b2.style.display = 'none';
    return;
  }

  const messages = aiMode === 'explain'
    ? [{ role: 'user', content: aiExplainPrompt(aiPanelCP, q) }]
    : [{ role: 'user', content: aiFindPrompt(q) }];

  let acc = '';
  out.innerHTML = '<span class="ai-cursor"></span>';
  const stamp = Date.now();
  try {
    await aiChat(messages, function (d) {
      acc += d;
      out.innerHTML = aiRender(acc) + '<span class="ai-cursor"></span>';
      // 只在用户没往上翻时自动跟到底部
      if (out.scrollHeight - out.scrollTop - out.clientHeight < 120) out.scrollTop = out.scrollHeight;
    });
    out.innerHTML = aiRender(acc) + aiMeanRowHTML(acc, aiMode === 'explain' ? [aiPanelCP] : null);
    if (acc.trim()) aiCacheSet(cacheKey, acc);
    if (aiMode === 'find') {
      aiLastHits = aiExtractCPs(acc);
      aiRenderHits();
    }
    aiRenderMeta();
    showToast('AI 回答完成（' + ((Date.now() - stamp) / 1000).toFixed(1) + ' 秒）');
  } catch (e) {
    const msg = e && e.message ? e.message : '出错了';
    if (msg === '__stopped__') {
      out.innerHTML = aiRender(acc) + '<div class="ai-meta">（已手动停止）</div>';
    } else {
      out.innerHTML = '<span class="ai-err">' + escapeHtml(msg) + '</span>';
    }
  } finally {
    aiBusy = false;
    const bb1 = document.getElementById('aiSendBtn'), bb2 = document.getElementById('aiStopBtn');
    if (bb1) { bb1.disabled = false; bb1.textContent = '发送'; }
    if (bb2) bb2.style.display = 'none';
  }
}

// ---- 本地数据库喂给模型（v0.2.1）----
// 模型的训练记忆对生僻码点很不可靠（比如 U+A66E 是西里尔字母，
// 模型会说成 Vai 文），而应用里就有完整 UCD 数据。
// 发消息前先扫：① 码点写法（U+xxxx / &#x…; / \u… / 0x…）② 消息里的实际字符，
// 全部查本地库，把权威结果作为附加上下文注入，让模型「看着数据说话」。
// 单独出现也可能是句子里连接用的虚词，一并排除
const AI_HAN_STOPWORDS = ['和', '与', '或', '及', '跟', '同', '还', '也', '就', '都', '的', '了', '是', '在', '有', '个'];
function aiPageExtractCps(q) {
  const found = [];
  const push = function (cp) {
    if (cp < 0x20 || cp > 0x10FFFF) return;
    if (found.indexOf(cp) < 0) found.push(cp);
  };
  // 1) 各种码点写法
  const reCp = /U\+?([0-9A-Fa-f]{4,6})|&#x([0-9A-Fa-f]+);|\\u\{?([0-9A-Fa-f]{4,6})\}?|\b0x([0-9A-Fa-f]{4,6})/g;
  let m;
  while ((m = reCp.exec(q)) !== null) {
    push(parseInt(m[1] || m[2] || m[3] || m[4], 16));
    if (found.length >= 6) return found;
  }  // 2) 消息里的实际字符。全角标点和常用汉字（用户在说中文）不查，
  //    生僻字符 / 符号 / emoji 才像是在问它本身；
  //    常用汉字里只有「单独出现」的才查——前后都不是汉字，
  //    比如「己 已 巳 怎么区分」里的 己已巳，而「怎么区分」这些连着的字不查
  const cs = Array.from(q);
  const isHan = function (cp) {
    return (cp >= 0x3400 && cp <= 0x9FFF) || (cp >= 0xF900 && cp <= 0xFAFF);
  };
  for (let i = 0; i < cs.length; i++) {
    const cp = cs[i].codePointAt(0);
    if (cp <= 0x7F) continue;
    if ((cp >= 0x3000 && cp <= 0x303F) || (cp >= 0xFF01 && cp <= 0xFF65)) continue;  // 标点
    if (isHan(cp)) {
      // 「和 / 与 / 或…」这类连接词前后都是空格也很常见，排除掉
      if (AI_HAN_STOPWORDS.indexOf(cs[i]) >= 0) continue;
      const prev = i > 0 ? cs[i - 1].codePointAt(0) : 0;
      const next = i + 1 < cs.length ? cs[i + 1].codePointAt(0) : 0;
      if (!isHan(prev) && !isHan(next)) push(cp);
    } else {
      push(cp);
    }
    if (found.length >= 6) return found;
  }
  return found.slice(0, 6);
}

function aiPageLookupBlock(cps) {
  const lines = [];
  cps.forEach(function (cp) {
    const hex = 'U+' + cp.toString(16).toUpperCase().padStart(4, '0');
    const info = getCharInfo(cp);
    if (!info) {
      lines.push(hex + '：本机数据库中没有这个码点（未分配，或数据还没加载完）');
      return;
    }
    let s = info.name + ' ' + info.char + '（' + hex + '）'
      + ' · 区块：' + info.blockCn + ' (' + info.blockEn + ')'
      + ' · 类别：' + info.categoryCn + ' (' + info.category + ')';
    if (info.script) s += ' · 文字系统：' + (info.scriptCn ? info.scriptCn + ' (' + info.script + ')' : info.script);
    s += ' · UTF-8：' + info.utf8 + ' · UTF-16：' + info.utf16;
    const mean = String(info.meaning || '').trim();
    if (mean && mean !== '无') s += ' · 字典释义：' + mean.slice(0, 80);
    lines.push(s);
  });
  return lines.join('\n');
}

// ---- v0.2.4：收藏只读快照 ----
// 用户想让 AI 能看到自己的收藏（只看不能动）。做成随消息注入的只读快照：
// 总数 + 各分类 + 分类内容节选（带字符、码点、官方名，自定义备注也带上），
// 控制在几十个字符的量级，token 不至于爆炸。
function aiFavNameList(cps) {
  return cps.map(function (cp) {
    const ch = safeChr(cp);
    const hex = 'U+' + cp.toString(16).toUpperCase().padStart(4, '0');

function aiFavDigest() {

  const cats = favCategories || {};
  const names = Object.keys(cats).filter(function (n) { return Array.isArray(cats[n]) && cats[n].length; });
  const listed = {};
  let shown = 0;
  if (names.length) {
    lines.push('分类：' + names.map(function (n) { return n + '(' + cats[n].length + ')'; }).join('、'));
    names.forEach(function (n) {
      if (shown >= 48) return;
      const cps = cats[n].filter(function (cp) { return !listed[cp]; });
      if (!cps.length) return;
      const take = cps.slice(0, Math.min(48 - shown, 16));
      take.forEach(function (cp) { listed[cp] = 1; });
      shown += take.length;
      lines.push('「' + n + '」里的字：' + aiFavNameList(take));
    });
  }
  const rest = Array.from(favorites).filter(function (cp) { return !listed[cp]; });
  if (rest.length) {
    const sample = rest.slice(0, Math.max(0, 56 - shown));
    if (sample.length) lines.push('其余收藏节选：' + aiFavNameList(sample));
    if (rest.length > sample.length) lines.push('（还有 ' + (rest.length - sample.length) + ' 个没列出，用户问具体分类时再按上面的分类列表回答）');
  }
  return lines.join('\n');
}

// ---- v0.2.4：联网查字形（GlyphWiki）----
// 设备字体缺字形时（CJK 扩展 B/F/G 区是重灾区，界面上就是个方框），
// 从 glyphwiki.org 拉字形 PNG。它 CORS 全开，可以转成 dataURL：
// 既能直接显示，也能在「AI 视觉」开启时塞进消息发给模型看。
const GLYPH_URL = 'https://glyphwiki.org/glyph/u';

function blobToDataUrl(blob) {
  return new Promise(function (res, rej) {
    const fr = new FileReader();
    fr.onload = function () { res(String(fr.result)); };
    fr.onerror = function () { rej(new Error('读取字形失败')); };
    fr.readAsDataURL(blob);
  });
}
// GlyphWiki 对没收录的字也返回 200，但图上几乎是全透明的，
// 所以画到画布上数一数「墨水量」，太空就当没有这个字形
function glyphIsBlank(dataUrl) {
  return new Promise(function (res) {
    const img = new Image();
    img.onload = function () {
      try {
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, c.width, c.height).data;
        let ink = 0;
        for (let i = 0; i < d.length; i += 4) { if (d[i + 3] > 40) ink++; }
        res(ink / (c.width * c.height) < 0.004);
      } catch (e) { res(false); }
    };
    img.onerror = function () { res(true); };
    img.src = dataUrl;
  });
}
async function aiGlyphDataUrl(cp) {
  try {
    const r = await fetch(GLYPH_URL + cp.toString(16) + '.png', { cache: 'force-cache' });
    if (!r.ok) return null;
    const blob = await r.blob();
    if (!blob || !/^image\//.test(blob.type || '')) return null;
    const durl = await blobToDataUrl(blob);
    if (await glyphIsBlank(durl)) return null;
    return durl;
  } catch (e) { return null; }   // 断网 / 被墙 / 超时：统一当查不到，别把聊天卡死
}

// ---- v0.2.7：把 AI 的解释一键存进「自定义释义」----
// 用户在管理模式里记的字义（customMeanings）优先级最高，AI 讲得好，
// 一键就能变成你自己的字义备注。回答里没有码点就不显示操作行。
// 用自增 id 注册表存原文：聊天记录重渲染会反复调 aiMeanRowHTML，
// 数组 shift 会让旧按钮的 id 全部错位，Map 自增 id 没这个问题。
let _aiMeanTexts = {};
let _aiMeanSeq = 0;
let _aiMeanCps = [];     // 弹窗里可选的字符
let _aiMeanSel = 0;      // 当前选中的下标
let _aiMeanBtn = null;   // 触发弹窗的那个按钮，存完变「✓ 已存进释义」

function aiMeanCleanText(t) {
  let s = String(t || '');
  // AI 被要求用「【释义小结】」一行收尾，有就直接用，最干净
  const m = s.match(/【释义小结】\s*[:：]?\s*([^\n]+)/);
  if (m) return m[1].trim();
  return s.replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/\*\*([^*]*)\*\*/g, '$1')
    .replace(/^#{1,4}\s+/gm, '')
    .replace(/^[-*]\s+/gm, '')
    .replace(/^\d+\.\s+/gm, '')
    .replace(/\s*\n+\s*/g, ' ')
    .trim()
    .slice(0, 400);
}
function aiMeanRowHTML(rawText, extraCps) {
  const s = String(rawText || '');
  // v0.2.8：只有回答带「释义小结」（AI 确定讲了含义）或明确指定了目标字符（详情页解读）
  // 才出按钮——否则每条提到码点的回答都挂按钮，AI 说「不确定」的也挂，纯烦人
  const hasSummary = s.indexOf('【释义小结】') >= 0;
  if (!hasSummary && !(extraCps && extraCps.length)) return '';
  const cps = aiPageExtractCps(s);
  if (extraCps && extraCps.length) {
    for (let i = extraCps.length - 1; i >= 0; i--) {
      if (cps.indexOf(extraCps[i]) < 0) cps.unshift(extraCps[i]);
    }
  }
  if (!cps.length) return '';
  _aiMeanSeq++;
  _aiMeanTexts[_aiMeanSeq] = String(rawText || '');
  if (_aiMeanSeq > 200) {   // 简单清理，防 localStorage 页面常年开着越攒越多
    for (let k = _aiMeanSeq - 200; k > 0; k--) delete _aiMeanTexts[k];
  }
  return '<div class="ai-saverow"><button class="ai-linkbtn" onclick="aiMeanFromBtn(' + _aiMeanSeq + ', this)">📝 存进自定义释义</button></div>';
}
function aiMeanFromBtn(id, btn) {
  _aiMeanBtn = btn || null;
  const raw = _aiMeanTexts[id];
  if (raw == null) return;
  const cps = aiPageExtractCps(raw).slice(0, 8);
  if (!cps.length) { showToast('这条回答里没找到可以挂释义的字符'); return; }
  aiMeanOpen(cps, aiMeanCleanText(raw));
}
function aiMeanOpen(cps, prefill) {
  _aiMeanCps = cps;
  _aiMeanSel = 0;

    + '<div id="aiMeanOld" style="font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:8px"></div>'
    + '<textarea id="aiMeanText" rows="5" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);resize:vertical"></textarea>'
    + '<p style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7">存好后这里就是「' + escapeHtml(safeChr(cps[0]) || '这个字') + '」的自定义释义：详情页优先显示它，AI 也会当成你自己记的备注看到。想改随时在详情弹窗里编辑。</p>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">'

function aiMeanRepaint() {

  const sysMsgs = [{ role: 'system', content: AI_SYSTEM_PROMPT }];
  // 问题里带码点 / 字符时，把本地数据库的权威查询结果喂给模型，
  // 免得模型靠训练记忆瞎猜生僻码点（U+A66E 被说成 Vai 文就是前车之鉴）
  const lookCps = aiPageExtractCps(q);
  if (lookCps.length) {
    sysMsgs.push({
      role: 'system',
      content: '【本机 Unicode 数据库查询结果】下面几行来自应用内置的完整 UCD 数据，权威可信。'
        + '回答与这些码点/字符相关的问题时必须以此为准，不要怀疑、不要另猜：\n'
        + aiPageLookupBlock(lookCps),
    });
  }
  // v0.2.4：收藏只读快照（有收藏才注入）
  const favCtx = aiFavDigest();
  if (favCtx) sysMsgs.push({ role: 'system', content: favCtx });
  // v0.2.4：AI 视觉——把问题里码点的联网字形图一起发过去，让模型「亲眼」看字形
  let attach = [], glyphMiss = [];
  if (aiCfg.vision && lookCps.length) {
    showToast('正在联网取字形…');
    const want = lookCps.slice(0, 3);
    for (let i = 0; i < want.length; i++) {
      const durl = await aiGlyphDataUrl(want[i]);
      if (durl) attach.push(durl); else glyphMiss.push(want[i]);
    }
  }
  // v0.2.11：把「哪些字没拉到字形」明明白白告诉模型，免得它怪用户网络、
  // 或者每轮复读「拉取不了你重试」——直接下结论：这字在字形库里没收录
  if (glyphMiss.length) {
    sysMsgs.push({
      role: 'system',
      content: '【联网字形获取结果】这些码点在 GlyphWiki 拿不到字形图（多半是没收录，也可能是网络原因）：'
        + glyphMiss.map(function (cp) { return 'U+' + cp.toString(16).toUpperCase(); }).join('、') + '。'
        + '回答时注意：① 如果用户问的就是这些字，直接告诉他这个字在字形库里暂时没有字形数据，别让他反复重试；'
        + '② 引导一次即可：点回答里的字符卡 → 详情 → 「联网字形」按钮可以自行确认（也照样可能没有）；'
        + '③ 别归咎用户的网络，其他字能拉到就说明网络没问题。',
    });
  }
  if (attach.length) {
    const lastMsg = ctx[ctx.length - 1];
    if (lastMsg && lastMsg.role === 'user') {
      lastMsg.content = [{ type: 'text', text: String(lastMsg.content) }]
        .concat(attach.map(function (u) { return { type: 'image_url', image_url: { url: u } }; }));
      sysMsgs.push({
        role: 'system',
        content: '最后一条用户消息附带了字形图片：应用刚从 GlyphWiki 联网获取（字符与本机数据库查询结果对应）。'
          + '请直接根据图片描述字形结构与部件，图片是可信的，不要再说不确定。',
      });
      // 历史里只记文字标记，不存图片（dataURL 太大，会撑爆 localStorage）
      aiPageMsgs[aiPageMsgs.length - 2].content = q + ' [附' + attach.length + ' 张联网字形图]';
    }
  }
  const messages = sysMsgs.concat(ctx);

  let acc = '';
  const started = Date.now();
  try {
    await aiChat(messages, function (d) {
      acc += d;
      const b = document.getElementById('aiLastBubble');
      if (b) b.innerHTML = aiRender(acc) + '<span class="ai-cursor"></span>';
      aiPageScroll(true);
    });
    if (bubble) bubble.innerHTML = aiRender(acc) + aiMeanRowHTML(acc);
    aiPageMsgs[aiPageMsgs.length - 1].content = acc;
    aiChatSave();
    showToast('回答完成（' + ((Date.now() - started) / 1000).toFixed(1) + ' 秒）');
  } catch (e) {
    const stopped = (e && e.message === '__stopped__');
    const msg = stopped ? '已手动停止' : (e && e.message ? e.message : '出错了');
    const head = acc ? aiRender(acc) : '';
    if (bubble) {
      bubble.innerHTML = head + '<div class="ai-meta">'
        + (stopped ? '（已手动停止）' : '<span class="ai-err">' + escapeHtml(msg) + '</span>')
        + '</div>';
    }
    aiPageMsgs[aiPageMsgs.length - 1].content = acc + (stopped ? '' : '\n\n[出错了] ' + msg);
    aiChatSave();
  } finally {
    aiPageBusy = false;
    aiPageBusyUI(false);
    aiPageScroll();
  }
}

// ============================================================
// 版本更新检查
// 只 GET 一个静态 version.json，不带任何本机标识、不上报任何数据。
// 关掉「启动时自动检查」后，不点按钮就一次请求都不会发。
// ============================================================
let updateCfg = lsGet(UPDATE_STORE, Object.assign({}, UPDATE_DEFAULTS), function (v) {
  return v && typeof v === 'object' && !Array.isArray(v);
});
let _updateBusy = false;
let _updateInfo = null;   // 最近一次成功拿到的清单

function verParts(v) {
  const p = String(v == null ? '' : v).trim().replace(/^v/i, '').split('.');
  const out = [];
  for (let i = 0; i < 3; i++) {
    const n = parseInt(p[i], 10);
    out.push(isNaN(n) ? 0 : n);
  }
  return out;
}
// a > b 返回 1，相等 0，a < b 返回 -1
function verCompare(a, b) {
  const x = verParts(a), y = verParts(b);
  for (let i = 0; i < 3; i++) {
    if (x[i] > y[i]) return 1;
    if (x[i] < y[i]) return -1;
  }
  return 0;
}

// 当前跑在哪个端 —— 决定「下载」按钮指向哪个文件
function appPlatform() {
  const ua = navigator.userAgent || '';
  if (/Android/i.test(ua)) return 'android';
  // 桌面版内置的是 127.0.0.1 的本地服务，借此和网页版区分
  if (/^(127\.0\.0\.1|localhost)$/i.test(location.hostname || '')) return 'desktop';
  return 'web';
}
function platformLabel(p) {
  return { android: '安卓版', desktop: '桌面版', web: '网页版' }[p] || '网页版';
}
function downloadLabel(p) {
  if (p === 'android') return '⬇️ 下载新版 APK';
  if (p === 'desktop') return '⬇️ 下载新版 EXE';
  return '🌐 打开最新网页版';
}

async function fetchUpdateInfo() {
  // 加时间戳绕开 CDN 缓存，否则可能拿到几小时前的清单
  const url = UPDATE_MANIFEST_URL + '?t=' + Date.now();
  const opts = { cache: 'no-store' };
  const ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  if (ctrl) {
    opts.signal = ctrl.signal;
    var timer = setTimeout(function () { ctrl.abort(); }, 8000);
  }
  try {
    const resp = await fetch(url, opts);
    if (!resp.ok) throw new Error('更新源返回 HTTP ' + resp.status);
    const info = await resp.json();
    if (!info || !String(info.latest || '').trim()) throw new Error('更新源内容不完整');
    return info;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function updateErrText(e) {
  if (e && (e.name === 'AbortError' || e.name === 'TimeoutError')) return '查询超时，可能没连上网';
  if (location.protocol === 'file:') return '离线打开的文件查不了更新，需要联网';
  const msg = e && e.message ? String(e.message) : '未知错误';
  if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) return '连不上更新源，检查下网络';
  return msg;
}

// 设置面板那行状态：面板关掉再打开时用它恢复上次的查询结果
function updateStatusState() {
  const blank = { cls: 'update-progress', txt: '', isNew: false };
  if (!_updateInfo) return blank;
  const latest = String(_updateInfo.latest || '').trim().replace(/^v/i, '');
  if (!latest) return blank;
  const cmp = verCompare(latest, APP_VERSION);
  if (cmp > 0) return { cls: 'update-progress success', txt: '🎉 有新版本 v' + latest + '（当前 v' + APP_VERSION + '）', isNew: true };
  if (cmp < 0) return { cls: 'update-progress', txt: '你用的 v' + APP_VERSION + ' 比发布版 v' + latest + ' 还新（开发预览？）', isNew: false };
  return { cls: 'update-progress', txt: '✅ 已是最新版本（v' + APP_VERSION + '）', isNew: false };
}

// 状态行下面的快捷下载区：查出有新版才出现，两个入口 ——
// ① 本平台对应的安装包（安卓 APK / 桌面 EXE / 网页版）② GitHub 发布页直链
function renderQuickDl() {
  const box = document.getElementById('updateQuickDl');
  if (!box) return;
  const latest = _updateInfo ? String(_updateInfo.latest || '').trim().replace(/^v/i, '') : '';
  if (!latest || verCompare(latest, APP_VERSION) <= 0) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  const dl = updateDownloadUrl(_updateInfo);
  const rel = String(_updateInfo.release || RELEASE_PAGE_URL).trim();
  // flex:0 0 auto + nowrap：窄屏上不能被旁边的按钮挤压换行，否则文字会被挤没只剩图标
  box.style.display = 'flex';
  // v0.2.12：发布页链接补上描边按钮样式——之前裸用 .toggle-btn 没有任何按钮外观，
  // 呈现浏览器默认蓝链接，紧挨着蓝色的下载按钮，两个蓝色撞在一起分不清主次
  box.innerHTML = '<a class="file-upload-btn" href="' + escapeHtml(dl) + '" target="_blank" rel="noopener" style="text-decoration:none;flex:0 0 auto;white-space:nowrap;color:#fff">' + ic('download') + downloadLabel(appPlatform()).replace(/^⬇️\s*/, '') + '</a>'
    + '<a class="toggle-btn" href="' + escapeHtml(rel) + '" target="_blank" rel="noopener" style="text-decoration:none;flex:0 0 auto;white-space:nowrap;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px">' + ic('link') + 'Gitee 发布页</a>';
}

// manual=true：用户点的，任何结果都写到设置面板那行状态里；
// manual=false：启动时自动查，只在有新版本时冒个提示条，失败一律静默
async function checkUpdate(manual) {
  if (_updateBusy) return null;
  _updateBusy = true;
  const out = document.getElementById('updateStatus');
  if (out) {
    out.className = 'update-progress';
    out.textContent = '正在查询…';
    // v0.2.24：只有用户手动点「检查更新」才把「关于与反馈」卡片弹出来看结果。
    // 启动时自动查（manual=false）不能弹，否则一打开设置就被卡片糊脸。
    if (manual) expandSecOf(out);
  }
  try {
    const info = await fetchUpdateInfo();
    _updateInfo = info;
    const latest = String(info.latest).trim().replace(/^v/i, '');
    const cmp = verCompare(latest, APP_VERSION);
    if (out) {
      const st = updateStatusState();
      out.className = st.cls;
      out.textContent = st.txt;
    }
    renderQuickDl();
    if (cmp > 0) {
      if (manual) {
        openUpdateDialog();
      } else if (String(updateCfg.skip || '') !== latest) {
        showUpdateBar(latest);
      }
    }
    return { latest: latest, cmp: cmp, info: info };
  } catch (e) {
    if (out) {
      out.className = 'update-progress error';
      out.textContent = '❌ ' + updateErrText(e);
    }
    renderQuickDl();
    return null;
  } finally {
    _updateBusy = false;
  }
}

function showUpdateBar(latest) {
  const bar = document.getElementById('updateBar');
  const txt = document.getElementById('updateBarText');
  if (!bar || !txt) return;
  txt.innerHTML = '发现新版本 <b>v' + escapeHtml(latest) + '</b>，你用的是 v' + escapeHtml(APP_VERSION);
  bar.classList.add('show');
}
// 只把条收起来，不动 skip（点「看看」时用）
function hideUpdateBar() {
  const bar = document.getElementById('updateBar');
  if (bar) bar.classList.remove('show');
}
// 「以后再说」：这个版本不再自动提醒；手动点「检查更新」仍会提示
function dismissUpdateBar() {
  hideUpdateBar();
  if (_updateInfo && _updateInfo.latest) {
    updateCfg.skip = String(_updateInfo.latest).trim().replace(/^v/i, '');
    lsSet(UPDATE_STORE, updateCfg);
  }
}

function updateDownloadUrl(info) {
  const d = (info && info.downloads) || {};
  const p = appPlatform();
  let pick = '';
  if (p === 'android') pick = d.apk || d.web || '';
  else if (p === 'desktop') pick = d.exe || d.web || '';
  else pick = d.web || '';
  return String(pick || (info && info.release) || RELEASE_PAGE_URL).trim();
}

function openUpdateDialog() {
  hideUpdateBar();
  if (!_updateInfo) {
    // 还没有清单（比如从提示条点进来但没查过），先查一遍
    showModal(ic('refresh') + '检查更新', '<p style="color:var(--muted)">正在查询…</p>', '');
    checkUpdate(true).then(function (r) {
      // 查到有新版：checkUpdate 内部已经弹了更新窗，这里别去关它
      // 查到没新版 / 查失败：把这个「正在查询」的空壳收掉
      if (!r || r.cmp <= 0) closeModal();
    });
    return;
  }
  const info = _updateInfo;
  const latest = String(info.latest).trim().replace(/^v/i, '');
  const p = appPlatform();
  const dl = updateDownloadUrl(info);
  const rel = String(info.release || RELEASE_PAGE_URL).trim();
  const notes = String(info.notes || '').trim();
  const date = String(info.date || '').trim();

  let body = ''
    + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'
    +   '<span style="font-size:28px">🎉</span>'
    +   '<div>'
    +     '<div style="font-weight:700;font-size:15px">v' + escapeHtml(APP_VERSION) + ' → v' + escapeHtml(latest) + '</div>'
    +     '<div style="font-size:12px;color:var(--muted)">'
    +       (date ? escapeHtml(date) + ' 发布 · ' : '')
    +       '当前设备：' + platformLabel(p)
    +     '</div>'
    +   '</div>'
    + '</div>';

  if (notes) {
    body += '<div style="background:var(--bg);border-radius:8px;padding:12px;font-size:13px;line-height:1.85">'
      + escapeHtml(notes).replace(/\n/g, '<br>')
      + '</div>';
  } else {
    body += '<p style="color:var(--muted);font-size:13px">这版没有附更新说明，点下面的按钮去看完整发布页。</p>';
  }

  if (p === 'web' && /^https?:/i.test(location.protocol)) {
    body += '<p style="margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7">'
