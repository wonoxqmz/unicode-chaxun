async function installFont(file) {
  const validTypes = ['font/ttf', 'font/woff', 'font/woff2', 'application/font-sfnt', 'application/font-woff'];
  const ext = file.name.split('.').pop().toLowerCase();
  if (!validTypes.includes(file.type) && !['ttf','woff','woff2'].includes(ext)) {
    showToast('⚠ 不支持的字体格式，请上传 TTF/WOFF/WOFF2 文件');
    return;
  }
  const name = file.name.replace(/\.(ttf|woff2?|otf)$/i, '');
  if (customFonts.some(f => f.name === name)) {
    showToast('⚠ 该字体已安装');
    return;
  }
  const type = file.type || (ext === 'woff2' ? 'font/woff2' : ext === 'woff' ? 'font/woff' : 'font/ttf');
  const buf = await file.arrayBuffer();
  await idbSet('fontData_' + name, buf);
  const info = { name, type, size: file.size, addedAt: Date.now() };
  customFonts.push(info);
  await idbSet('customFonts', customFonts);
  // 创建 @font-face
  let styleEl = document.getElementById('customFontFaces');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'customFontFaces';
    document.head.appendChild(styleEl);
  }
  const blob = new Blob([buf], { type });
  const url = URL.createObjectURL(blob);
  styleEl.textContent += `@font-face { font-family: 'CustomFont_${name}'; src: url('${url}'); }\n`;
  applyFontFamily();
  showToast(`✅ 字体「${name}」已安装`);
  addLog('安装字体', name);
  refreshSettingsDisplay();
}

async function removeFont(name) {
  if (!(await uiConfirm(`确定卸载字体「${name}」？`, { danger: true }))) return;
  await idbDel('fontData_' + name);
  customFonts = customFonts.filter(f => f.name !== name);
  await idbSet('customFonts', customFonts);
  // 重建 @font-face
  const styleEl = document.getElementById('customFontFaces');
  if (styleEl) {
    let css = '';
    for (const f of customFonts) {
      const data = await idbGet('fontData_' + f.name);
      if (!data) continue;
      const blob = new Blob([data], { type: f.type });
      const url = URL.createObjectURL(blob);
      css += `@font-face { font-family: 'CustomFont_${f.name}'; src: url('${url}'); }\n`;
    }
    styleEl.textContent = css;
  }
  applyFontFamily();
  showToast(`已卸载字体「${name}」`);
  addLog('卸载字体', name);
  refreshSettingsDisplay();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

// --- 上传 UnicodeData.txt ---
async function uploadUCDFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  await ensureDataReady();
  setProgress(`正在解析 ${file.name} ...`);
  try {
    const text = await file.text();
    const charMap = parseUCD(text);
    // D8：文件拖错槽位时 parseUCD 会静默跳过不匹配的行，得到几乎空的 Map 并覆盖已存数据
    if (charMap.size < 1000) throw new Error(`只解析到 ${charMap.size} 条记录，这个文件不像是 UnicodeData.txt，已放弃导入`);
    // 尝试从文件名检测版本
    let ver = unicodeData.version;
    const vm = file.name.match(/unicode[-_]?(\d+\.\d+\.\d+)/i);
    if (vm) ver = `Unicode ${vm[1]}`;

    // 合并已有 blocks
    const existingBlocks = unicodeData.blocks || parseBlocks('');
    const charMapData = [...charMap.entries()];
    const saveOk = await idbSet('unicodeData', {
      version: ver,
      source: 'file',
      blocks: existingBlocks,
      charMapData: charMapData,
      timestamp: Date.now(),
    });
    if (!saveOk) console.warn('[存储] Unicode 数据未能写入 IndexedDB，刷新后需重新获取');
    unicodeData = {
      version: ver, source: 'file',
      blocks: existingBlocks, charMap: charMap, loaded: true,
    };
    nameIndex = null; categoryIndex = null;
    setProgress(`✅ 已加载 ${charMap.size} 个字符条目。` + (saveOk ? '' : '（⚠️ 未能写入本地存储，刷新后需重新获取）'), 'success');
    updateVersionDisplay();
    refreshSettingsDisplay();
    showToast('UnicodeData.txt 已加载');
    addLog('上传数据', `UnicodeData.txt: ${charMap.size} 个字符`);
  } catch(e) {
    setProgress(`❌ 解析失败: ${e.message}`, 'error');
  }
  event.target.value = ''; // 重置以便重复上传
}

// --- 一键在线获取全部 UCD 数据（从本站同源路径拉取，无跨域问题） ---
async function fetchOnlineUCD() {
  const btn = document.getElementById('onlineFetchBtn');
  if (btn) btn.disabled = true;
  setProgress('⏳ 正在准备获取...');
  await ensureDataReady();
  // 数据文件基地址（v0.2.2）：安卓 APK 用 file: 协议、桌面版本地服务自带数据包，
  // 都走相对地址即可（APK 的实际读取由 loadBundledUCD 用 XHR 完成，见启动逻辑）；
  // 网页版和页面同源，相对地址最优；万一本地/同源取不到再回退线上站点
  const base = (/^https?:$/i.test(location.protocol)) ? '' : 'https://unchaxun.pages.dev/';
  const FALLBACK = 'https://unchaxun.pages.dev/';
  const files = [
    { url: base + 'unicode_data/UnicodeData.txt', label: 'UnicodeData.txt' },
    { url: base + 'unicode_data/Blocks.txt',      label: 'Blocks.txt' },
    { url: base + 'unicode_data/Scripts.txt',     label: 'Scripts.txt' },
    { url: base + 'unicode_data/LineBreak.txt',   label: 'LineBreak.txt' },
  ];
  try {
    const results = {};
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      setProgress(`⏳ 正在获取 ${f.label}（${i + 1}/${files.length}）...`);
      let resp = null;
      try { resp = await fetch(f.url); } catch (e) { resp = null; }
      // 本地 / 同源取不到（旧版 exe 没带数据包等），回退线上站点
      if ((!resp || !resp.ok) && base !== FALLBACK) {
        resp = await fetch(FALLBACK + f.url).catch(function () { return null; });
      }
      if (!resp || !resp.ok) throw new Error(`获取 ${f.label} 失败` + (resp ? `（HTTP ${resp.status}）` : ''));
      results[f.label] = await resp.text();
    }

    setProgress('⏳ 正在解析数据...');
    await new Promise(r => setTimeout(r, 30)); // 让 UI 先刷新
    const charMap = parseUCD(results['UnicodeData.txt']);
    const blocks = parseBlocks(results['Blocks.txt']);
    const scripts = parseUCDScalar(results['Scripts.txt']);
    const lineBreak = parseUCDScalar(results['LineBreak.txt']);

    // 从 Blocks.txt 注释检测版本
    let ver = 'Unicode 17.0';
    const vm = (results['Blocks.txt'] || '').match(/(?:Blocks|version)[^\d]*(\d+\.\d+\.\d+)/i);
    if (vm) ver = `Unicode ${vm[1]}`;

    const saveOk = await idbSet('unicodeData', {
      version: ver,
      source: 'online',
      blocks: blocks,
      charMapData: [...charMap.entries()],
      scriptsData: [...scripts.map.entries()],
      scriptExtData: [...scripts.ext.entries()].map(([cp, arr]) => [cp, arr]),
      lineBreakData: [...lineBreak.map.entries()],
      timestamp: Date.now(),
    });
    if (!saveOk) console.warn('[存储] Unicode 数据未能写入 IndexedDB，刷新后需重新获取');
    unicodeData = {
      version: ver, source: 'online',
      blocks: blocks, charMap: charMap, loaded: true,
      scripts: scripts.map, scriptExts: scripts.ext,
      lineBreak: lineBreak.map,
    };
    nameIndex = null; categoryIndex = null;

    setProgress(`✅ 在线获取完成（${ver}）：${charMap.size.toLocaleString()} 个字符 · ${blocks.length || 346} 个区块 · 文字系统 sc/scx · 断行类别 lb` + (saveOk ? '' : '（⚠️ 未能写入本地存储，刷新后需重新获取）'), 'success');
    updateVersionDisplay();
    refreshSettingsDisplay();
    showToast('Unicode 数据已在线获取');
    addLog('在线获取', `${ver} 全量数据（${charMap.size} 字符）`);
  } catch (e) {
    setProgress(`❌ 在线获取失败：${e.message}。可改用手动上传，或检查网络后重试`, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// 传统下载方式
function downloadExportFile(json, filename) {
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 导出个人数据 - 下载（传统方式）
async function exportUserData() {
  const data = buildExportData();
  const json = JSON.stringify(data, null, 2);
  const ts = new Date().toISOString().slice(0,10);
  const filename = `unicode_user_data_${ts}.json`;

  // 检查是否支持 File System Access API

// 使用 File System Access API 另存为
async function saveFileWithPicker(json, defaultName) {
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: defaultName,
      types: [{
        description: 'JSON 数据文件',
        accept: { 'application/json': ['.json'] }
      }]
    });
    const writable = await handle.createWritable();
    await writable.write(json);
    await writable.close();
    showToast('已保存到指定位置');
    addLog('导出数据（另存为）', `收藏${favorites.size}项, 字义${Object.keys(customMeanings).length}条, 字典${Object.keys(customWordDict).length}条, 分类${Object.keys(favCategories).length}个`);
  } catch (err) {
    // 用户取消了保存
    if (err.name === 'AbortError') {
      showToast('已取消保存');
      return;
    }
    // 出错了，回退到传统下载
    const data = buildExportData();
    const ts = new Date().toISOString().slice(0,10);
    downloadExportFile(JSON.stringify(data, null, 2), `unicode_user_data_${ts}.json`);
    showToast('保存失败，已改用下载方式');
    addLog('导出数据（回退下载）', '另存为失败，改用传统下载');
  }
}

// 导入个人数据
function importUserData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data._type !== 'unicode-app-user-data') {
        showToast('❌ 文件格式不正确，请选择应用导出的个人数据 JSON');
        return;
      }
      // 预览里的「项数」只对数组取值，避免 favorites 被写成字符串时拿字符数冒充条数
      const cnt = v => Array.isArray(v) ? v.length : 0;
      const objCnt = v => (v && typeof v === 'object' && !Array.isArray(v)) ? Object.keys(v).length : 0;
      const ok = await uiConfirm('即将导入个人数据：文件中包含的每一项都会【替换】当前对应数据（文件里没有的项保持不动）。\n\n导入内容：\n'
        + `• 收藏: ${cnt(data.favorites)} 项\n`
        + `• 自定义字义: ${objCnt(data.customMeanings)} 条\n`
        + `• 自定义字典: ${objCnt(data.customWordDict)} 条\n`
        + `• 收藏分类: ${objCnt(data.favCategories)} 个\n`
        + `• 浏览记录: ${cnt(data.history)} 条\n`
        + `• 最近搜索: ${cnt(data.recentSearches)} 条\n`
        + `• 彩蛋图鉴: ${cnt(data.eggFound)} / ${EGGS.length} 个\n\n`
        + '确定继续？', { okText: '导入' });
      if (!ok) { event.target.value = ''; return; }

      // D5/D6：逐段替换，且每段都做结构校验——坏结构（如 favCategories 的值不是数组）
      // 会在收藏视图里直接抛 TypeError，让页面永久白屏，所以脏数据一律丢掉。
      const isNumList = v => Array.isArray(v) && v.every(n => typeof n === 'number' && isFinite(n));
      const skipped = [];
      if ('favorites' in data) {
        if (isNumList(data.favorites)) { favorites = new Set(data.favorites); saveFavorites(); }
        else skipped.push('收藏');
      }
      if ('history' in data) {
        if (isNumList(data.history)) { history = data.history.slice(0, 200); saveHistory(); }
        else skipped.push('浏览记录');
      }
      if ('recentSearches' in data) {
        if (Array.isArray(data.recentSearches)) {
          recentSearches = data.recentSearches.filter(x => typeof x === 'string').slice(0, 30);
          lsSet('recentSearches', recentSearches);
        } else skipped.push('最近搜索');
      }
      if ('customMeanings' in data) {
        const m = data.customMeanings;
        if (isPlainObj(m)) {
          customMeanings = {};
          for (const k of Object.keys(m)) if (typeof m[k] === 'string') customMeanings[k] = m[k];
          saveCustomMeanings();
        } else skipped.push('自定义字义');
      }
      if ('customWordDict' in data) {
        const d = data.customWordDict;
        if (isPlainObj(d)) {
          customWordDict = {};
          for (const k of Object.keys(d)) if (isPlainObj(d[k])) customWordDict[k] = d[k];
          saveCustomWordDict();
        } else skipped.push('自定义字典');
      }
      if ('favCategories' in data) {
        const c = data.favCategories;
        if (isPlainObj(c)) {
          favCategories = {};
          for (const k of Object.keys(c)) if (isNumList(c[k])) favCategories[k] = c[k];
          saveFavCategories();
        } else skipped.push('收藏分类');
      }
      if ('eggFound' in data) {
        // v0.2.23：导入语义是「有就替换」，所以直接用文件里的图鉴记录覆盖
        if (Array.isArray(data.eggFound)) eggSetFoundIds(data.eggFound);
        else skipped.push('彩蛋图鉴');
      }
      updateFavCount();
      refreshSettingsDisplay();
      if (currentView === 'overview') showOverview();
      if (currentView === 'favorites') showFavorites();
      if (currentView === 'history') showHistory();
      // 统一用 toast，跟全站风格一致；跳过的项拼成一句话
      if (skipped.length) showToast('已导入，但以下内容格式不正确被跳过：' + skipped.join('、'));
      else showToast('已导入个人数据');
    } catch(err) {
      showToast('❌ 解析文件失败：' + (err && err.message || '未知错误'));
    }
    event.target.value = '';   // 放在这里：失败/取消也能重新选同一个文件
  };
  // N8：读文件失败原来完全没提示，且 input 值不重置 → 同一个文件选不了第二次
  reader.onerror = () => { showToast('❌ 读取文件失败'); event.target.value = ''; };
  reader.onabort = () => { event.target.value = ''; };
  try {
    reader.readAsText(file);
  } catch (e) {
    showToast('❌ 读取文件失败：' + (e && e.message || '未知错误'));
    event.target.value = '';
  }
}

// --- 解析 UnicodeData.txt ---
function parseUCD(text) {
  const charMap = new Map();
  const lines = text.split('\n');
  let rangeStart = null, rangeCat = null, rangeBidi = null;

  for (const line of lines) {
    if (!line.trim()) continue;
    const f = line.split(';');
    if (f.length < 15) continue;
    const cp = parseInt(f[0], 16);
    if (isNaN(cp)) continue;
    const name = f[1];
    const cat = f[2];
    const combining = parseInt(f[3]) || 0;
    const bidi = f[4];
    const decomp = f[5] || '';
    const mirrored = f[9] || 'N';
    const upper = f[12] || '';
    const lower = f[13] || '';
    const title = f[14] || '';

    // 范围起始
    if (name.endsWith(', First>')) {
      rangeStart = cp;
      rangeCat = cat;
      rangeBidi = bidi;
      continue;
    }
    // 范围结束 → 生成区间内所有字符
    if (name.endsWith(', Last>')) {
      // D9：没有配对的 <..., First> 时不能把 null 当 0 用，否则会伪造出几十万条记录
      if (rangeStart === null || cp < rangeStart) { rangeStart = null; continue; }
      const cleanName = name.replace(/<([^,]+),\s*Last>/, '$1').trim();
      const rangeEnd = cp;
      for (let c = rangeStart; c <= rangeEnd; c++) {
        charMap.set(c, {
          name: generateRangeName(cleanName, c),
          category: rangeCat,
          combining: 0,
          bidi: rangeBidi || 'L',
          decomposition: '',
          mirrored: 'N',
          upper: '', lower: '', title: '',
        });
      }
      rangeStart = null;
      continue;
    }

    charMap.set(cp, {
      name: name,
      category: cat,
      combining: combining,
      bidi: bidi,
      decomposition: decomp,
      mirrored: mirrored,
      upper: upper,
      lower: lower,
      title: title,
    });
  }
  return charMap;
}

// 解析 Scripts.txt / LineBreak.txt（UCD 格式：code 或 code..code ; value # 注释）
// 同一码点出现多行时（Script Extensions），首次出现的值作为主值（sc），全部值构成扩展集合（scx）
function parseUCDScalar(text) {
  const map = new Map();
  const ext = new Map();
  for (const line of text.split('\n')) {
    const hash = line.indexOf('#');
    const body = hash !== -1 ? line.slice(0, hash) : line;
    if (!body.trim()) continue;
    const f = body.split(';');
    if (f.length < 2) continue;
    const val = f[1].trim();
    if (!val) continue;
    const rng = f[0].trim().split('..');
    const a = parseInt(rng[0], 16);
    const b = rng.length > 1 ? parseInt(rng[1], 16) : a;
    if (isNaN(a) || isNaN(b)) continue;
    for (let c = a; c <= b; c++) {
      if (!map.has(c)) map.set(c, val);
      if (!ext.has(c)) ext.set(c, []);
      const arr = ext.get(c);
      if (!arr.includes(val)) arr.push(val);
    }
  }
  return { map, ext };
}

// 为范围字符生成名称
function generateRangeName(rangeType, cp) {
  const hex = cp.toString(16).toUpperCase().padStart(4, '0');
  const t = rangeType.toUpperCase();
  if (t.includes('CJK IDEOGRAPH EXTENSION')) return `CJK UNIFIED IDEOGRAPH ${t.replace('CJK IDEOGRAPH','').trim()}-${hex}`;
  if (t.includes('CJK IDEOGRAPH')) return `CJK UNIFIED IDEOGRAPH-${hex}`;
  if (t.includes('CJK COMPATIBILITY IDEOGRAPH')) return `CJK COMPATIBILITY IDEOGRAPH-${hex}`;
  if (t.includes('HANGUL SYLLABLE')) return `HANGUL SYLLABLE ${hex}`;
  if (t.includes('TANGUT')) return `TANGUT IDEOGRAPH-${hex}`;
  if (t.includes('NUSHU')) return `NUSHU CHARACTER-${hex}`;
  if (t.includes('EGYPTIAN HIEROGLYPH')) return `EGYPTIAN HIEROGLYPH ${hex}`;
  return `${t} ${hex}`;
}

// --- 解析 Blocks.txt ---
function parseBlocks(text) {
  const blocks = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim() || line.startsWith('#')) continue;
    const m = line.match(/^([0-9A-Fa-f]+)\.\.([0-9A-Fa-f]+)\s*;\s*(.+)$/);
    if (m) {
      blocks.push([m[3].trim(), parseInt(m[1], 16), parseInt(m[2], 16)]);
    }
  }
  return blocks;
}

// ============================================================
// 辅助函数
// ============================================================
function safeChr(cp) {
  if (cp >= 0xD800 && cp <= 0xDFFF) return null;
  if (cp > 0x10FFFF) return null;
  try { return String.fromCodePoint(cp); } catch(e) { return null; }
}

// 轻量检查：是否为不可显示的控制字符（用于随机生成的性能优化）
function isControlChar(cp) {
  return (cp <= 0x1F) || (cp >= 0x7F && cp <= 0x9F);
}

// 获取当前生效的区块列表（优先使用上传的数据，回退到内置）
// 返回格式统一为 [cnName, enName, start, end]
function activeBlocks() {
  if (unicodeData.blocks && unicodeData.blocks.length) {
    return unicodeData.blocks.map(b => [BLOCK_CN_NAMES[b[0]] || b[0], b[0], b[1], b[2]]);
  }
  return BLOCKS;
}

// 优先使用已加载的 Unicode 数据，回退到内置
function getBlockInfo(cp) {
  if (unicodeData.blocks) {
    for (const [enName, start, end] of unicodeData.blocks) {
      if (cp >= start && cp <= end) {
        return [BLOCK_CN_NAMES[enName] || enName, enName];
      }
    }
  }
  for (const [cn,en,start,end] of BLOCKS) {
    if (cp >= start && cp <= end) return [cn,en];
  }
  return ['未知区块','Unknown'];
}

function getCategory(cp) {
  if (unicodeData.charMap && unicodeData.charMap.has(cp)) {
    return unicodeData.charMap.get(cp).category || 'Cn';
  }
  // 回退到启发式
  const ch = safeChr(cp);
  if (!ch) return 'Cn';
  // 控制字符优先判断（C0 控制字符 + DEL + C1 控制字符）
  if (cp < 0x20 || cp === 0x7F || (cp >= 0x80 && cp <= 0x9F)) return 'Cc';
  // 格式字符 Cf（零宽字符、双向控制、不可见运算符等）
  if (cp === 0xAD || cp === 0xFEFF ||
      (cp >= 0x200B && cp <= 0x200F) ||
      (cp >= 0x202A && cp <= 0x202E) ||
      (cp >= 0x2060 && cp <= 0x2064) ||
      (cp >= 0x2066 && cp <= 0x206F) ||
      (cp >= 0xFFF9 && cp <= 0xFFFB)) return 'Cf';
  // 行分隔符 Zl / 段落分隔符 Zp
  if (cp === 0x2028) return 'Zl';
  if (cp === 0x2029) return 'Zp';
  if (/\d/.test(ch)) return 'Nd';
  if (/[A-Z]/.test(ch)) return 'Lu';
  if (/[a-z]/.test(ch)) return 'Ll';
  if (/\s/.test(ch)) return 'Zs';
  return 'Lo';
}

function toUTF8(cp) {
  const ch = safeChr(cp); if (!ch) return '—';
  const encoder = new TextEncoder();
  return Array.from(encoder.encode(ch)).map(b=>b.toString(16).toUpperCase().padStart(2,'0')).join(' ');
}
function toUTF16(cp) {
  const ch = safeChr(cp); if (!ch) return '—';
  // 正确处理 BMP 外字符：使用代理对编码
  const units = [];
  for (let i = 0; i < ch.length; i++) {
    units.push(ch.charCodeAt(i));
  }
  return units.map(c => c.toString(16).toUpperCase().padStart(4, '0')).join(' ');
}
function toHTML(cp) {
  return `&#${cp};`;
}
function toCSS(cp) {
  return `\\${cp.toString(16).toUpperCase().padStart(4,'0')}`;
}
function toURL(cp) {
  const ch = safeChr(cp); if (!ch) return '—';
  return encodeURIComponent(ch);
}

function getCharInfo(cp) {
  const ch = safeChr(cp); if (!ch) return null;
  const [blockCn, blockEn] = getBlockInfo(cp);
  const cat = getCategory(cp);
  const catInfo = CATEGORY_INFO[cat] || ['未知','Unknown'];

  // 从已加载数据获取更详细属性
  let bidi = 'L', bidiDesc = '左到右';
  let combining = 0;
  let decomposition = '无';
  let mirrored = '否';
  let upperMap = '无', lowerMap = '无';

  if (unicodeData.charMap && unicodeData.charMap.has(cp)) {
    const info = unicodeData.charMap.get(cp);
    bidi = info.bidi || 'L';
    bidiDesc = BIDI_DESC[bidi] || bidi;
    combining = info.combining || 0;
    decomposition = info.decomposition ? info.decomposition : '无';
    mirrored = info.mirrored === 'Y' ? '是' : '否';
    if (info.upper) {
      const ucp = parseInt(info.upper, 16);
      const uch = safeChr(ucp);
      upperMap = uch ? `${uch} (U+${info.upper.toUpperCase()})` : `U+${info.upper.toUpperCase()}`;
    }
    if (info.lower) {
      const lcp = parseInt(info.lower, 16);
      const lch = safeChr(lcp);
      lowerMap = lch ? `${lch} (U+${info.lower.toUpperCase()})` : `U+${info.lower.toUpperCase()}`;
    }
  } else {
    // 回退：用 JS 内置大小写
    lowerMap = ch.toLowerCase() !== ch ? `${ch.toLowerCase()} (U+${ch.toLowerCase().codePointAt(0).toString(16).toUpperCase()})` : '无';
    upperMap = ch.toUpperCase() !== ch ? `${ch.toUpperCase()} (U+${ch.toUpperCase().codePointAt(0).toString(16).toUpperCase()})` : '无';
  }

  // 标题映射（UnicodeData.txt 第 15 列，上传数据后可用；无数据时用 JS 内置回退）
  let titleMap = '无';
  let titleRaw = '';
  if (unicodeData.charMap && unicodeData.charMap.has(cp)) {
    titleRaw = unicodeData.charMap.get(cp).title || '';
  }
  if (titleRaw) {
    const tcp = parseInt(titleRaw, 16);
    const tch = safeChr(tcp);
    titleMap = tch ? `${tch} (U+${titleRaw.toUpperCase()})` : `U+${titleRaw.toUpperCase()}`;
  } else if (!(unicodeData.charMap && unicodeData.charMap.has(cp))) {
    const tUp = ch.toLowerCase().replace(/(^|[\s\u002D])\p{L}/gu, m => m.toUpperCase());
    if (tUp !== ch) titleMap = `${tUp} (JS 内置推导)`;
  }

  // 文字系统（sc）、文字扩展（scx）、断行类别（lb）：来自上传的 Scripts.txt / LineBreak.txt
  let script = '', scriptCn = '', scriptExts = '', lineBreak = '', lineBreakDesc = '';
  if (unicodeData.scripts && unicodeData.scripts.has(cp)) {
    script = unicodeData.scripts.get(cp);
    scriptCn = SC_NAMES[script] || '';
    const exts = unicodeData.scriptExts && unicodeData.scriptExts.get(cp);
    if (exts && exts.length > 1) scriptExts = exts.join(', ');
  }
  if (unicodeData.lineBreak && unicodeData.lineBreak.has(cp)) {
    lineBreak = unicodeData.lineBreak.get(cp);
    lineBreakDesc = LB_DESC[lineBreak] || '';
  }

  return {
    char: ch, codepoint: cp,
    name: getCharName(cp) || `U+${cp.toString(16).toUpperCase().padStart(4,'0')}`,
    blockCn, blockEn, category: cat, categoryCn: catInfo[0], categoryEn: catInfo[1],
    utf8: toUTF8(cp), utf16: toUTF16(cp), html: toHTML(cp), css: toCSS(cp), url: toURL(cp),
    decimal: cp, bidi, bidiDesc, combining,
    eastAsianWidth: 'N', eastAsianWidthDesc: '中性',
    mirrored, decomposition, lower: lowerMap, upper: upperMap, title: titleMap,
    script, scriptCn, scriptExts, lineBreak, lineBreakDesc,
    meaning: getCharMeaning(cp),
  };
}

// 判断码点是否属于 Unicode 私有使用区
function isPrivateUseArea(cp) {
  return (cp >= 0xE000 && cp <= 0xF8FF)
      || (cp >= 0xF0000 && cp <= 0xFFFFD)
      || (cp >= 0x100000 && cp <= 0x10FFFD);
}

// 判断码点是否为 Unicode 非字符（永久保留，永不分配）
function isNoncharacter(cp) {
  if (cp >= 0xFDD0 && cp <= 0xFDEF) return true;
  // 每个平面的最后两个码点 FFFE/FFFF
  if ((cp & 0xFFFF) === 0xFFFE || (cp & 0xFFFF) === 0xFFFF) return true;
  return false;
}

// 判断码点是否为代理对（不允许直接使用）
function isSurrogate(cp) {
  return cp >= 0xD800 && cp <= 0xDFFF;
}

// 检测字符的特殊属性，返回警示标志对象
function getCharFlags(cp) {
  const flags = {
    isControl: false,        // 控制字符 Cc
    isFormat: false,        // 格式字符 Cf（多数不可见）
    isSurrogate: false,      // 代理对
    isPrivateUse: false,     // 私有使用区
    isNoncharacter: false,   // 非字符
    isUnassigned: false,     // 未分配码点
    isInvisible: false,      // 不可见字符（零宽、空格、控制等）
    invisibleMark: null,     // 不可见字符的可视化标记
    invisibleDesc: null,    // 不可见字符说明
    warnings: [],            // 警示信息列表
  };

  if (isSurrogate(cp)) {
    flags.isSurrogate = true;
    flags.warnings.push({type:'surrogate', text:'代理码点（不允许直接使用）'});
  }
  if (isPrivateUseArea(cp)) {
    flags.isPrivateUse = true;
    flags.warnings.push({type:'pua', text:'私有使用区字符（非通用，由应用自定义）'});
  }
  if (isNoncharacter(cp)) {
    flags.isNoncharacter = true;
    flags.warnings.push({type:'nonchar', text:'非字符（保留，永不分配给任何字符）'});
  }

  const cat = getCategory(cp);
  if (cat === 'Cc') {
    flags.isControl = true;
    flags.warnings.push({type:'control', text:'控制字符（不可打印）'});
  } else if (cat === 'Cf') {
    flags.isFormat = true;
    flags.warnings.push({type:'format', text:'格式字符（通常不可见）'});
  } else if (cat === 'Cn') {
    flags.isUnassigned = true;
    flags.warnings.push({type:'unassigned', text:'未分配码点（尚无字符定义）'});
  }

  // 不可见字符标记
  if (INVISIBLE_MARKS[cp]) {
    flags.isInvisible = true;
    flags.invisibleMark = INVISIBLE_MARKS[cp][0];
    flags.invisibleDesc = INVISIBLE_MARKS[cp][1];
    if (!flags.warnings.some(w => w.type === 'invisible')) {
      flags.warnings.push({type:'invisible', text:'不可见字符（已用标记替代显示）'});
    }
  }

  return flags;
}

function getCharDisplay(cp) {
  const ch = safeChr(cp); if (!ch) return '∅';
  // 不可见字符使用特殊标记
  if (INVISIBLE_MARKS[cp]) return INVISIBLE_MARKS[cp][0];
  const code = ch.charCodeAt(0);
  if (code < 0x20 || code === 0x7F) return '•';
  return ch;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
// 安全嵌入「内联事件属性里的单引号 JS 字符串」：
// 先做 HTML 实体转义（防止 " 截断属性），再做 JS 转义（防止 ' 截断字符串字面量）
// 注意顺序：& 必须最先处理，反斜杠必须在单引号之前处理
function escapeJsAttr(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r?\n/g, '\\n');
}

function getCharMeaning(cp) {
  // 优先级：用户自定义 > 字典释义 > 内置含义
  const custom = getCustomMeaning(cp);
  if (custom) return custom;
  const wordInfo = getWordInfo(cp);
  if (wordInfo && wordInfo.e) {
    return wordInfo.e;
  }
  if (CHAR_MEANINGS[cp]) return CHAR_MEANINGS[cp];
  return null;
}

// 获取字符所属语言分区名称
function getCharLang(cp) {
  for (const [id, name, ranges] of LANG_PARTITIONS) {
    for (const [start, end] of ranges) {
      if (cp >= start && cp <= end) return name;
    }
  }
  return '其他';
}

function buildNameIndex() {
  if (nameIndex) return;
  nameIndex = [];
  if (unicodeData.charMap && unicodeData.charMap.size > 0) {
    // 使用已加载的完整数据
    for (const [cp, info] of unicodeData.charMap) {
      if (info.name) nameIndex.push([info.name.toUpperCase(), cp]);
    }
  } else {
    // 回退到内置索引
    for (let cp = 0; cp <= 0xFFFF; cp++) {
      const name = getCharName(cp);
      if (name) nameIndex.push([name.toUpperCase(), cp]);
    }
    for (let cp = 0x1F000; cp <= 0x1FAFF; cp++) {
      const name = getCharName(cp);
      if (name) nameIndex.push([name.toUpperCase(), cp]);
    }
  }
}

function buildCategoryIndex() {
  if (categoryIndex) return;
  categoryIndex = {};
  if (unicodeData.charMap && unicodeData.charMap.size > 0) {
    // 使用已加载的完整数据
    for (const [cp, info] of unicodeData.charMap) {
      const cat = info.category || 'Cn';
      if (!categoryIndex[cat]) categoryIndex[cat] = [];
      categoryIndex[cat].push(cp);
    }
  } else {
    // 回退到遍历 BMP
    for (let cp = 0; cp <= 0xFFFF; cp++) {
      const ch = safeChr(cp); if (!ch) continue;
      const cat = getCategory(cp);
      if (!categoryIndex[cat]) categoryIndex[cat] = [];
      categoryIndex[cat].push(cp);
    }
  }
}

let _swipeDir = 0;
// 跟手切换进行中：setActiveNav 跳过 CSS 入场动画，transform 交给手势接管
let _swipeAnim = false;
function setActiveNav(view) {
  // 清理所有无限滚动监听
  detachBlockScroll();
  const cs = document.getElementById('contentScroll');
  detachFavFlatScroll();
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  // v0.2.12：手机端顶栏是横向滚动条，滑动切栏目后选中的 tab 可能跑出屏幕外，
  // 把它平滑滚回可视区中央（桌面端侧边栏是竖排且无横向溢出，条件不满足直接跳过）
  try {
    const sb = document.getElementById('sidebar');
    const act = document.querySelector('.nav-btn.active');
    if (sb && act && sb.scrollWidth > sb.clientWidth + 4) {
      const target = Math.max(0, act.offsetLeft - (sb.clientWidth - act.offsetWidth) / 2);
      if (typeof sb.scrollTo === 'function') {
        try { sb.scrollTo({ left: target, behavior: 'smooth' }); }
        catch (e2) { sb.scrollLeft = target; }
      } else {
        sb.scrollLeft = target;
      }
    }
  } catch (e) {}
  // 触发视图切换动画
  const scroll = document.getElementById('contentScroll');
  if (scroll && !_swipeAnim) {
    const cls = _swipeDir > 0 ? 'view-enter-next' : (_swipeDir < 0 ? 'view-enter-prev' : 'view-enter');
    scroll.classList.remove('view-enter', 'view-enter-next', 'view-enter-prev');
    void scroll.offsetWidth; // 强制重排以重新启动动画
    scroll.classList.add(cls);
  }
}

  const next = !swipeEnabled();
  _swipeOn = next;
  lsSetRaw(SWIPE_STORE, next ? '1' : '0');
  refreshSettingsDisplay();
  showToast(next ? '已开启：左右滑动切换栏目' : '已关闭滑动切换栏目');
}
// 分类详情（blockChars）算作「分类」页，从那里也能划走
function swipeCurrentView() {
  return currentView === 'blockChars' ? 'blocks' : currentView;
}
function swipeGo(dir) {
  const i = SWIPE_VIEWS.indexOf(swipeCurrentView());
  if (i < 0) return false;
  const ni = i + dir;
  if (ni < 0) { showToast('已经是第一个栏目：' + SWIPE_LABEL[SWIPE_VIEWS[0]]); return false; }
  if (ni >= SWIPE_VIEWS.length) { showToast('已经是最后一个栏目：' + SWIPE_LABEL[SWIPE_VIEWS[SWIPE_VIEWS.length - 1]]); return false; }
  const v = SWIPE_VIEWS[ni];
  const fn = window[SWIPE_FN[v]];
  if (typeof fn !== 'function') return false;
  _swipeDir = dir;                 // setActiveNav 里读它决定从哪边滑进来
  try { fn(); } finally { _swipeDir = 0; }
  showToast((dir > 0 ? '下一个：' : '上一个：') + SWIPE_LABEL[v]);
  return true;
}
// 起手点是否落在可横向滚动的容器里（代码块、表格、手机端侧边栏等）
function swipeInScrollX(el) {
  let n = el;
  let depth = 0;
  while (n && n.nodeType === 1 && depth++ < 12) {
    const ox = getComputedStyle(n).overflowX;
    if ((ox === 'auto' || ox === 'scroll') && n.scrollWidth - n.clientWidth > 4) return true;
    n = n.parentElement;
  }
  return false;
}
function initSwipeNav() {
  let sx = 0, sy = 0, st = 0, active = false, locked = false, busy = false;
  const sc = function () { return document.getElementById('contentScroll'); };
  function overlayOpen() {
    return ['settingsOverlay', 'modalOverlay', 'zoomOverlay', 'confirmOverlay'].some(function (id) {
      const el = document.getElementById(id);
      return el && el.classList.contains('show');
    });
  }
  function curIndex() { return SWIPE_VIEWS.indexOf(swipeCurrentView()); }
  // 头尾边界：往没有更多栏目的方向拽时给橡皮筋阻力，别让内容飘走
  function dragDx(dx) {
    const i = curIndex();
    if ((dx > 0 && i <= 0) || (dx < 0 && i >= SWIPE_VIEWS.length - 1)) return dx * 0.32;
    return dx;
  }
  // 松手不切页 / 回弹：把内容弹回正中
  function settle(scroll) {
    if (!scroll) return;
    scroll.style.transition = 'transform .26s var(--ease-spring, cubic-bezier(.34,1.56,.64,1))';
    scroll.style.transform = 'translateX(0)';
    setTimeout(function () {
      if (scroll) { scroll.style.transition = ''; scroll.style.transform = ''; }
    }, 340);
  }
  document.addEventListener('touchstart', function (e) {
    active = false; locked = false;
    if (busy) return;                          // 上一波切换动画还没收尾，先不抢手势
    if (!swipeEnabled()) return;
    if (e.touches.length !== 1) return;        // 双指缩放之类的直接放行
    if (overlayOpen()) return;
    const t = e.target;
    if (t && t.closest && t.closest('.sidebar, input, textarea, select, [contenteditable="true"], .no-swipe')) return;
    if (swipeInScrollX(t)) return;
    const p = e.touches[0];
    // 屏幕最左缘留给系统 Predictive Back（Android 13+ 从左侧边缘往回滑的手势），
    // 那道手势归系统管，应用内滑动从内容区起手，不去抢同一根手指
    if (p.clientX <= 16) return;
    sx = p.clientX; sy = p.clientY; st = Date.now();
    active = true;
    // v0.2.28：把上一次切栏留下的入场动画 class 清掉。
    // .view-enter* 用的是 animation-fill-mode:both（已改成 backwards），
    // 动画结束后仍会占着 transform，把跟手时的内联 translateX 直接盖掉 ——
    // 表现就是「跟手根本没做，一划就整页跳过去」。
    const _cs0 = document.getElementById('contentScroll');
    if (_cs0) _cs0.classList.remove('view-enter', 'view-enter-next', 'view-enter-prev');
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!active) return;
    if (e.touches.length !== 1) { active = false; return; }
    const p = e.touches[0];
    const dx = p.clientX - sx, dy = p.clientY - sy;
    if (!locked) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;      // 还没动够，先不定主意
      if (Math.abs(dx) > Math.abs(dy) * 1.4) locked = true;    // 横向意图明确
      else { active = false; return; }                         // 竖直手势 → 交回页面滚动
    }
    if (e.cancelable) e.preventDefault();                      // 锁定后就别让页面跟着晃
    const scroll = sc();
    if (scroll) {
      scroll.classList.remove('view-enter', 'view-enter-next', 'view-enter-prev'); // 防入场动画抢 transform
      scroll.style.transition = 'none';                        // 跟手：内容 1:1 实时跟随手指
      scroll.style.transform = 'translateX(' + dragDx(dx) + 'px)';
    }
  }, { passive: false });

  document.addEventListener('touchend', function (e) {
    if (!active) return;
    active = false;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t || !locked) { if (locked) settle(sc()); return; }   // 没锁定=竖直手势，啥也不做
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st > SWIPE_MAX_MS) { settle(sc()); return; }   // 慢慢拖太久不算
    const horiz = Math.abs(dx) > Math.abs(dy) * 1.4;
    const fast = Math.abs(dx / Math.max(1, Date.now() - st)) > 0.5;  // 快速一甩也算
    const far = Math.abs(dx) > SWIPE_MIN_DX;
    if (!horiz || (!far && !fast)) { settle(sc()); return; }
    const dir = dx < 0 ? 1 : -1;                              // 左滑=下一个栏目
    const i = curIndex();
    if ((dir > 0 && i >= SWIPE_VIEWS.length - 1) || (dir < 0 && i <= 0)) {
      settle(sc()); return;                                   // 已经到头，弹回
    }
    commit(dir, dx);
  }, { passive: true });

  // 跟手切换：同步切视图（状态立刻更新），新页从手指停住处顺势滑回正中
  function commit(dir, dx) {
    busy = true;
    _swipeAnim = true;
    _swAllow = Date.now() + 450;                              // 切完吞掉紧接着的那次 click
    const scroll = sc();
    swipeGo(dir);
    if (scroll) {
      scroll.style.transition = 'none';
      scroll.style.transform = 'translateX(' + dx + 'px)';
      void scroll.offsetWidth;                                // 强制重排，让下面的过渡生效
      scroll.style.transition = 'transform .28s var(--ease-out, cubic-bezier(.22,1,.36,1))';
      scroll.style.transform = 'translateX(0)';
    }
    busy = false;                       // 同步放行：下一波手势可立刻接管
    setTimeout(function () {
      if (scroll) { scroll.style.transition = ''; scroll.style.transform = ''; }
      _swipeAnim = false;               // 过渡结束后才恢复 CSS 入场动画
    }, 340);
  }

  document.addEventListener('touchcancel', function () { active = false; if (locked) settle(sc()); });
  // 滑动成功后，紧接着被抬手触发的那次点击不该生效（否则会顺手点开一个字符）
  document.addEventListener('click', function (e) {
    if (Date.now() < _swAllow) {
      _swAllow = 0;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);
}

function clearControlBar() {
  const bar = document.getElementById('controlBar');
  bar.innerHTML = '';
  bar.style.display = 'none';
}

function renderPagination(total) {
  const el = document.getElementById('pagination');
  if (total <= 1 && currentView !== 'all') { el.innerHTML = ''; return; }
  const showUnicodeJump = currentView === 'all';
  const totalDisplay = currentView === 'all'
    ? ((allCharsTotal>0) ? Math.ceil(allCharsTotal / PAGE_SIZE) : total)
    : total;
  el.innerHTML = `
    <button onclick="prevPage()" ${currentPage===0?'disabled':''}>◀ 上一页</button>
    <span class="pg-jump">
      <input type="number" id="jumpPageInput" min="1" max="${totalDisplay}" value="${currentPage+1}"
             placeholder="页码" style="width:62px"
             onkeydown="if(event.key==='Enter')jumpToPage(parseInt(this.value))">
      <button onclick="jumpToPage(parseInt(document.getElementById('jumpPageInput').value))">跳页</button>
    </span>
    <span style="font-size:13px;color:var(--muted);white-space:nowrap">第 ${currentPage+1} / ${totalDisplay} 页</span>
    ${showUnicodeJump ? `
    <span class="pg-jump" title="输入 Unicode 编码，如 4E2D / U+4E2D">
      <input type="text" id="jumpUnicodeInput" placeholder="Unicode"
             style="width:90px;text-transform:uppercase"
             onkeydown="if(event.key==='Enter')jumpToUnicode(this.value)">
      <button onclick="jumpToUnicode(document.getElementById('jumpUnicodeInput').value)">跳编码</button>
    </span>
    ` : ''}
    <button onclick="nextPage()" ${currentPage>=totalDisplay-1?'disabled':''}>下一页 ▶</button>
  `;
}

// 跳转到指定页（从1开始）
function jumpToPage(pageNum) {
  if (!Number.isFinite(pageNum) || pageNum < 1) { showToast('请输入有效页码'); return; }
  let total;
  if (currentView === 'all') {
    buildAllSegIndex();
    total = Math.ceil(allCharsTotal / PAGE_SIZE);
  } else {
    total = Math.ceil(currentChars.length / PAGE_SIZE);
  }
  if (pageNum > total) pageNum = total;
  currentPage = pageNum - 1;
  renderGrid();
  document.getElementById('contentScroll').scrollTop = 0;
  showToast(`已跳转到第 ${currentPage+1} 页`);
}

// 在全部字符视图中，跳转到包含指定 Unicode 编码的页
function jumpToUnicode(raw) {
  if (currentView !== 'all') { showToast('仅在全部字符视图可用'); return; }
  if (!raw) { showToast('请输入 Unicode 编码'); return; }
  let codeStr = raw.trim().replace(/^U\+/i, '').replace(/^0x/i, '');
  const cp = parseInt(codeStr, 16);
  if (!Number.isFinite(cp) || cp < 0 || cp > 0x10FFFF) { showToast('无效编码'); return; }
  if (cp >= 0xD800 && cp <= 0xDFFF) { showToast('代理码点不可用'); return; }
  buildAllSegIndex();
  // 计算全局索引（排除代理对区间）
  const segIdx = Math.floor(cp / ALL_SEG_SIZE);
  const segStart = segIdx * ALL_SEG_SIZE;
  let offset = cp - segStart;
  // 段 0 中代理对之后的码点需要减去 2048
  if (segIdx === 0 && cp >= 0xE000) {
    offset -= 0xDFFF - 0xD800 + 1;
  }
  const globalIdx = allSegOffsets[segIdx] + offset;
  currentPage = Math.floor(globalIdx / PAGE_SIZE);
  renderGrid();
  document.getElementById('contentScroll').scrollTop = 0;
  showToast(`已定位到 U+${cp.toString(16).toUpperCase().padStart(cp > 0xFFFF ? 5 : 4, '0')}`);
  // 高亮对应单元格
  setTimeout(() => {
    const cells = document.querySelectorAll('.cell');
    const localIdx = globalIdx - currentPage * PAGE_SIZE;
    if (cells[localIdx]) {
      cells[localIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      cells[localIdx].style.boxShadow = '0 0 0 3px var(--accent)';
      setTimeout(() => { if (cells[localIdx]) cells[localIdx].style.boxShadow = ''; }, 2000);
    }
  }, 100);
}

// 渲染网格视图的控制栏（点击收藏模式开关 + 收藏进度）
// pageCps: 当前页的字符数组
function renderGridControlBar(pageCps) {
  if (!pageCps || !pageCps.length) { clearControlBar(); return; }
  // 收藏视图不显示控制栏
  if (currentView === 'favorites') { clearControlBar(); return; }
  // 浏览记录视图：控制栏只放「清除记录」（A5：renderGrid 会覆盖 showHistory 里写的按钮，
  // 所以按钮必须在这里重建，否则一点进有记录的列表按钮就消失）
  if (currentView === 'history') {
    const bar = document.getElementById('controlBar');
    bar.innerHTML = `<div style="display:flex;gap:8px;align-items:center;width:100%"><button class="toggle-btn" onclick="clearHistory()">${ic('trash')}清除记录</button></div>`;
    bar.style.display = 'flex';
    return;
  }
  const total = pageCps.length;
  let favCount = 0;
  for (const cp of pageCps) if (favorites.has(cp)) favCount++;
  const bar = document.getElementById('controlBar');
  bar.innerHTML = `
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; width:100%">
      <button class="ctrl-click-fav ${clickFavMode?'on':''}" onclick="setClickFavMode(${clickFavMode?'false':'true'})" title="${clickFavMode?'关闭点击收藏，点击字符恢复查看详情（会弹模态框）':'点击收藏模式：点击字符直接收藏或取消，不弹模态框'}">
        ${ic('mouse')}${clickFavMode?'点击收藏：开':'点击收藏：关'}
      </button>
      <span class="ctrl-fav-progress">⭐ ${favCount} / ${total} 已收藏</span>
    </div>
  `;
  bar.style.display = 'flex';
}

function renderGrid() {
  const el = document.getElementById('content');

  // 全部字符视图：按需分页生成
  if (currentView === 'all') {
    buildAllSegIndex();
    const total = allCharsTotal;
    if (total <= 0) {
      el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);font-size:16px">暂无字符</div>';
      document.getElementById('pagination').innerHTML = '';
      setCount(''); clearControlBar(); return;
    }
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const start = currentPage * PAGE_SIZE;
    const page = getAllCharsPage(start, PAGE_SIZE);
    // 保存当前页码点到 currentChars 供详情导航使用
    currentChars = page;

    setCount(`共 ${total.toLocaleString()} 个字符`);
    renderPagination(totalPages);
    renderGridControlBar(page);

    let html = '<div class="grid">';
    page.forEach((cp, i) => { html += renderCell(cp, i); });
    html += '</div>';
    el.innerHTML = html;
    return;
  }

  if (!currentChars.length) {
    el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);font-size:16px">暂无字符</div>';
    document.getElementById('pagination').innerHTML = '';
    setCount(''); clearControlBar(); return;
  }
  const totalPages = Math.ceil(currentChars.length / PAGE_SIZE);
  const start = currentPage * PAGE_SIZE;
  const page = currentChars.slice(start, start + PAGE_SIZE);

  // N1：浏览记录视图复用 renderGrid，计数不能被改写成「个字符」
  setCount(currentView === 'history'
    ? `共 ${currentChars.length} 条记录`
    : `共 ${currentChars.length} 个字符`);
  renderPagination(totalPages);
  renderGridControlBar(page);

  let html = '<div class="grid">';
  page.forEach((cp, i) => { html += renderCell(cp, i); });
  html += '</div>';
  el.innerHTML = html;
}

function renderRandomGrid() {
  const el = document.getElementById('content');
  if (!currentChars.length) {
    el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);font-size:16px">暂无字符</div>';
    document.getElementById('pagination').innerHTML = '';
    setCount(''); return;
  }
  setCount(`共 ${currentChars.length} 个字符`);
  document.getElementById('pagination').innerHTML = '';
  let html = '<div class="grid">';
  currentChars.forEach((cp, i) => { html += renderCell(cp, i); });
  html += '</div>';
  // 随机字符底部免责声明
  html += `<div style="text-align:center;padding:20px 16px;margin-top:12px;color:var(--muted);font-size:12px;line-height:1.7;border-top:1px dashed var(--border);opacity:0.9">⚠️ 语言分区可能不准确，请见谅。<br>Unicode 区块按语言/文字划分仅为参考，部分字符可能跨语言使用或归属存疑。</div>`;
  el.innerHTML = html;
}

// 渲染单个字符网格单元（包含特殊字符警示样式）
function renderCell(cp, animIdx) {
  const flags = getCharFlags(cp);
  const display = getCharDisplay(cp);
  const isFav = favorites.has(cp);

  // 计算警示样式类
  const warnClasses = [];
  let badgeClass = '', badgeText = '';
  if (flags.isSurrogate) { warnClasses.push('warn-surrogate'); badgeClass='b-sur'; badgeText='代理'; }
  else if (flags.isNoncharacter) { warnClasses.push('warn-nonchar'); badgeClass='b-non'; badgeText='非字符'; }
  else if (flags.isPrivateUse) { warnClasses.push('warn-pua'); badgeClass='b-pua'; badgeText='私用'; }
  else if (flags.isControl) { warnClasses.push('warn-control'); badgeClass='b-ctrl'; badgeText='控制'; }
  else if (flags.isUnassigned) { warnClasses.push('warn-unassigned'); badgeClass='b-una'; badgeText='未分配'; }
  else if (flags.isInvisible) { warnClasses.push('warn-invisible'); badgeClass='b-inv'; badgeText='隐形'; }

  const chClass = flags.isInvisible ? 'ch invisible-marker' : 'ch';
  const badge = badgeClass ? `<span class="warn-badge ${badgeClass}">${badgeText}</span>` : '';
  const animStyle = (typeof animIdx === 'number') ? ` style="animation-delay:${Math.min(animIdx*0.003, 0.3)}s"` : '';
  const enterCls = (typeof animIdx === 'number') ? 'cell-enter' : ''; // 虚拟滚动重渲染时不播入场动画
  const modeCls = clickFavMode ? 'cell-favmode' : '';
  const cpHex = cp.toString(16).toUpperCase().padStart(4, '0');
  // 非"点击收藏"模式下，悬停提示字符名称，不用打开详情就能辨认
  const charName = getCharName(cp) || `U+${cpHex}`;
  const cellTitle = clickFavMode ? (isFav ? '点击取消收藏' : '点击加入收藏') : `${charName} (U+${cpHex})`;
  const onclk = clickFavMode ? `onclick="quickToggleFav(${cp})"` : `onclick="showDetail(${cp})"`;

  return `
    <div class="cell ${enterCls} ${warnClasses.join(' ')} ${modeCls}" ${animStyle} ${onclk} data-name="${escapeHtml(charName)}" data-hex="${cpHex}" title="${escapeHtml(cellTitle)}">
      ${badge}
      <span class="quick-fav ${isFav?'on':''}" title="${isFav?'已收藏':'未收藏'}">${isFav?'★':'☆'}</span>
      <span class="${chClass}">${escapeHtml(display)}</span>
      <span class="cp">U+${cpHex}</span>
    </div>`;
}

function onRandomPartitionChange() {
  randomPartition = document.getElementById('randomPartition').value;
  readRandomCount();
  generateRandomChars();
}

// 读取并钳制「数量」输入框（10–2000），并把钳制后的值回写到输入框，
// 否则输入 5000 时界面显示 5000、实际只出 2000，输入框在骗人
function readRandomCount() {
  const el = document.getElementById('randomCount');
  let n = el ? parseInt(el.value, 10) : NaN;
  if (!Number.isFinite(n)) n = randomCount;
  n = Math.min(2000, Math.max(10, n));
  randomCount = n;
  if (el && el.value !== String(n)) el.value = n;
  return n;
}

function generateRandomChars() {
  // 彩蛋④（v0.2.18）：随机页连着按 8 次「重新生成」→ 字符雨
  if (currentView === 'random') {
    _randClicks++;
    if (_randClicks >= 8) { _randClicks = 0; eggFire('ui-random8'); }
  }
  readRandomCount();
  const chars = [];

  if (randomPartition === 'all') {
    // 全部区域随机（使用轻量检查代替 getCharName 以提升性能）
    for (let i = 0; i < randomCount; i++) {
      const [start,end] = RANDOM_RANGES[Math.floor(Math.random()*RANDOM_RANGES.length)];
      const cp = Math.floor(Math.random()*(end-start+1)) + start;
      if (safeChr(cp) && !isControlChar(cp)) chars.push(cp);
    }
    // F4：其它分支都设了标题，这里原来漏了，从「中文」切到「全部区域」标题还停在「中文」
    setTitle('随机字符 — 全部区域', 'dice');
  } else if (randomPartition.startsWith('block:')) {
    // 指定区块随机
    const idx = parseInt(randomPartition.split(':')[1]);
    const [cn,en,start,end] = activeBlocks()[idx];
    const range = end - start + 1;
    if (range > randomCount * 3) {
      // 大区间：随机采样
      const seen = new Set();
      let attempts = 0;
      while (chars.length < randomCount && attempts < randomCount * 10) {
        const cp = Math.floor(Math.random()*range) + start;
        if (safeChr(cp) && !seen.has(cp)) { chars.push(cp); seen.add(cp); }
        attempts++;
      }
    } else {
      // 小区间：打乱取前 N 个
      const pool = [];
      for (let cp = start; cp <= end; cp++) {
        if (safeChr(cp)) pool.push(cp);
      }
      // Fisher-Yates 洗牌
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      chars.push(...pool.slice(0, Math.min(randomCount, pool.length)));
    }
    setTitle(`随机字符 — ${cn}`, 'dice');
  } else if (randomPartition.startsWith('cat:')) {
    // 指定类别随机
    const cat = randomPartition.split(':')[1];
    buildCategoryIndex();
    const pool = categoryIndex[cat] || [];
    if (pool.length === 0) {
      const el = document.getElementById('content');
      el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);font-size:16px">该类别暂无字符数据<br>请先在设置中更新 Unicode 数据库</div>';
      document.getElementById('pagination').innerHTML = '';
      setCount('');
      return;
    }
    const seen = new Set();
    let attempts = 0;
    while (chars.length < randomCount && attempts < randomCount * 10) {
      const cp = pool[Math.floor(Math.random()*pool.length)];
      if (!seen.has(cp)) { chars.push(cp); seen.add(cp); }
      attempts++;
    }
    setTitle(`随机字符 — ${CATEGORY_INFO[cat][0]} (${cat})`, 'dice');
  } else if (randomPartition.startsWith('lang:')) {
    // 指定语言分区随机
    const langId = randomPartition.split(':')[1];
    const langEntry = LANG_PARTITIONS.find(p => p[0] === langId);
    if (!langEntry) { currentChars = []; renderRandomGrid(); return; }
    const [, langName, ranges] = langEntry;
    let totalSize = 0;
    for (const [s, e] of ranges) totalSize += (e - s + 1);
    if (totalSize > randomCount * 5) {
      const seen = new Set();
      let attempts = 0;
      while (chars.length < randomCount && attempts < randomCount * 20) {
        const [start, end] = ranges[Math.floor(Math.random() * ranges.length)];
        const cp = Math.floor(Math.random() * (end - start + 1)) + start;
        if (safeChr(cp) && !isControlChar(cp) && !seen.has(cp)) {
          chars.push(cp); seen.add(cp);
        }
        attempts++;
      }
    } else {
      const pool = [];
      for (const [start, end] of ranges) {
        for (let cp = start; cp <= end; cp++) {
          if (safeChr(cp) && !isControlChar(cp)) pool.push(cp);
        }
      }
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      chars.push(...pool.slice(0, Math.min(randomCount, pool.length)));
    }
    setTitle(`随机字符 — ${langName}`, 'dice');
  }

  currentChars = chars;
  currentPage = 0;
  renderRandomGrid();
  document.getElementById('contentScroll').scrollTop = 0;
}

// ============================================================
// 视图 - 全部字符（按码点顺序，懒加载按需分页）
// ============================================================
let allCharsTotal = -1;       // 全部码点总数（缓存，0–0x10FFFF 全部 1,114,112 个）
let allSegOffsets = null;     // 每段的全局起始索引
let allSegFirstCP = null;     // 每段的第一个码点
let allSegCounts = null;      // 每段码点数
const ALL_SEG_SIZE = 0x10000; // 每段大小（65536）

function buildAllSegIndex() {
  if (allSegOffsets) return;
  const offsets = [], firstCPs = [], counts = [];
  let globalIdx = 0;
  for (let segStart = 0; segStart <= 0x10FFFF; segStart += ALL_SEG_SIZE) {
    const segEnd = Math.min(segStart + ALL_SEG_SIZE, 0x110000);
    let segCount = segEnd - segStart;
    // 段 0：排除代理对码点（0xD800-0xDFFF 只在段 0）
    if (segStart === 0) {
      const surrStart = Math.max(0xD800, segStart);
      const surrEnd = Math.min(0xDFFF + 1, segEnd);
      segCount -= (surrEnd - surrStart);
    }
    offsets.push(globalIdx);
    firstCPs.push(segStart);
    counts.push(segCount);
    globalIdx += segCount;
  }
  allSegOffsets = offsets;
  allSegFirstCP = firstCPs;
  allSegCounts = counts;
  allCharsTotal = globalIdx;
}

// 获取第 idx 个有效码点（全局索引，排除代理对）
function getCPByGlobalIdx(idx) {
  buildAllSegIndex();
  // 二分查找所在段
  let lo = 0, hi = allSegOffsets.length - 1, segIdx = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (allSegOffsets[mid] <= idx) { segIdx = mid; lo = mid + 1; }
    else { hi = mid - 1; }
  }
  let cp = allSegFirstCP[segIdx] + (idx - allSegOffsets[segIdx]);
  // 段 0：跳过代理对区间
  if (segIdx === 0 && cp >= 0xD800) {
    cp += 0xDFFF - 0xD800 + 1; // 跳过 2048 个代理对码点
  }
  return cp;
}

// 获取从 startIdx 开始的 count 个有效码点
function getAllCharsPage(startIdx, count) {
  // F6：allCharsTotal 初值是 -1，未先建索引时 `startIdx >= total` 恒真 → 永远返回空数组
  if (allCharsTotal < 0 || !allSegOffsets) buildAllSegIndex();
  const cps = [];
  const total = allCharsTotal;
  if (startIdx >= total) return cps;
  const endIdx = Math.min(startIdx + count, total);
  for (let idx = startIdx; idx < endIdx; idx++) {
    cps.push(getCPByGlobalIdx(idx));
  }
  return cps;
}

  currentView = 'all';

// 分类页 - 手风琴切换（互斥：同时只展开一个）
function toggleCatAccordion(header) {
  const parent = header.parentElement;

  const isOpen = body.classList.contains('open');

  // 互斥：关闭所有其他分组
  document.querySelectorAll('.cat-accordion').forEach(acc => {
    const h = acc.querySelector('.cat-acc-header');
    const b = acc.querySelector('.cat-acc-body');
    h.classList.remove('open');
    b.classList.remove('open');
    h.querySelector('.cat-acc-arrow').textContent = '▶';

  if (!isOpen) {
    header.classList.add('open');
    body.classList.add('open');
    header.querySelector('.cat-acc-arrow').textContent = '▼';
    // 滚动到顶部，便于查看内容
    body.scrollTop = 0;
  }
}

function showPlaneBlocks(planeId) {

  // 过滤该平面下的所有区块（使用 activeBlocks 获取当前数据），并保存全局区块索引
  const allBlocks = activeBlocks(); // [cn, en, start, end]
  const items = [];
  for (let i = 0; i < allBlocks.length; i++) {

  setTitle(`${cn}`, 'folder');
  setCount(chars.length > 0 ? `共 ${chars.length.toLocaleString()} 个字符` : '暂无字符');

  // 控制栏：返回上一级 + 点击收藏开关
  const bar = document.getElementById('controlBar');
  const startHex = start.toString(16).toUpperCase().padStart(start > 0xFFFF ? 5 : 4, '0');
  const endHex   = end.toString(16).toUpperCase().padStart(end   > 0xFFFF ? 5 : 4, '0');
  bar.innerHTML = `
    <div style="display:flex; width:100%; gap:8px; flex-wrap:wrap; align-items:center;">
      <button class="toggle-btn" onclick="showPlaneBlocks(${planeId})">◀ 返回区块列表</button>
      <span style="color:var(--muted);font-size:13px">${en}　｜　U+${startHex}–U+${endHex}</span>
      <span style="flex:1"></span>
      <button class="ctrl-click-fav ${clickFavMode?'on':''}" onclick="setClickFavMode(${clickFavMode?'false':'true'})" title="${clickFavMode?'关闭点击收藏，点击字符恢复查看详情（会弹模态框）':'点击收藏模式：点击字符直接收藏或取消，不弹模态框'}">
        ${ic('mouse')}${clickFavMode?'点击收藏：开':'点击收藏：关'}
      </button>
      <span id="blockFavInfo" style="color:var(--muted);font-size:13px"></span>
    </div>`;
  bar.style.display = 'flex';
  // P5：先记下本区块的码点，再算收藏计数（原来顺序反了，空区块会显示上一块的数字）
  blockScrollState.cps = chars;
  blockScrollState.blockName = cn;
  updateBlockFavInfo();

  document.getElementById('pagination').innerHTML = '';
  const el = document.getElementById('content');

  if (chars.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:60px;color:var(--muted);font-size:16px">该区块暂无可用字符</div>`;
    document.getElementById('contentScroll').scrollTop = 0;
    return;
  }

  // ===== 虚拟滚动（窗口化渲染）：DOM 只挂可视区附近几排格子 =====
  // 用占位元素撑出完整滚动高度，滚动时只重渲染可视窗口，大区块（CJK 几万字符）也不卡
  const scrollRoot = document.getElementById('contentScroll');
  detachBlockScroll();
  blockScrollState.cps = chars;
  blockScrollState.blockName = cn;

  el.innerHTML = `
    <div id="virtWrap" style="position:relative; width:100%;">
      <div id="virtSpacer" style="width:1px; height:0;"></div>
      <div class="grid" id="virtWin" style="position:absolute; top:0; left:0; width:100%;"></div>
    </div>
    <div id="blockSentinel" style="text-align:center;padding:20px;color:var(--muted);font-size:13px">共 ${chars.length.toLocaleString()} 个字符</div>`;

  const spacer = document.getElementById('virtSpacer');
  const win = document.getElementById('virtWin');
  const sentinel = document.getElementById('blockSentinel');
  // P2：间距从 .grid 的 computedStyle 读，别写死 6 —— 窄屏媒体查询里 gap 会变成 4px
  let GAP = 6;
  const BUF_ROWS = 4;   // 视口上下各多渲染几排，滚动不露白
  const total = chars.length;
  let perRow = 1, rowStride = 58, curStart = -1, curEnd = -1;

  function readGap(el) {
    const cs = getComputedStyle(el);
    const g = parseFloat(cs.columnGap || cs.gap || '');
    return isNaN(g) ? 6 : g;
  }

  // 测量：每行格数（按 --cell-size 推算）+ 实际行距（渲染一行实测）
  // P3：跑两遍——第一遍写入占位高度让垂直滚动条出现，第二遍按最终可用宽度重算
  function measure() {
    GAP = readGap(win);
    const css = getComputedStyle(document.documentElement);
    const minSize = parseFloat(css.getPropertyValue('--cell-size')) || 52;
    for (let pass = 0; pass < 2; pass++) {
      perRow = Math.max(1, Math.floor((win.clientWidth + GAP) / (minSize + GAP)));
      let h = '';
      const n = Math.min(perRow, total);
      for (let i = 0; i < n; i++) h += renderCell(chars[i]);
      win.innerHTML = h;
      rowStride = win.scrollHeight + GAP;
      const rows = Math.ceil(total / perRow);
      spacer.style.height = Math.max(0, rows * rowStride - GAP) + 'px';
    }
    curStart = curEnd = -1;
  }

  // 按当前滚动位置渲染可视窗口（区间没变就跳过）
  function updateWindow(force) {
    const rows = Math.ceil(total / perRow);
    const firstRow = Math.max(0, Math.floor(scrollRoot.scrollTop / rowStride) - BUF_ROWS);
    const visibleRows = Math.ceil(scrollRoot.clientHeight / rowStride) + 1;
    const lastRow = Math.min(rows, firstRow + visibleRows + BUF_ROWS * 2);
    if (!force && firstRow === curStart && lastRow === curEnd) return;
    curStart = firstRow; curEnd = lastRow;
    const s = firstRow * perRow;
    const e = Math.min(total, lastRow * perRow);
    let html = '';
    for (let i = s; i < e; i++) html += renderCell(chars[i]);
    win.innerHTML = html;
    win.style.transform = `translateY(${firstRow * rowStride}px)`;
    sentinel.textContent = `显示第 ${(s + 1).toLocaleString()} – ${e.toLocaleString()} 个 / 共 ${total.toLocaleString()} 个字符`;
  }

  measure();
  updateWindow(true);

  // 滚动：rAF 节流
  let ticking = false;
  const scrollHandler = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateWindow(false); });
  };
  blockScrollState._scrollHandler = scrollHandler;
  scrollRoot.addEventListener('scroll', scrollHandler);

  // 窗口尺寸变化（含媒体查询切换格子尺寸）：重新测量
  let resizeTimer = null;
  const resizeHandler = () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { resizeTimer = null; measure(); updateWindow(true); }, 150);
  };
  blockScrollState._resizeHandler = resizeHandler;
  window.addEventListener('resize', resizeHandler);

  document.getElementById('contentScroll').scrollTop = 0;
}

// 更新区块收藏计数显示
function updateBlockFavInfo() {
  if (!blockScrollState || !blockScrollState.cps || !blockScrollState.cps.length) return;
  const total = blockScrollState.cps.length;

  for (const cp of blockScrollState.cps) if (favorites.has(cp)) faved++;
  const info = document.getElementById('blockFavInfo');
  if (info) info.textContent = `⭐ ${faved.toLocaleString()} / ${total.toLocaleString()} 已收藏`;
}

// 收藏平铺 - 虚拟滚动实现（只挂可视区附近几排，收藏多也不卡）
let favFlatState = { cps: [], _scrollHandler: null, _resizeHandler: null, _refresh: null };

function detachFavFlatScroll() {
  const cs = document.getElementById('contentScroll');
  if (favFlatState._scrollHandler) { cs.removeEventListener('scroll', favFlatState._scrollHandler); favFlatState._scrollHandler = null; }
  if (favFlatState._resizeHandler) { window.removeEventListener('resize', favFlatState._resizeHandler); favFlatState._resizeHandler = null; }
  favFlatState._refresh = null;
}

// ---- 收藏分组视图：每组首屏只渲染 FAV_GROUP_LIMIT 格，其余点「显示剩余」再展开 ----
// 分组视图（默认视图）不做虚拟滚动，收藏上千时整组一次性拼串会明显卡顿，
// 这里用「限量 + 展开」挡一下最坏情况。
const FAV_GROUP_LIMIT = 240;
let _favGroupRest = Object.create(null);
let _favGroupSeq = 0;

function buildFavGroupHtml(titleHtml, chars) {
  const hasRest = chars.length > FAV_GROUP_LIMIT;
  const shown = hasRest ? chars.slice(0, FAV_GROUP_LIMIT) : chars;
  let more = '';
  if (hasRest) {
    const gid = 'fg' + (++_favGroupSeq);
    _favGroupRest[gid] = chars.slice(FAV_GROUP_LIMIT);
    more = `<div style="text-align:center;padding:10px 0"><button class="toggle-btn" data-gid="${gid}" onclick="expandFavGroup(this)">显示剩余 ${chars.length - FAV_GROUP_LIMIT} 个</button></div>`;
  }
  return `
    <div class="fav-group">
      <div class="fav-group-header" onclick="toggleFavGroup(this)">
        <span class="fav-group-arrow">▼</span>
        <span class="fav-group-title">${titleHtml}</span>
        <span class="fav-group-count">${chars.length} 个</span>
      </div>
      <div class="fav-group-body">
        <div class="grid">${shown.map((cp, i) => renderCell(cp, i)).join('')}</div>
        ${more}
      </div>
    </div>`;
}

// 分帧展开：一次性拼几千格会造成几百毫秒的主线程阻塞（= 点下去像卡死），
// 这里每帧最多插 FAV_EXPAND_CHUNK 格，并给按钮加进度。
const FAV_EXPAND_CHUNK = 120;
function expandFavGroup(btn) {
  const gid = btn.getAttribute('data-gid');
  const rest = _favGroupRest[gid];
  delete _favGroupRest[gid];
  if (!rest || !rest.length) { btn.remove(); return; }
  const group = btn.closest('.fav-group');
  const grid = group ? group.querySelector('.fav-group-body .grid') : null;
  if (!grid) { btn.remove(); return; }

  let done = 0;
  btn.disabled = true;
  const label = () => { btn.textContent = `正在展开…（${done} / ${rest.length}）`; };
  label();

  const step = () => {
    // 中途切走视图：节点已脱离文档，继续写入没有意义
    if (!document.contains(grid)) { btn.remove(); return; }
    const end = Math.min(done + FAV_EXPAND_CHUNK, rest.length);
    const base = grid.children.length;
    const tmp = document.createElement('div');
    tmp.innerHTML = rest.slice(done, end).map((cp, k) => renderCell(cp, base + k)).join('');
    const frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    grid.appendChild(frag);
    done = end;
    if (done < rest.length) { label(); requestAnimationFrame(step); }
    else { btn.remove(); }
  };
  requestAnimationFrame(step);
}

function renderFavoritesFlat(favs, unit) {
  // F7：分类详情里复用的是收藏平铺，底部文案别再说「收藏」
  const UNIT = unit || '收藏';
  const el = document.getElementById('content');
  const scrollRoot = document.getElementById('contentScroll');
  detachFavFlatScroll();
  favFlatState.cps = favs;

  el.innerHTML = `
    <div id="favVirtWrap" style="position:relative; width:100%;">
      <div id="favVirtSpacer" style="width:1px; height:0;"></div>
      <div class="grid" id="favVirtWin" style="position:absolute; top:0; left:0; width:100%;"></div>
    </div>
    <div id="favFlatSentinel" style="text-align:center;padding:20px;color:var(--muted);font-size:13px">共 ${favs.length} 个${UNIT}</div>`;

  const spacer = document.getElementById('favVirtSpacer');
  const win = document.getElementById('favVirtWin');
  const sentinel = document.getElementById('favFlatSentinel');
  let GAP = 6, BUF_ROWS = 4;
  const total = () => favFlatState.cps.length;
  let perRow = 1, rowStride = 58, curStart = -1, curEnd = -1;

  function readGap(el) {
    const cs = getComputedStyle(el);
    const g = parseFloat(cs.columnGap || cs.gap || '');
    return isNaN(g) ? 6 : g;
  }

  function measure() {
    GAP = readGap(win);
    const css = getComputedStyle(document.documentElement);
    const minSize = parseFloat(css.getPropertyValue('--cell-size')) || 52;
    for (let pass = 0; pass < 2; pass++) {
      perRow = Math.max(1, Math.floor((win.clientWidth + GAP) / (minSize + GAP)));
      let h = '';
      const n = Math.min(perRow, total());
      for (let i = 0; i < n; i++) h += renderCell(favFlatState.cps[i]);
      win.innerHTML = h;
      rowStride = win.scrollHeight + GAP;
      const rows = Math.ceil(total() / perRow);
      spacer.style.height = Math.max(0, rows * rowStride - GAP) + 'px';
    }
    curStart = curEnd = -1;
  }

  function updateWindow(force) {
    const t = total();
    const rows = Math.ceil(t / perRow);
    const firstRow = Math.max(0, Math.floor(scrollRoot.scrollTop / rowStride) - BUF_ROWS);
    const visibleRows = Math.ceil(scrollRoot.clientHeight / rowStride) + 1;
    const lastRow = Math.min(rows, firstRow + visibleRows + BUF_ROWS * 2);
    if (!force && firstRow === curStart && lastRow === curEnd) return;
    curStart = firstRow; curEnd = lastRow;
    const s = firstRow * perRow;
    const e = Math.min(t, lastRow * perRow);
    let html = '';
    for (let i = s; i < e; i++) html += renderCell(favFlatState.cps[i]);
    win.innerHTML = html;
    win.style.transform = `translateY(${firstRow * rowStride}px)`;
    sentinel.textContent = t > 0 ? `显示第 ${(s + 1).toLocaleString()} – ${e.toLocaleString()} 个 / 共 ${t.toLocaleString()} 个${UNIT}` : `暂无${UNIT}`;
  }

  measure();
  updateWindow(true);

  let ticking = false;
  const scrollHandler = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateWindow(false); });
  };
  favFlatState._scrollHandler = scrollHandler;
  scrollRoot.addEventListener('scroll', scrollHandler);

  let resizeTimer = null;
  const resizeHandler = () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { resizeTimer = null; measure(); updateWindow(true); }, 150);
  };
  favFlatState._resizeHandler = resizeHandler;
  window.addEventListener('resize', resizeHandler);

  // 取消收藏后由 applyFavVisualUpdate 调用：重算占位高度并重渲染窗口
  favFlatState._refresh = () => { measure(); updateWindow(true); };
}

function renderFavorites() {
  // 平铺模式按收藏时间顺序（Set 插入顺序），分组模式按码点排序
  const favs = favViewMode === 'flat' ? [...favorites] : [...favorites].sort((a,b)=>a-b);
  const el = document.getElementById('content');
  document.getElementById('pagination').innerHTML = '';

  // 清理之前的滚动/缩放监听（统一走 detachFavFlatScroll，否则 resize 监听会泄漏）
  detachFavFlatScroll();
  _favGroupRest = Object.create(null);   // 分组「显示剩余」的暂存引用一并丢弃
  const scrollRoot = document.getElementById('contentScroll');

  // 分类浏览模式（没有单个字符列表，currentChars 置空）
  if (favCategoryMode === 'categories') {
    currentChars = [];
    currentPage = 0;
    renderCategoryList();
    return;
  }

  // 查看特定分类
  if (favCategoryMode.startsWith('category:')) {
    const catName = decodeURIComponent(favCategoryMode.split(':')[1]);
    renderCategoryDetail(catName);
    return;
  }
  // 离开分类详情时把标签页标题还原成当前页面标题
  document.title = `${document.getElementById('pageTitle').textContent} - Unicode编码查询`;

  // "全部收藏" 下的所有场景都设置 currentChars 为收藏列表
  currentChars = favs;
  currentPage = 0;

  if (favs.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);font-size:16px">还没有收藏任何字符<br><br>点击字符查看详情，然后点击 ☆ 收藏</div>';
    setCount('');
    return;
  }

  setCount(`共 ${favs.length} 个收藏`);

  if (favViewMode === 'flat') {
    // 平铺模式：无限滚动网格（不分页）
    renderFavoritesFlat(favs);
  } else if (favViewMode === 'lang') {
    // 语言分组模式：按语言文字分组
    const groups = {};
    for (const cp of favs) {
      const langName = getCharLang(cp);
      if (!groups[langName]) groups[langName] = { name: langName, chars: [] };
      groups[langName].chars.push(cp);
    }
    const sortedGroups = Object.values(groups).sort((a,b) => b.chars.length - a.chars.length);
    let html = '';
    for (const group of sortedGroups) {
      html += buildFavGroupHtml(group.name, group.chars);
    }
    el.innerHTML = html;
  } else {
    // 分组模式：按区块分组
    const groups = {};
    for (const cp of favs) {
      const [cn, en] = getBlockInfo(cp);
      const key = en;
      if (!groups[key]) groups[key] = { cn, en, chars: [] };
      groups[key].chars.push(cp);
    }

    // 按字符数降序排列
    const sortedGroups = Object.values(groups).sort((a,b) => b.chars.length - a.chars.length);

    let html = '';
    for (const group of sortedGroups) {
      html += buildFavGroupHtml(`${group.cn} <span style="font-size:11px;color:var(--muted);font-weight:400">${group.en}</span>`, group.chars);
    }
    el.innerHTML = html;
  }
  document.getElementById('contentScroll').scrollTop = 0;
}

function toggleFavGroup(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.fav-group-arrow');
  if (body.style.display === 'none') {
    body.style.display = 'block';
    arrow.textContent = '▼';
  } else {
    body.style.display = 'none';
    arrow.textContent = '▶';
  }
}

  // 创建新分类

    <input type="text" id="newCatName" placeholder="新分类名" style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)">

  // 分类列表
  if (!catNames.length) {
    html += '<div style="text-align:center;padding:20px;color:var(--muted)">暂无分类</div>';
  } else {
    html += '<div style="max-height:300px;overflow-y:auto">';
    for (const name of catNames.sort()) {
      const count = favCategories[name] ? favCategories[name].filter(cp => favorites.has(cp)).length : 0;
      html += `<div style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border)">

      </div>`;
    }
    html += '</div>';
  }

  showModal(ic('settings') + '管理分类', html, '', [{text:'完成',cls:'primary',action:'closeModal()'}]);
}

function manageCreateCategory() {
  const input = document.getElementById('newCatName');
  const name = input ? input.value.trim() : '';
  if (!name) { showToast('请输入分类名'); return; }
  if (createFavCategory(name)) {
    openManageCategories();
  }
}

async function manageRenameCategory(oldName) {
  const newName = await uiPrompt('重命名分类', '请输入新名称：', oldName);
  if (!newName) return;
  if (renameFavCategory(oldName, newName)) {
    openManageCategories();
    if (favCategoryMode === `category:${encodeURIComponent(oldName)}`) {
      favCategoryMode = `category:${encodeURIComponent(newName)}`;
    }
  }
}

async function manageDeleteCategory(name) {
  if (await deleteFavCategory(name)) {
    openManageCategories();
    if (favCategoryMode === `category:${encodeURIComponent(name)}`) {
      favCategoryMode = 'categories';
      renderFavoritesControls();
      renderFavorites();
    }
  }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderGrid(); document.getElementById('contentScroll').scrollTop = 0; }

function nextPage() {
  let total;
  if (currentView === 'all') {
    buildAllSegIndex();

    total = Math.ceil(currentChars.length / PAGE_SIZE);

// 智能搜索：根据模式或自动识别解析输入
function doSearch() {
  const input = document.getElementById('spInput');
  if (!input) return;
  const q = input.value.trim();
  if (!q) return;
  // v0.2.22：暗号统一交给彩蛋引擎。像 42 / 5B57 这种可能真是查询的输入，
  // 彩蛋照放但不拦搜索（eggKw 返回 false），别为了玩梗耽误正事
  if (eggKw(q)) { input.value = ''; return; }
  lastSearchQuery = q;
  addRecentSearch(q);
  addLog('搜索', q);

  clearControlBar();
  let mode = searchMode;

  // 自动识别模式
  if (mode === 'auto') mode = detectSearchMode(q);

  const result = parseSearch(q, mode);
  if (!result) {
    // v0.2.29：代理项码位（U+D800–DFFF）不是合法字符，正式查询会被拦——
    // 但「半个字符」彩蛋的触发方式就是查看 U+D800，解析失败时先问一句彩蛋引擎
    const mSur = q.match(/^(?:[Uu]\+|0[xX])?([0-9A-Fa-f]{4,6})$/);
    if (mSur) {
      const surCp = parseInt(mSur[1], 16);
      if (surCp >= 0xD800 && surCp <= 0xDFFF && eggCp(surCp)) { input.value = ''; return; }
    }
    showToast('无法识别输入，请检查格式');
    return;
  }

  if (result.type === 'detail') {
    showDetail(result.cp);
  } else if (result.type === 'list') {
    currentChars = result.cps; currentPage = 0;
    // 名称搜索结果被截断时明确告知，避免用户以为"就这么多"
    setTitle(result.truncated ? `搜索: "${q}"（结果过多，仅显示前 ${result.cps.length} 个）` : `搜索: "${q}"`);
    if (result.truncated) showToast(`匹配结果过多，仅显示前 ${result.cps.length} 个`);
    setActiveNav(null);
    renderGrid();
    // emoji 序列：在网格上方显示组合后的完整字符和码点信息
    if (result.emojiStr) {
      const hexParts = result.cps.map(cp => 'U+' + cp.toString(16).toUpperCase().padStart(4, '0'));
      const infoBar = document.createElement('div');
      infoBar.style.cssText = 'text-align:center;padding:16px;margin-bottom:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;';
      infoBar.innerHTML = `
        <div style="font-size:48px;line-height:1.3;margin-bottom:8px">${escapeHtml(result.emojiStr)}</div>
        <div style="font-size:13px;color:var(--muted)">Emoji 序列：${result.cps.length} 个码点 ${hexParts.map(h => '<code style="background:var(--bg);padding:2px 6px;border-radius:3px;margin:0 2px;font-size:12px">' + h + '</code>').join(' + ')}</div>
      `;
      const content = document.getElementById('content');
      content.insertBefore(infoBar, content.firstChild);
    }
    document.getElementById('contentScroll').scrollTop = 0;
  }
  // emoji 序列也是 list 类型，走上面的分支
}

function detectSearchMode(q) {
  // HTML 实体: &...;
  if (/^&[a-zA-Z]+;$/.test(q) || /^&#x?[0-9A-Fa-f]+;$/.test(q)) return 'html';
  // CSS 转义: \XXXX
  if (/^\\[0-9A-Fa-f]{1,6}\s?$/.test(q)) return 'css';
  // URL 编码: %XX
  if (/^%[0-9A-Fa-f]{2}/.test(q)) return 'url';
  // 单个字符优先按字符解释，否则 "a" 会被当成 U+000A、"1" 被当成 U+0001
  if ([...q].length === 1) return 'char';
  // Unicode 编码: U+XXXX, 0xXXXX, 纯数字/十六进制
  if (/^(?:[Uu]\+|0[xX])?[0-9A-Fa-f]+$/.test(q) && q.length <= 10) return 'code';
  // Emoji 序列（如国旗 🇺🇳、肤色 👍🏽 等多码点字符）
  if (isEmojiSequence(q)) return 'emoji';
  // 默认按名称搜索
  return 'name';
}

// 检测是否为多码点 emoji 序列（国旗、肤色修饰、组合 emoji 等）
function isEmojiSequence(q) {
  const cps = [...q].map(c => c.codePointAt(0));
  if (cps.length < 2) return false;
  const cleanCps = cps.filter(cp => cp !== 0xFE0F && cp !== 0xE0100); // 去除变体选择器
  if (cleanCps.length < 2) return false;
  // 区域指示符序列（国旗）
  if (cleanCps.every(cp => cp >= 0x1F1E6 && cp <= 0x1F1FF)) return true;
  // 含 emoji 修饰符/ZWJ/变体选择器
  for (const cp of cps) {
    if (cp === 0x200D) return true; // ZWJ
    if (cp >= 0x1F3FB && cp <= 0x1F3FF) return true; // 肤色修饰符
    if (cp === 0xFE0F || cp === 0xFE0E) return true; // 变体选择器
  }
  // 含补充平面字符（通常是 emoji）且非全部相同
  if (cleanCps.some(cp => cp > 0xFFFF)) {
    const unique = new Set(cleanCps);
    if (unique.size > 1) return true;
  }
  return false;
}

function parseSearch(q, mode) {
  switch (mode) {
    case 'code': return parseCode(q);
    case 'char': return parseChar(q);
    case 'emoji': return parseEmojiSeq(q);
    case 'html': return parseHtmlEntity(q);
    case 'css': return parseCssEscape(q);
    case 'url': return parseUrlEncoding(q);
    case 'name': return parseName(q);
    default: return parseCode(q) || parseChar(q) || parseName(q);
  }
}

// 解析 emoji 序列：提取所有码点（去除变体选择器），同时返回完整 emoji 字符串
function parseEmojiSeq(q) {
  const cps = [...q].map(c => c.codePointAt(0)).filter(cp => cp !== 0xFE0F && cp !== 0xE0100);
  if (cps.length > 0) return { type: 'list', cps, emojiStr: q.trim() };
  return null;
}

function parseCode(q) {
  const m = q.match(/^(?:[Uu]\+|0[xX])?([0-9A-Fa-f]+)$/);
  if (m) {
    const cp = parseInt(m[1], 16);
    if (isValidCp(cp)) return { type: 'detail', cp };
    // 十六进制越界时（如 1114111）再按十进制解释一次
    if (/^\d+$/.test(q)) {
      const dec = parseInt(q, 10);
      if (isValidCp(dec)) return { type: 'detail', cp: dec };
    }
  }
  // 支持多个编码（空格或逗号分隔）→ 列表
  const parts = q.split(/[\s,，]+/).filter(Boolean);
  if (parts.length > 1) {
    const cps = [];
    for (const p of parts) {
      const mm = p.match(/^(?:[Uu]\+|0[xX])?([0-9A-Fa-f]+)$/);
      if (mm) {
        const cp = parseInt(mm[1], 16);
        if (isValidCp(cp)) cps.push(cp);
      } else if (/^\d+$/.test(p)) {
        const cp = parseInt(p, 10);
        if (isValidCp(cp)) cps.push(cp);
      }
    }
    if (cps.length) return { type: 'list', cps };
  }
  return null;
}

function parseChar(q) {
  const chars = [...q];
  if (chars.length === 1) {
    const cp = chars[0].codePointAt(0);
    return { type: 'detail', cp };
  }
  if (chars.length > 1) {
    const cps = [...new Set(chars.map(c => c.codePointAt(0)))];
    return { type: 'list', cps };
  }
  return null;
}

function parseHtmlEntity(q) {
  const entities = q.match(/&[#a-zA-Z0-9]+;/g);
  if (entities && entities.length) {
    const cps = [];
    for (const ent of entities) {
      let cp = null;
      // &#DDDD; 十进制
      let m = ent.match(/^&#(\d+);$/);
      if (m) cp = parseInt(m[1], 10);
      // &#xHHHH; 十六进制
      if (cp === null) { m = ent.match(/^&#x([0-9A-Fa-f]+);$/i); if (m) cp = parseInt(m[1], 16); }
      // 命名实体（常见）
      if (cp === null) {
        const NAMED = HTML_NAMED_ENTITIES;   // v0.2.18：原来这里是同一份数据的子集副本
        if (NAMED[ent]) cp = NAMED[ent];
      }
      if (cp !== null && isValidCp(cp)) cps.push(cp);
    }
    if (cps.length === 1) return { type: 'detail', cp: cps[0] };
    if (cps.length > 1) return { type: 'list', cps };
  }
  return null;
}

function parseCssEscape(q) {
  const m = q.match(/^\\([0-9A-Fa-f]{1,6})\s?$/);
  if (m) {
    const cp = parseInt(m[1], 16);
    if (isValidCp(cp)) return { type: 'detail', cp };
  }
  // 多个 CSS 转义
  const parts = q.match(/\\[0-9A-Fa-f]{1,6}\s?/g);
  if (parts && parts.length > 1) {
    const cps = [];
    for (const p of parts) {
      const mm = p.match(/^\\([0-9A-Fa-f]{1,6})\s?$/);
      if (mm) { const cp = parseInt(mm[1], 16); if (isValidCp(cp)) cps.push(cp); }
    }
    if (cps.length) return { type: 'list', cps };
  }
  return null;
}

function parseUrlEncoding(q) {
  try {
    const decoded = decodeURIComponent(q);
    const chars = [...decoded];
    if (chars.length === 1) return { type: 'detail', cp: chars[0].codePointAt(0) };
    if (chars.length > 1) {
      const cps = [...new Set(chars.map(c => c.codePointAt(0)))];
      return { type: 'list', cps };
    }
  } catch(e) {}
  return null;
}

function parseName(q) {
  // 单字符也走详情
  if ([...q].length === 1) {
    return { type: 'detail', cp: q.codePointAt(0) };
  }
  buildNameIndex();
  const qu = q.toUpperCase();
  const results = [];
  let truncated = false;
  for (const [name, cp] of nameIndex) {
    if (name.includes(qu)) {
      if (results.length >= NAME_SEARCH_LIMIT) { truncated = true; break; }
      results.push(cp);
    }
  }
  if (results.length) return { type: 'list', cps: results, truncated };
  return null;
}

function isValidCp(cp) {
  return cp >= 0 && cp <= 0x10FFFF && !(cp >= 0xD800 && cp <= 0xDFFF);
}

// ============================================================
// 代理对 & 字符深度分析
// ============================================================
// 返回完整的字符编码数据（包含代理对信息）
function analyzeChar(ch) {
  const cp = ch.codePointAt(0);
  const utf16Units = [];
  for (let i = 0; i < ch.length; i++) {
    utf16Units.push(ch.charCodeAt(i));
  }
  const isSurrogatePair = utf16Units.length === 2
    && utf16Units[0] >= 0xD800 && utf16Units[0] <= 0xDBFF
    && utf16Units[1] >= 0xDC00 && utf16Units[1] <= 0xDFFF;
  const highSurrogate = isSurrogatePair ? utf16Units[0] : null;
  const lowSurrogate = isSurrogatePair ? utf16Units[1] : null;

  // UTF-8
  const encoder = new TextEncoder();
  const utf8Bytes = Array.from(encoder.encode(ch));

  // HTML Entity
  const html = `&#${cp};`;
  const htmlHex = `&#x${cp.toString(16).toUpperCase()};`;

  // CSS Escape
  const css = `\\${cp.toString(16).toUpperCase().padStart(4, '0')}`;

  // URL Encode
  let url;
  try { url = encodeURIComponent(ch); } catch(e) { url = '—'; }

  const flags = getCharFlags(cp);
  const display = getCharDisplay(cp);
  const name = getCharName(cp) || `U+${cp.toString(16).toUpperCase().padStart(4, '0')}`;
  const [blockCn, blockEn] = getBlockInfo(cp);
  const cat = getCategory(cp);
  const catInfo = CATEGORY_INFO[cat] || ['未知','Unknown'];

  return {
    char: ch,
    cp,
    cpHex: cp.toString(16).toUpperCase().padStart(4, '0'),
    display,
    flags,
    name,
    blockCn, blockEn,
    category: cat,
    categoryCn: catInfo[0],
    categoryEn: catInfo[1],
    utf8: utf8Bytes.map(b=>b.toString(16).toUpperCase().padStart(2,'0')).join(' '),
    utf8Bytes,
    utf16: utf16Units.map(c=>c.toString(16).toUpperCase().padStart(4,'0')).join(' '),
    utf16Units,
    isSurrogatePair,
    highSurrogate,
    lowSurrogate,
    html, htmlHex,
    css, url,
  };
}

}
function lkAutoCandidates(cp) {

  if (cp >= 0xFF01 && cp <= 0xFF5E) out.push({ cp: cp - 0xFEE0, t: '全角 / 半角' });
  else if (cp >= 0x21 && cp <= 0x7E) out.push({ cp: cp + 0xFEE0, t: '全角 / 半角' });
  if (cp === 0x3000) out.push({ cp: 0x20, t: '全角 / 半角' });
  if (cp === 0x20) out.push({ cp: 0x3000, t: '全角 / 半角' });
  // 兼容分解：① → 1、Ａ → A、ﬀ → ff、Å → Å …
  try {
    var src = String.fromCodePoint(cp);
    if (src && typeof src.normalize === 'function') {
      var d = src.normalize('NFKD');
      if (d && d !== src) {
        var arr = Array.from(d).slice(0, 8);
        for (var i = 0; i < arr.length; i++) {
          var c = arr[i].codePointAt(0);
          if (c !== cp && c >= 0x20) out.push({ cp: c, t: '兼容分解' });
        }

  return out;
}
