<title>Unicode编码查询</title>
<script data-watchdog>
/* 启动看门狗（v0.2.16）：主脚本在文件末尾（约 3MB 处），网络把下载掐断时它永远不会执行，
   启动页就会永远转圈没有任何提示。这个小脚本在文件头部立刻可用，15 秒还没就绪就给出明确指引 */
setTimeout(function () {
  if (window.__uchxReady) return;
  var s = document.getElementById('loadingSplash');
  if (!s) return;
  var lt = s.querySelector('.lt');
  if (lt) lt.textContent = '⚠️ 加载中断：程序本体没下载完整';
  var ls = s.querySelector('.ls');
  if (ls) ls.innerHTML = '多半是到 Cloudflare 的线路不稳（B 站能开不代表这条线路稳）。<br>刷新重试或换个网络；桌面版 / APK 不用联网，不受影响';
}, 15000);
</script>
<style>
:root {
  --bg: #f8f9fa;
  --card: #ffffff;
  --text: #212529;
  --muted: #6c757d;
  --border: #dee2e6;
  --border-light: #f0f0f0;
  --accent: #3a7ebf;
  --accent-hover: #2e6599;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
  --cell-size: 52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif, "UnicodeExt", "BabelStonePkg";
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ===== 搜索页 ===== */
.search-page {
  max-width: 720px; margin: 0 auto;
  padding: 20px 0;
}
.search-page .sp-title {
  font-size: 22px; font-weight: 700; text-align: center;
  margin-bottom: 6px;
}
.search-page .sp-subtitle {
  font-size: 13px; color: var(--muted); text-align: center;
  margin-bottom: 24px;
}
.search-page .sp-box {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.search-page .sp-box input {
  flex: 1; padding: 12px 16px;
  border: 2px solid var(--border); border-radius: 10px;
  font-size: 16px; outline: none; background: var(--card); color: var(--text);
  transition: border .2s;
}
.search-page .sp-box input:focus { border-color: var(--accent); }
.search-page .sp-box button {
  padding: 12px 24px; border: none; border-radius: 10px;
  background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
  transition: background .2s; white-space: nowrap;
}
.search-page .sp-box button:hover { background: var(--accent-hover); }
.search-page .sp-modes {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
}
.search-page .sp-mode {
  padding: 5px 12px; border-radius: 16px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 12px; cursor: pointer; color: var(--muted);
  transition: all .15s;
}
.search-page .sp-mode:hover { border-color: var(--accent); color: var(--accent); }
.search-page .sp-mode.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.search-page .sp-hint {
  font-size: 12px; color: var(--muted); line-height: 1.8;
  background: var(--bg); border-radius: 8px; padding: 12px 16px;
}
.search-page .sp-hint b { color: var(--text); }
.search-page .sp-hint code {
  background: var(--card); padding: 1px 6px; border-radius: 3px;
  font-family: Consolas, monospace; font-size: 12px; border: 1px solid var(--border);
}
.search-page .sp-recent {
  margin-top: 16px;
}
.search-page .sp-recent h4 {
  font-size: 13px; color: var(--muted); margin-bottom: 8px;
}
.search-page .sp-recent-list {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.search-page .sp-recent-item {
  padding: 4px 10px; border-radius: 6px;
  background: var(--card); border: 1px solid var(--border);
  font-size: 12px; cursor: pointer; color: var(--text);
  transition: border .15s;
}
.search-page .sp-recent-item:hover { border-color: var(--accent); }

/* ===== 总览页 ===== */
.overview-page {
  max-width: 860px; margin: 0 auto; padding: 16px 0;
}
.overview-page .welcome-card {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--accent), #5b9bd5);
  color: #fff; padding: 28px 24px; border-radius: 14px;
  margin-bottom: 20px; box-shadow: 0 4px 16px rgba(58,126,191,0.25);
}
.overview-page .welcome-card h2 { font-size: 24px; margin-bottom: 6px; }
.overview-page .welcome-card p { font-size: 14px; opacity: 0.9; line-height: 1.6; }
/* 右侧的大号装饰图形：不参与布局，纯背景，窄屏自动缩小 */
.overview-page .wc-art {
  position: absolute; right: -18px; bottom: -26px;
  width: 168px; height: 168px; opacity: .16;
  color: #fff; pointer-events: none;
}
.overview-page .wc-text { position: relative; z-index: 1; max-width: 78%; }
.overview-page .stats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.overview-page .stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; text-align: center; transition: transform .2s, box-shadow .2s;
  cursor: pointer;
}
.overview-page .stat-card:hover {
  transform: translateY(-2px); box-shadow: var(--shadow-hover);
  border-color: var(--accent);
}
.overview-page .stat-num {
  font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1.2;
}
.overview-page .stat-label {
  font-size: 12px; color: var(--muted); margin-top: 4px;
}
.overview-page .section-title {
  font-size: 16px; font-weight: 600; margin: 20px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.overview-page .section-title .ni { width: 18px; height: 18px; color: var(--accent); }
.overview-page .quick-links {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.overview-page .quick-link {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 12px; text-align: center; cursor: pointer;
  transition: all .2s; text-decoration: none; color: var(--text);
}
.overview-page .quick-link:hover {
  border-color: var(--accent); color: var(--accent);
  transform: translateY(-2px); box-shadow: var(--shadow-hover);
}
.overview-page .quick-link .ql-icon {
  width: 42px; height: 42px; margin: 0 auto 9px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px; background: var(--bg);
  border: 1px solid var(--border);
  color: var(--accent);
  transition: all .22s;
}
.overview-page .quick-link .ql-icon .ni { width: 21px; height: 21px; }
.overview-page .quick-link:hover .ql-icon {
  background: var(--accent); border-color: var(--accent);
  color: #fff; transform: translateY(-1px) scale(1.06);
}
.overview-page .quick-link .ql-name { font-size: 13px; font-weight: 500; }
.overview-page .recent-list {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.overview-page .recent-item {
  padding: 5px 12px; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; cursor: pointer; font-size: 13px;
  transition: all .15s;
}
.overview-page .recent-item:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 对比 & 批量解析页 ===== */
.tool-page {
  max-width: 860px; margin: 0 auto; padding: 16px 0;
}
.tool-page .tp-title {
  font-size: 20px; font-weight: 700; margin-bottom: 4px;
}
.tool-page .tp-sub {
  font-size: 13px; color: var(--muted); margin-bottom: 16px;
}
.tool-page textarea {
  width: 100%; padding: 10px 12px;
  border: 2px solid var(--border); border-radius: 8px;
  font-size: 15px; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  background: var(--card); color: var(--text);
  outline: none; transition: border .2s; resize: vertical;
  min-height: 80px;
}
.tool-page textarea:focus { border-color: var(--accent); }
.tool-page .tp-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
}
.tool-page .tp-row input[type=text] {
  flex: 1; min-width: 140px; padding: 10px 12px;
  border: 2px solid var(--border); border-radius: 8px;
  font-size: 15px; background: var(--card); color: var(--text); outline: none;
  transition: border .2s;
}
.tool-page .tp-row input[type=text]:focus { border-color: var(--accent); }
.tool-page .tp-btn {
  padding: 10px 20px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
  transition: background .2s;
}
.tool-page .tp-btn:hover { background: var(--accent-hover); }
.tool-page .tp-btn.sec {
  background: #eee; color: #333;
}
.tool-page .tp-btn.sec:hover { background: #ddd; }
body.dark .tool-page .tp-btn.sec { background: #2d3a5c; color: #e0e0e0; }
body.dark .tool-page .tp-btn.sec:hover { background: #3d4a6c; }
/* 替换字 / 形近字（v0.2.25） */
.lk-group { margin-top: 16px; }
.lk-gh { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
.lk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.lk-card { border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 8px 6px; text-align: center; cursor: pointer; }
.lk-card:hover { border-color: var(--accent); }
.lk-ch { font-size: 38px; line-height: 1.25; height: 52px; overflow: hidden; }
.lk-cp { font-size: 11px; color: var(--accent); font-weight: 600; }
.lk-nm { font-size: 10px; color: var(--muted); line-height: 1.35; word-break: break-word; height: 28px; overflow: hidden; }
.lk-ops { display: flex; gap: 4px; justify-content: center; margin-top: 5px; }
.lk-ops button { font-size: 10px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; }
.lk-empty { font-size: 13px; color: var(--muted); line-height: 2; padding: 14px 0; }
.lk-empty button { padding: 3px 10px; margin-right: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; }
.lk-note { font-size: 11px; color: var(--muted); line-height: 1.85; margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--border-light); }
body.mu .lk-card { border-radius: var(--m3-shape-md, 12px); background: var(--md-sys-color-surface-container-low, var(--card)); }

/* 批量解析：正/反向模式切换器 */
.batch-mode-switch { display:inline-flex; border:2px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:12px; }
.batch-mode-switch button { padding:7px 16px; border:none; background:transparent; color:var(--muted); font-size:13px; cursor:pointer; transition:background .15s,color .15s; }
.batch-mode-switch button.active { background:var(--accent); color:#fff; font-weight:600; }
.batch-mode-switch button:not(.active):hover { background:var(--bg); }

/* 对比结果 */
.compare-result {
  margin-top: 16px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.compare-header {
  display: grid; grid-template-columns: 1fr 50px 1fr;
  padding: 16px 20px; background: var(--bg);
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.compare-char-cell { text-align: center; }
.compare-char-big {
  font-size: 64px; line-height: 1; margin-bottom: 8px;

}

}

/* v0.2.5：对比页的联网字形区 */
.compare-glyphs {
  margin-top: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card);
}
.cmp-glyph-head { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.cmp-glyph-row { display: flex; gap: 10px; flex-wrap: wrap; }
.cmp-glyph-slot {

.cmp-glyph-tag {

}
.cmp-glyph-loading, .cmp-glyph-none { font-size: 12px; color: var(--muted); }
.cmp-glyph-hex { font-size: 11px; color: var(--muted); font-family: Consolas, monospace; }
.compare-vs {
  text-align: center; font-size: 20px; font-weight: 700;
}
.compare-vs.eq { color: #43a047; }
.compare-vs.neq { color: #e53935; }
.compare-status {
  padding: 12px 20px; text-align: center; font-weight: 600; font-size: 14px;
}
.compare-status.same { background: #e8f5e9; color: #2e7d32; }
.compare-status.diff { background: #ffebee; color: #c62828; }
body.dark .compare-status.same { background: #1b5e20; color: #a5d6a7; }
body.dark .compare-status.diff { background: #b71c1c; color: #ef9a9a; }
.compare-detail {
  padding: 14px 20px;
}
.compare-detail table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.compare-detail th, .compare-detail td {
  padding: 7px 10px; text-align: left;
  border-bottom: 1px solid var(--border);
}
.compare-detail th {
  width: 90px; color: var(--muted); font-weight: 500;
}
.compare-detail td code {

}
.compare-detail td code.eq { color: #2e7d32; }
.compare-detail td code.neq { color: #c62828; }
.surrogate-tag {
  display: inline-block; padding: 1px 6px; margin-left: 4px;
  background: #ede7f6; color: #4527a0;

}

/* ---- 字体对比（v0.2.17）---- */
.font-strip {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px;
  -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
}
.font-card {

}
.font-card:hover { border-color: #7a9bd4; }
body.dark .font-card:hover { border-color: #5a7ab4; }
.font-card .fc-char {
  font-size: 52px; line-height: 1.2; height: 68px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.font-card .fc-name {
  font-size: 11px; color: var(--muted); margin-top: 3px;

}
.font-card .fc-src {

}
.font-card .fc-miss {

  color: #c62828; background: #ffebee; border-radius: 3px; padding: 0 4px;
}
body.dark .font-card .fc-miss { background: #3a1a1a; color: #ef9a9a; }
.font-card.fc-missed { opacity: .5; }
.font-card.fc-absent { opacity: .3; }
.font-grid {
  --fsz: 96px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));

}
.font-grid .font-card { width: auto; }
.font-grid .fc-char { font-size: var(--fsz); height: calc(var(--fsz) * 1.35); }
.font-grid .font-card .fc-src { top: 5px; left: 7px; font-size: 10px; }
.fc-controls {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 2px 0 4px; font-size: 13px; color: var(--muted);
}
.fc-controls input[type=range] { width: 160px; }
.fc-hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
.fs-more {
  font-size: 12px; color: #4a7dff; cursor: pointer; white-space: nowrap;
  font-weight: 400; margin-left: 8px;
}
body.dark .fs-more { color: #8ab0ff; }

/* 设置页图标下方的彩蛋说明（v0.2.18） */
.egg-hint {

/* 批量解析结果 */
.batch-result {
  margin-top: 16px;
}
.batch-toolbar {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  align-items: center;
}

}
.batch-toolbar select, .batch-toolbar input[type=checkbox] {

}
.batch-export-btn {
  margin-left: auto;

}
.batch-export-btn:hover { background: var(--accent-hover); }
.sep-btns {

}
.sep-btn {

}
.sep-btn:hover { border-color: var(--accent); color: var(--accent); }
.sep-btn.on {

}

.batch-joined-result .copy-joined {

  border: 1px solid var(--border); border-radius: 4px; background: var(--card);

}
.batch-joined-result .copy-joined:hover { border-color: var(--accent); color: var(--accent); }
.batch-table-wrap {
  border: 1px solid var(--border); border-radius: 8px; overflow: auto;
  max-height: 500px; background: var(--card);
}
.batch-table {
  width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px;
}
.batch-table th {
  position: sticky; top: 0; background: var(--bg);
  padding: 9px 10px; text-align: left; font-weight: 600;
  border-bottom: 2px solid var(--border); z-index: 1; white-space: nowrap;
}
.batch-table td {
  padding: 7px 10px; border-bottom: 1px solid var(--border);
  font-family: Consolas, monospace; vertical-align: middle;
}
.batch-table td.cell-ch {
  font-family: "Microsoft YaHei", sans-serif; font-size: 18px;
  text-align: center; width: 60px;
}
.batch-table td.cell-ch.inv {
  color: #d32f2f; font-weight: 700; font-size: 12px;

}

.batch-table .tag-sur {
  display: inline-block; padding: 1px 4px; margin-left: 2px;
  background: #ede7f6; color: #4527a0; border-radius: 3px;
  font-size: 9px; font-weight: 700; font-family: sans-serif;
}
body.dark .batch-table .tag-sur { background: #4527a0; color: #ede7f6; }

/* ===== 左侧边栏 ===== */
.sidebar {
  width: 200px; min-width: 200px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px 12px 20px;
  display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto;
}
.sidebar h2 {
  font-size: 16px; font-weight: 700;
  padding: 0 8px 8px; color: var(--text);
}
.sidebar .nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 10px 12px; border: none; border-radius: 8px;
  background: transparent; color: var(--text);
  font-size: 14px; cursor: pointer;
  transition: background .15s;
}
.sidebar .nav-btn:hover { background: #e9ecef; }
.sidebar .nav-btn.active { background: var(--accent); color: #fff; }

/* ===== 图标（内联 SVG，stroke 跟随 currentColor，深浅色自动适配） ===== */
.ni {
  width: 18px; height: 18px; flex: 0 0 auto;
  display: block;
  /* 矢量描边在缩放时不做像素对齐，肉眼看更锐利 */
  shape-rendering: geometricPrecision;
}
.ni.sm { width: 16px; height: 16px; }
.ni.lg { width: 22px; height: 22px; }
/* 标题里的图标：跟文字基线对齐，比 emoji 更服帖 */
.nh { display: inline-flex; align-items: center; gap: 8px; }
.nh .ni { width: 19px; height: 19px; color: var(--accent); }

.sidebar .sep {

  margin: 8px 0;
}
.sidebar .theme-toggle {
  padding: 0 8px; display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted);
}
.sidebar .fav-count {
  padding: 0 8px; font-size: 12px; color: var(--muted);
}
.sidebar .settings-btn {
  width: 36px; height: 36px; margin: 4px auto 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 50%; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; color: var(--muted);
}
.sidebar .settings-btn:hover {
  color: var(--accent); border-color: var(--accent);
  transform: rotate(90deg);
}

/* ===== 主内容区 ===== */
.main {
  flex: 1; display: flex; flex-direction: column;
  padding: 16px 20px 20px; overflow: hidden;
}

/* 视图切换动画
   时长和曲线全部走变量，由「设置 → 动画效果」实时控制：
   --anim-speed 由滑块调节（0.6x ~ 1.6x），--ease-out / --ease-spring 由档位切换。
   注意：这些变量必须挂在 body 上——CSS 变量里的 var() 在「声明所在的元素」就算死了，
   挂 :root 的话滑块改 --anim-speed 不会重新计算 --anim-ui，动画时长永远不变。 */
body {
  --anim-speed: 1;
  --ease-out: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --anim-ui: calc(.3s * var(--anim-speed));
  --anim-cell: calc(.42s * var(--anim-speed));
}
.view-enter {
  animation: viewEnter var(--anim-ui) var(--ease-out) backwards;
}
@keyframes viewEnter {
  from { opacity: 0; transform: translateY(14px) scale(.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
/* v0.2.3：左右滑动切栏目时，新栏目从滑动方向那一侧滑进来 */
.view-enter-next {
  animation: viewEnterNext var(--anim-ui) var(--ease-out) backwards;
}
@keyframes viewEnterNext {
  from { opacity: 0; transform: translateX(34px) scale(.99); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
.view-enter-prev {
  animation: viewEnterPrev var(--anim-ui) var(--ease-out) backwards;
}
@keyframes viewEnterPrev {
  from { opacity: 0; transform: translateX(-34px) scale(.99); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
.cell-enter {
  animation: cellEnter var(--anim-cell) var(--ease-out) both;
}
@keyframes cellEnter {
  from { opacity: 0; transform: translateY(10px) scale(.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Q弹档：过冲回弹（数值小一点，避免大量格子同时弹跳时发飘） */
body.anim-bouncy {
  --ease-out: cubic-bezier(.34,1.56,.64,1);
  --ease-spring: cubic-bezier(.34,1.7,.5,1);
  --anim-cell: calc(.52s * var(--anim-speed));
  --anim-ui: calc(.36s * var(--anim-speed));
}
body.anim-bouncy .cell-enter { animation-name: cellEnterBouncy; }
@keyframes cellEnterBouncy {
  0%   { opacity: 0; transform: translateY(14px) scale(.86); }
  68%  { opacity: 1; transform: translateY(-2px) scale(1.035); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
body.anim-bouncy .modal-overlay.show .modal { animation-name: modalInBouncy; }
@keyframes modalInBouncy {
  0%   { opacity: 0; transform: translateY(22px) scale(.92); }
  68%  { opacity: 1; transform: translateY(-3px) scale(1.012); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* 侧边栏按钮动画 */
.nav-btn {
  position: relative;
  transition: background .2s, transform .15s, color .2s;
}
.nav-btn:hover { transform: translateX(2px); }
.nav-btn:active { transform: translateX(0) scale(.97); }
.nav-btn::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0);
  width: 3px; height: 60%; background: var(--accent); border-radius: 0 3px 3px 0;
  transition: transform .25s cubic-bezier(.22,1,.36,1);
}
.nav-btn.active::before { transform: translateY(-50%) scaleY(1); }

/* 卡片悬停效果：高亮统一在下方 .cell 定义区用伪元素实现（大量元素下性能更好） */
.cell:active { transform: translateY(-1px) scale(.97); }

/* 模态框淡入 */
.modal-overlay.show .modal {
  animation: modalIn .28s cubic-bezier(.22,1,.36,1) both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Toast 通过过渡实现滑入/滑出 */

/* 动画开关：禁用所有动画和过渡 */
body.no-animations *, body.no-animations *::before, body.no-animations *::after {
  animation-duration: 0s !important;
  animation-delay: 0s !important;
  transition-duration: 0s !important;
  transition-delay: 0s !important;
}


/* 按钮/输入框过渡 */
button, input, select, textarea, .sp-mode, .tp-btn, .file-upload-btn {
  transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
}
.tp-btn:active, .sp-mode:active, .file-upload-btn:active { transform: scale(.96); }
.file-upload-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.06); }
.main-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; flex-shrink: 0;
}
.main-header h1 { font-size: 20px; display: flex; align-items: center; gap: 9px; }
.main-header h1 .ni { color: var(--accent); }
.main-header h1 .ni.lg { width: 21px; height: 21px; }
.main-header .count { font-size: 13px; color: var(--muted); }

/* 控制栏（随机/收藏分区用） */
.control-bar {
  display: none;
  padding: 0 0 12px;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.control-bar select,
.control-bar input[type="number"] {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border .2s;
}
.control-bar select:focus,
.control-bar input:focus { border-color: var(--accent); }
.control-bar button {
  background: var(--accent); color: #fff; border: none;
  border-radius: 6px; padding: 6px 14px;
  font-size: 13px; cursor: pointer;
  transition: background .15s;
}
.control-bar button:hover { background: var(--accent-hover); }
.control-bar button.toggle-btn {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border);
}
.control-bar button.toggle-btn.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent);
}
.control-bar button.toggle-btn:hover:not(.active) { background: #e9ecef; }
.control-bar .ctrl-label { font-size: 13px; color: var(--muted); }
.control-bar .ctrl-click-fav {
  background: #fff; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 16px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s;
}
.control-bar .ctrl-click-fav:hover { background: #f1f3f5; }
.control-bar .ctrl-click-fav.on {
  background: #fff7e6; color: #d97706; border-color: #fbbf24;
  box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.15);
}
body.dark .control-bar .ctrl-click-fav.on { background: #3a2a10; color: #fbbf24; border-color: #d97706; }
.cell.cell-favmode {
  cursor: pointer;
  outline: 1px dashed #fbbf24;
  outline-offset: -3px;
}
/* 收藏模式悬停：复用 ::after 高亮环，换黄色虚线皮肤（同样走 opacity 合成） */
.cell.cell-favmode::after {
  border: 2px dashed #d97706;
  box-shadow: var(--shadow-hover);
  background: rgba(251,191,36,.12);
}
.cell.cell-favmode:active { background: #fde68a; }
body.dark .cell.cell-favmode { outline-color: #d97706; }
body.dark .cell.cell-favmode::after { border-color: #fbbf24; background: rgba(251,191,36,.08); }
body.dark .cell.cell-favmode:active { background: #3a2a10; }
.control-bar .ctrl-fav-progress {
  font-size: 12px; color: var(--muted);
  font-family: Consolas, monospace;
  background: var(--card); padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--border);
}

.content-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  position: relative;
}

/* 字符网格 */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--cell-size), 1fr));
  gap: 6px;
}
.cell {
  aspect-ratio: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  position: relative;
  user-select: none;
  contain: layout; /* 隔离布局范围（不用 paint，避免裁剪外扩的高亮环和阴影） */
}
/* 悬停高亮：伪元素预先渲染好，hover 只切 opacity（GPU 合成，大量格子下不卡） */
.cell::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 10px;
  border: 2px solid var(--accent);
  box-shadow: var(--shadow-hover);
  opacity: 0;
  transition: opacity .1s;
  pointer-events: none;
}
.cell:hover::after { opacity: 1; }
.cell .ch {
  font-size: 22px; line-height: 1;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif, "UnicodeExt", "BabelStonePkg";
}
.cell .cp {
  font-size: 9px; font-family: Consolas, monospace;
  color: var(--muted); margin-top: 2px;
}
.cell .quick-fav {
  position: absolute; top: 1px; right: 4px;
  font-size: 13px; cursor: pointer; z-index: 2;
  color: #bbb; line-height: 1; user-select: none;
}
.cell .quick-fav.on { color: #ff9800; }

/* ===== 特殊字符警示样式 ===== */
.cell.warn-invisible { background: #fff8e1; border-color: #ffc107; }
.cell.warn-control { background: #ffebee; border-color: #f44336; }
.cell.warn-pua { background: #fff3e0; border-color: #ff9800; }
.cell.warn-nonchar { background: #fce4ec; border-color: #e91e63; }
.cell.warn-unassigned { background: #f5f5f5; border-color: #9e9e9e; border-style: dashed; }
.cell.warn-surrogate { background: #ede7f6; border-color: #673ab7; border-style: dashed; }
.cell .ch.invisible-marker {
  color: #d32f2f;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.5px;
  padding: 2px 4px;
  border: 1px dashed currentColor;
  border-radius: 4px;
  background: rgba(255,255,255,0.6);

/* Toast */
/* ===== Material You 界面风格（v0.2.20）=====
   只覆盖观感层：大圆角、色调化表面、主题色。深浅色模式可任意组合。 */
body.mu {
  --accent: var(--mu-primary);
  --accent-hover: var(--mu-primary);
  --bg: var(--mu-bg);
  --card: var(--mu-card);
}
body.mu.dark {
  --bg: var(--mu-dbg);
  --card: var(--mu-dcard);
}
body.mu .modal { border-radius: 28px; }
body.mu .toast { border-radius: 999px; }
body.mu .sidebar .nav-btn { border-radius: 999px; }
body.mu .sidebar .nav-btn.active { background: var(--mu-soft); }
body.mu.dark .sidebar .nav-btn.active { background: var(--mu-don); }
body.mu .sidebar .nav-btn.active::before { display: none; }
body.mu .set-switch { border-radius: 999px; }
body.mu .set-switch.on .track { background: var(--mu-primary); }
body.mu .tool-page .tp-btn { border-radius: 999px; }
body.mu .file-upload-btn { border-radius: 999px; }
body.mu .anim-seg { border-radius: 999px; }
body.mu .anim-seg-btn { border-radius: 999px; }
body.mu .anim-seg-btn.on { background: var(--mu-primary); }

/* ===== Material 3 / Material You 设计令牌（v0.2.24）=====
   之前只换了 3 个变量、把一堆控件全塞成 999px 胶囊，那是皮不是骨。
   这次按 m3.material.io 的规范补上五件真正定义 M3 的东西：
   ① 颜色按「角色」分配（primary / on-primary / container / surface / outline…），
      角色值由种子色生成的 13 档色调色板按明暗映射，组件里不再写死 hex；
   ② 表面高度用 surface-container 五级 + primary tint 表达，阴影只给真正浮起的层；
   ③ 形状有档位（xs/sm/md/lg/xl/full），不同组件用不同档，不是全场一个圆角；
   ④ 每个可点元素有 state layer：hover 8% / focus 10% / pressed 10%；
   ⑤ 动效用 emphasized 缓动、150–300ms，容器变换表达层级而不是炫技。
   叠加 ui-zhigan：间距只走 4 的倍数、左边缘对齐、去掉多余装饰、分割线能不用就不用。 */
:root {
  --m3-shape-xs: 4px;  --m3-shape-sm: 8px;  --m3-shape-md: 12px;
  --m3-shape-lg: 16px; --m3-shape-xl: 28px; --m3-shape-full: 999px;
  --m3-ease-emphasized: cubic-bezier(.2, 0, 0, 1);
  --m3-ease-decel: cubic-bezier(.05, .7, .1, 1);
  --m3-ease-accel: cubic-bezier(.3, 0, .8, .15);
  --m3-dur: 220ms;
  --m3-state-hover: .08; --m3-state-focus: .10; --m3-state-pressed: .10;
  /* 色调高度：M3 用 surface-container 五级（lowest→highest）代替阴影层级，
     具体颜色由 mu3Apply() 按种子色算好后写进 --md-sys-color-surface-container-* */
  /* 字号阶梯：display / headline / title / body / label 五组，只留三档实际字号 */
  --m3-type-title: 20px; --m3-type-body: 15px; --m3-type-label: 12px;
}

/* 角色接管 app 原有变量：这样全站（不只是设置页）都跟着动态取色走。
   fallback 写的是 M3 baseline 的浅色参考值，老 WebView 也能退。 */
body.mu {
  --accent: var(--md-sys-color-primary, var(--mu-primary));
  --accent-hover: var(--md-sys-color-primary, var(--mu-primary));
  --text: var(--md-sys-color-on-surface, #1c1b1f);
  --muted: var(--md-sys-color-on-surface-variant, #49454f);
  --border: var(--md-sys-color-outline, #79747e);
  --border-light: var(--md-sys-color-outline-variant, #e7e0ec);
  --shadow: 0 1px 2px rgba(0,0,0,.06);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.10);
}
body.mu.dark {
  --text: var(--md-sys-color-on-surface, #e6e0e9);
  --muted: var(--md-sys-color-on-surface-variant, #cac4d0);
  --border: var(--md-sys-color-outline, #938f99);
  --border-light: var(--md-sys-color-outline-variant, #49454f);
}
/* v0.2.20 那批规则保留兼容，但开关 / 分段按钮要吃「角色色」而不是种子原色，
   否则深色模式下 primary 偏暗，选中态看不出来 */
body.mu .set-switch.on .track,
body.mu .anim-seg-btn.on { background: var(--md-sys-color-primary, var(--mu-primary)); }
body.mu .set-switch.on .track .thumb { background: var(--md-sys-color-on-primary, #fff); }
body.mu .modal,
body.mu .scard { background: var(--md-sys-color-surface-container-high, var(--card)); }
body.mu .sidebar { background: var(--md-sys-color-surface-container-low, var(--bg)); }
body.mu .topbar { background: var(--md-sys-color-surface, var(--bg)); }

/* ---- state layer：所有可点组件共用一层 on-color 半透明叠色 ---- */
.m3-state { position: relative; -webkit-tap-highlight-color: transparent;
  --m3-state-color: var(--md-sys-color-on-surface, currentColor); }
.m3-state::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--m3-state-color); opacity: 0; pointer-events: none;
  border-radius: inherit;
  transition: opacity var(--m3-dur) var(--m3-ease-emphasized);
}
.m3-state:hover::after { opacity: var(--m3-state-hover); }
.m3-state:focus-visible::after { opacity: var(--m3-state-focus); }
.m3-state:active::after { opacity: var(--m3-state-pressed); }
.m3-state.m3-on-primary { --m3-state-color: var(--md-sys-color-on-primary, #fff); }
.m3-state.m3-on-primary:hover::after,
.m3-state.m3-on-primary:active::after { opacity: var(--m3-state-hover); }

/* ---- 强调层级：filled > tonal > outlined > text；一屏只留一个 filled ---- */
.m3-filled, .m3-tonal, .m3-outlined, .m3-text {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 16px; font-size: 13px; cursor: pointer;
  border-radius: var(--m3-shape-md); border: 1px solid transparent;
  transition: transform var(--m3-dur) var(--m3-ease-emphasized),
              background var(--m3-dur) var(--m3-ease-emphasized);
}
.m3-filled { background: var(--md-sys-color-primary, var(--accent));
  color: var(--md-sys-color-on-primary, #fff); border-radius: var(--m3-shape-full); }
.m3-tonal { background: var(--md-sys-color-secondary-container, var(--bg));
  color: var(--md-sys-color-on-secondary-container, var(--text)); }
.m3-outlined { background: transparent; border-color: var(--md-sys-color-outline, var(--border));
  color: var(--md-sys-color-primary, var(--accent)); }
.m3-text { background: transparent; color: var(--md-sys-color-primary, var(--accent)); }
.m3-filled:active, .m3-tonal:active, .m3-outlined:active, .m3-text:active { transform: scale(.97); }
.m3-filled .ni, .m3-tonal .ni, .m3-outlined .ni, .m3-text .ni { width: 16px; height: 16px; }

/* ===== 设置主界面：分组入口列表（M3 list item，单行 56dp / 双行 72dp）===== */
.sc-home { padding: 0 0 8px; }
.sc-group {
  font-size: var(--m3-type-label); font-weight: 600; letter-spacing: .02em;
  color: var(--muted); padding: 20px 8px 4px;
}
.sc-group:first-child { padding-top: 4px; }
.sc-entry {
  display: flex; align-items: center; gap: 16px; width: 100%;
  min-height: 56px; padding: 8px 12px; margin: 0;
  background: transparent; border: none; border-radius: var(--m3-shape-md);
  text-align: left; color: var(--text); cursor: pointer;
  transition: background var(--m3-dur) var(--m3-ease-emphasized),
              transform var(--m3-dur) var(--m3-ease-emphasized);
}
.sc-entry:active { transform: scale(.985); }
.sc-entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sc-entry .sc-ic {
  width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--muted);
}
.sc-entry .sc-ic .ni { width: 20px; height: 20px; }
.sc-entry .sc-tx { flex: 1; min-width: 0; }
.sc-entry .sc-t { display: block; font-size: var(--m3-type-body); font-weight: 500; line-height: 1.35; }
.sc-entry .sc-s {
  display: block;
  font-size: var(--m3-type-label); color: var(--muted); margin-top: 2px;
  line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sc-entry .sc-chev { flex: 0 0 auto; color: var(--muted); width: 16px; height: 16px; }
.sc-entry .sc-badge {
  flex: 0 0 auto; font-size: 11px; color: var(--muted);
  background: var(--bg); border-radius: var(--m3-shape-full); padding: 2px 8px;
}
body.mu .sc-entry .sc-ic {
  background: var(--md-sys-color-secondary-container, var(--bg));
  color: var(--md-sys-color-on-secondary-container, var(--text));
}
body.mu .sc-group { color: var(--md-sys-color-primary, var(--accent)); }
body.mu .sc-entry .sc-badge {
  background: var(--md-sys-color-surface-container-high, var(--bg));
  color: var(--md-sys-color-on-surface-variant, var(--muted));
}
.sc-home-hint { font-size: 11px; color: var(--muted); padding: 12px 8px 0; line-height: 1.6; }

/* ===== 设置小卡片：M3 basic dialog（28dp 圆角 / 24dp 内距 / 280–560dp 宽）===== */
.scard-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 250;
  background: rgba(0,0,0,.32);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity var(--m3-dur) var(--m3-ease-emphasized);
}
.scard-overlay.show { opacity: 1; pointer-events: auto; }
.scard {
  width: 520px; max-width: 92vw; max-height: 82vh;
  display: flex; flex-direction: column;
  background: var(--card); color: var(--text);
  border-radius: var(--m3-shape-lg); padding: 24px;
  box-shadow: 0 12px 32px rgba(0,0,0,.18);
  transform: translateY(16px) scale(.98); opacity: .6;
  transition: transform var(--m3-dur) var(--m3-ease-decel),
              opacity var(--m3-dur) var(--m3-ease-decel);
}
.scard-overlay.show .scard { transform: none; opacity: 1; }
/* 移除 .show 时同一条 transition 反向播放：轻退场，不飞出屏幕 */
.scard-handle { display: none; }
.scard-head { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; }
.scard-head .sc-hicon {
  width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--accent);
}
.scard-head .sc-hicon .ni { width: 20px; height: 20px; }
.scard-head .sc-htx { flex: 1; min-width: 0; }
.scard-head h2 { font-size: var(--m3-type-title); font-weight: 500; line-height: 1.3; }
.scard-head p { font-size: var(--m3-type-label); color: var(--muted); margin-top: 2px; line-height: 1.5; }
.scard-close {
  flex: 0 0 auto; width: 40px; height: 40px; border: none; border-radius: 50%;
  background: transparent; color: var(--muted); cursor: pointer; font-size: 20px;
}
.scard-body { flex: 1; overflow-y: auto; padding: 0 2px 8px; min-height: 0; }
.scard-foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; }
.scard-body .settings-section { margin-bottom: 20px; }
.scard-body .settings-section:last-child { margin-bottom: 4px; }
.scard-body .settings-section h3 {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px;
}
/* .ni 是 display:block，不显式 flex 的话图标会独占一行、标题掉到下一行 */
.scard-body .settings-section h3 .ni {
  width: 16px; height: 16px; margin: 0; color: inherit; vertical-align: middle;
}
.scard-body .settings-section.foldable > h3 { display: flex; cursor: default; }
.scard-body .settings-section.foldable > h3:hover { background: transparent; }
.scard-body .settings-section.foldable > .sec-body { display: block; }
.scard-body .settings-fold-bar { display: none; }
body.mu .scard {
  border-radius: var(--m3-shape-xl);
  background: var(--md-sys-color-surface-container-high, var(--card));
  box-shadow: 0 8px 24px rgba(0,0,0,.14);
}
body.mu .scard-head .sc-hicon {
  background: var(--md-sys-color-primary-container, var(--bg));
  color: var(--md-sys-color-on-primary-container, var(--accent));
}

/* ---- 卡片里「字又多」的解法：长说明收进一行折叠，控件优先 ---- */
.sc-more { margin-top: 8px; }
.sc-more > summary {
  cursor: pointer; font-size: var(--m3-type-label); color: var(--muted);
  padding: 8px 0; list-style: none; user-select: none; -webkit-user-select: none;
}
.sc-more > summary::-webkit-details-marker { display: none; }
.sc-more > summary::before { content: '▸ '; }
.sc-more[open] > summary::before { content: '▾ '; }
.sc-more .sc-more-body {
  padding: 4px 0 8px; font-size: var(--m3-type-label);
  color: var(--muted); line-height: 1.75;
}
.sc-more .sc-more-body a { color: var(--accent); word-break: break-all; }
.sc-more .sc-more-body p { margin-bottom: 6px; }
.sc-more .sc-more-body code { font-family: Consolas, monospace; }
.sc-fileline { font-size: 12px; line-height: 1.9; }
.sc-fileline a { color: var(--accent); word-break: break-all; }

/* ---- 表单类设置：名称在上、控件全宽（左右排会挤窄输入框）---- */
.sc-field { margin: 0 0 12px; }
.sc-field label {
  display: block; font-size: var(--m3-type-label); color: var(--muted); margin-bottom: 4px;
}
.sc-field input {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: var(--m3-shape-sm);
  background: var(--card); color: var(--text); font-size: 14px;
}
.sc-field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sc-field input::placeholder { color: var(--muted); opacity: .8; }
.sc-field-row { display: flex; gap: 8px; align-items: center; }
.sc-field-row input { flex: 1; min-width: 0; }
.sc-toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 48px; padding: 4px 0;
}
.sc-toggle-row .sc-tr-label { font-size: 13px; }
.sc-inline-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.sc-primary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 48px; padding: 12px 16px;
  border: none; border-radius: var(--m3-shape-full);
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: transform var(--m3-dur) var(--m3-ease-emphasized);
}
.sc-primary:active { transform: scale(.97); }
.sc-primary .ni { width: 17px; height: 17px; }
.sc-note { font-size: var(--m3-type-label); color: var(--muted); line-height: 1.65; margin: 8px 0 0; }

/* 手机上按 M3 走 modal bottom sheet：贴底、28dp 顶圆角、drag handle */
@media (max-width: 600px) {
  .scard-overlay { align-items: flex-end; }
  .scard {
    width: 100%; max-width: 640px; max-height: 88vh;
    border-radius: var(--m3-shape-xl) var(--m3-shape-xl) 0 0;
    padding: 12px 20px 20px;
  }
  .scard-handle {
    display: block; width: 32px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 0 auto 12px;
  }
  .sc-entry .sc-s { white-space: normal; }
}

/* 设置头部也收敛：图标 + 一行提示即可，别一打开先占掉小半屏。
   彩蛋说明和出处是 LCJ 明确要求留的，只压字号和行距，不删内容。 */
#settingsModal .modal-header { padding-top: 14px; }
#settingsModal #settingsAppIcon { width: 52px; height: 52px; }
#settingsModal .egg-hint { margin: 2px 0 4px; line-height: 1.45; }
#settingsModal .modal-header .name { margin-top: 3px; font-size: 17px; }
#settingsModal .modal-body { padding-top: 8px; }

.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #333; color: #fff;
  padding: 10px 20px; border-radius: 8px;
  font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity calc(.3s * var(--anim-speed)) var(--ease-out),
              transform calc(.3s * var(--anim-speed)) var(--ease-spring);
  z-index: 600;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 更新提示条：自动检查到新版本时从顶部滑下来，不挡操作，可关可稍后 */
.update-bar {
  position: fixed; top: 14px; left: 50%;
  transform: translateX(-50%) translateY(-24px);
  max-width: min(92vw, 540px); box-sizing: border-box;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 12px;
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  font-size: 13px; line-height: 1.5;
  opacity: 0; pointer-events: none;
  transition: opacity calc(.28s * var(--anim-speed)) var(--ease-out),
              transform calc(.28s * var(--anim-speed)) var(--ease-spring);
  z-index: 610;
}
.update-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.update-bar .ub-text { flex: 1; min-width: 140px; }
.update-bar .ub-text b { color: var(--accent); }
.update-bar .ub-btn {
  padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
}
.update-bar .ub-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

/* ===== 彩蛋（v0.2.15）：图标翻转 / 字符雨 / 码位挑战 ===== */
@keyframes eggFlip {
  0%   { transform: rotateY(0) scale(1); }
  50%  { transform: rotateY(90deg) scale(1.08); }
  100% { transform: rotateY(0) scale(1); }
}
.egg-flipping { animation: eggFlip .55s ease-in-out; }
.egg-char-rain {
  position: fixed; top: -70px; z-index: 99990; pointer-events: none;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif, "UnicodeExt", "BabelStonePkg";
  line-height: 1;
  animation: eggRainFall linear forwards;
}
@keyframes eggRainFall {
  to { transform: translateY(115vh) rotate(var(--egg-spin, 360deg)); opacity: .85; }
}
.update-bar .ub-close {
  border: none; background: none; cursor: pointer; color: var(--muted);
  font-size: 16px; line-height: 1; padding: 2px 4px;
}

/* Dark mode */
body.dark {
  --bg: #1a1a2e;
  --card: #16213e;
  --text: #e0e0e0;
  --muted: #8892b0;
  --border: #2d3a5c;
  --accent: #64b5f6;
  --accent-hover: #90caf9;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
}
body.dark .sidebar .nav-btn:hover { background: #2d3a5c; }
body.dark .modal-row { border-bottom-color: #2d3a5c; }
body.dark .settings-row { border-bottom-color: #2d3a5c; }
body.dark .pagination button:hover:not(:disabled) { background: #2d3a5c; }
body.dark .modal-footer button.secondary { background: #2d3a5c; color: #e0e0e0; border-color: #3d4a6c; }
body.dark .modal-footer button.secondary:hover { background: #3d4a6c; }
body.dark .control-bar button.toggle-btn { background: #2d3a5c; color: #e0e0e0; border-color: #3d4a6c; }
body.dark .control-bar button.toggle-btn:hover:not(.active) { background: #3d4a6c; }
body.dark .fav-group-header:hover { background: #2d3a5c; }
body.dark .settings-reset-btn { background: #2d3a5c; color: #e0e0e0; border-color: #3d4a6c; }
body.dark .settings-reset-btn:hover { background: #3d4a6c; }

@media (max-width: 768px) {
  :root { --cell-size: 44px; }
  body { flex-direction: column; }
  /* 侧边栏横向滚动条 */
  .sidebar {
    width: 100%; min-width: 100%;
    padding: 6px 6px;
    border-right: none; border-bottom: 1px solid var(--border);
    flex-direction: row; flex-wrap: nowrap;
    gap: 4px; overflow-x: auto; overflow-y: hidden;
    max-height: 52px;
    -webkit-overflow-scrolling: touch;
    position: sticky; top: 0; z-index: 50;
    background: var(--card);
  }
  .sidebar::-webkit-scrollbar { height: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .sidebar h2 { display: none; }
  .sidebar .nav-btn {
    width: auto; min-width: auto;
    padding: 8px 11px; font-size: 13px;
    white-space: nowrap; flex-shrink: 0;
    gap: 6px;
  }
  .sidebar .nav-btn .ni { width: 16px; height: 16px; }
  .sidebar .sep { display: none; }
  .sidebar .theme-toggle { display: none; }
  .sidebar .fav-count { display: none; }
  /* 版本信息在横条里会把设置按钮挤出一块竖排文字，手机上看设置里的「关于」就有 */
  .sidebar .sidebar-version { display: none; }
  .sidebar .settings-btn {
    display: flex; width: 32px; height: 32px; margin: 4px 4px 0; flex-shrink: 0;
  }
  /* 主内容区 - 移除了顶部固定搜索栏的 padding */
  .main { padding: 10px 10px 16px; }
  .main-header { margin-bottom: 8px; }
  .main-header h1 { font-size: 17px; }
  /* 模态框 */
  .modal {
    width: 96vw; max-width: 96vw;
    max-height: 92vh; border-radius: 12px;
  }
  .modal.wide { width: 96vw; max-width: 96vw; }
  .modal-header { padding: 14px 14px 0; }
  .modal-header .big-char { font-size: 56px; }
  .modal-header .name { font-size: 15px; }
  .modal-body { padding: 12px 14px; }
  .modal-section { margin-bottom: 12px; }
  .modal-section h3 { font-size: 14px; }
  .modal-row {
    font-size: 12px; padding: 5px 0;
    flex-wrap: wrap; gap: 2px 8px;
  }
  .modal-row .label { min-width: 76px; font-size: 11px; }
  .modal-row .value {
    text-align: left; flex: 1 1 100%;
    font-size: 12px; word-break: break-all; line-height: 1.5;
  }
  .modal-footer {
    padding: 10px 14px 14px;
    gap: 6px;
  }
  .modal-footer button { padding: 8px 14px; font-size: 13px; flex: 1 1 auto; }
  .modal-close {
    top: 6px; right: 6px;
    width: 32px; height: 32px;
    font-size: 22px; line-height: 28px;
  }
  /* 控制栏 */
  .control-bar {
    flex-direction: row; flex-wrap: wrap; align-items: center;
    gap: 6px; padding: 6px 0;
  }
  .control-bar select, .control-bar input[type="number"] {
    width: auto; min-width: 0; flex: 1 1 120px;
  }
  .control-bar .ctrl-label { font-size: 12px; }
  .control-bar button { padding: 6px 12px; font-size: 13px; }
  /* 字符网格 */
  .grid { gap: 4px; }
  .cell .cp { font-size: 9px; }
  /* 搜索页 */
  .search-page { padding: 12px 0; max-width: 100%; }
  .search-page .sp-title { font-size: 19px; }
  .search-page .sp-box input { font-size: 15px; padding: 10px 12px; }
  .search-page .sp-box button { padding: 10px 16px; font-size: 14px; white-space: nowrap; }
  .search-page .sp-modes { gap: 4px; }
  .search-page .sp-mode { padding: 5px 10px; font-size: 11px; }
  .search-page .sp-hint { font-size: 11px; padding: 10px 12px; }
  .search-page .sp-hint code { font-size: 11px; }
  /* 工具页（对比/批量） */
  .tool-page { max-width: 100%; padding: 12px 0; }
  .tool-page .tp-title { font-size: 18px; }
  .tool-page .tp-row { gap: 6px; }
  .tool-page .tp-row input[type=text] { font-size: 15px; min-width: 0; flex: 1 1 100%; }
  .tool-page .tp-btn { padding: 9px 16px; font-size: 13px; flex: 1; }
  .tool-page textarea { font-size: 15px; }
  /* 对比结果 */
  .compare-header {
    grid-template-columns: 1fr 36px 1fr; padding: 12px;
  }
  .compare-char-big { font-size: 48px; }
  .compare-vs { font-size: 18px; }
  .compare-detail { padding: 10px 12px; }
  .compare-detail table { font-size: 12px; }
  .compare-detail th { width: 70px; font-size: 11px; }
  .compare-detail td { padding: 5px 6px; }
  .compare-detail td code { font-size: 11px; word-break: break-all; }
  /* 批量解析表格 */
  .batch-table-wrap { max-height: 400px; }
  .batch-toolbar { gap: 6px; }
  .batch-toolbar select { font-size: 12px; padding: 4px 6px; }
  .batch-export-btn { width: 100%; margin: 6px 0 0; }
  /* 设置面板 */
  .settings-section { padding: 12px; }
  .settings-section h3 { font-size: 15px; }
  .settings-section a { word-break: break-all; }
  .settings-actions { flex-direction: column; gap: 6px; }
  .settings-actions .file-upload-btn, .settings-actions button {
    width: 100%; text-align: center; padding: 10px; font-size: 14px;
  }
  /* 放大预览 */
  #zoomCanvas {
    width: 90vw !important; height: 90vw !important;
    max-width: 360px; max-height: 360px;
  }
  /* 收藏分组 */
  .fav-group-header { padding: 10px 8px; }
  .toggle-btn { padding: 6px 10px; font-size: 12px; }
  /* 分页 */
  #pagination button { padding: 6px 12px; font-size: 12px; }
  .pagination { flex-wrap: wrap; gap: 6px; }
  .pagination .pg-jump input { width: 52px !important; padding: 4px 6px; font-size: 11px; }
  .pagination #jumpUnicodeInput { width: 70px !important; }
  .pagination .pg-jump button { padding: 4px 8px; font-size: 11px; }
}

@media (max-width: 480px) {
  :root { --cell-size: 36px; }
  .search-page .sp-box { flex-direction: column; gap: 6px; }
  .search-page .sp-box button { width: 100%; }
  .main-header { flex-direction: column; align-items: flex-start; gap: 2px; }
  .main-header h1 { font-size: 16px; }
  .cell .ch { font-size: 18px; }
  .cell .cp { font-size: 8px; }
  .modal { max-height: 94vh; border-radius: 10px; }
  .modal-header .big-char { font-size: 48px; }
  .modal-section h3 { font-size: 13px; }
  .compare-char-big { font-size: 40px; }
  .compare-header { grid-template-columns: 1fr 30px 1fr; }
  /* 详情弹窗底部按钮 2 列 */
  .modal-footer { flex-wrap: wrap; }
  .modal-footer button { flex: 1 1 45%; }
  /* 放大预览导出按钮 2x2 */
  .modal-body > div:last-child > button {
    flex: 1 1 45% !important; padding: 8px 10px !important; font-size: 12px !important;
  }
}
/* 首屏加载占位：脚本下载 + 字典解压期间显示，初始渲染时自动移除 */
.loading-splash {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16vh 20px 0; color: var(--muted); text-align: center;
}
.loading-splash .spin {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--accent);
  animation: lspin 0.9s linear infinite;
}
.loading-splash .lt { margin: 14px 0 0; font-size: 14px; color: var(--text); }
.loading-splash .ls { margin: 6px 0 0; font-size: 12px; }
@keyframes lspin { to { transform: rotate(360deg); } }
/* 设置面板统一开关：三个开关（管理模式/深色/动画）共用同一套样式与手感 */
.set-switch {
  display: inline-flex; align-items: center; gap: 10px; max-width: 100%;
  cursor: pointer; user-select: none; font: inherit;
  border: 1px solid var(--border); background: var(--card);
  border-radius: 10px; padding: 8px 14px;
}
.set-switch:active { transform: translateY(1px); }
.set-switch .track {
  width: 44px; height: 24px; border-radius: 12px; position: relative; flex: none;
  background: #c4c9d0; transition: background .18s ease;
}
body.dark .set-switch .track { background: #3a4150; }
.set-switch .thumb {
  position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.set-switch.on .track { background: #4CAF50; }
.set-switch.on .thumb { left: 23px; }
.set-switch.sw-anim.on .thumb { animation: swOn .18s ease; }
.set-switch.sw-anim:not(.on) .thumb { animation: swOff .18s ease; }
@keyframes swOn { from { left: 3px; } to { left: 23px; } }
@keyframes swOff { from { left: 23px; } to { left: 3px; } }
.set-switch .lbl { font-size: 15px; color: var(--text); }
/* 动画档位选择（关闭 / 标准 / Q弹）+ 速度微调 */
.anim-seg {
  display: inline-flex; border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; background: var(--card);
}
.anim-seg-btn {
  font: inherit; font-size: 14px; border: none; background: transparent;
  color: var(--muted); padding: 8px 18px; cursor: pointer;
  transition: background calc(.18s * var(--anim-speed)) var(--ease-out),
              color calc(.18s * var(--anim-speed)) var(--ease-out);
}
.anim-seg-btn + .anim-seg-btn { border-left: 1px solid var(--border); }
.anim-seg-btn:hover { background: var(--bg); color: var(--text); }
.anim-seg-btn.on { background: #4CAF50; color: #fff; }
.anim-speed {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  font-size: 13px; color: var(--muted);
}
.anim-speed.disabled { opacity: .45; }
.anim-speed input[type=range] { flex: 1; max-width: 200px; accent-color: #4CAF50; cursor: pointer; }
.anim-speed .val { font-variant-numeric: tabular-nums; color: var(--text); min-width: 40px; }
/* 个人数据同步 */
.sync-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px; }
.sync-item {
  display: flex; align-items: center; gap: 8px; font-size: 14px;
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); cursor: pointer; color: var(--text);
}
.sync-item input { width: 16px; height: 16px; accent-color: #4CAF50; flex: none; }
.sync-item b { margin-left: auto; font-weight: 600; color: var(--muted); font-size: 12px; }
.sync-recv { display: flex; gap: 8px; margin-top: 10px; }
.sync-recv input {
  flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--card); color: var(--text); font: inherit;
  font-size: 16px; letter-spacing: 4px; text-align: center;
}
.sync-code {
  margin-top: 10px; padding: 14px; border-radius: 10px; text-align: center;
  background: var(--bg); border: 1px dashed var(--accent);
}
.sync-code .num {
  font-size: 32px; font-weight: 700; letter-spacing: 8px; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.sync-code .tip { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
/* AI 助手 */
.ai-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.ai-tab {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--muted); cursor: pointer; font: inherit; font-size: 13px;
}
.ai-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.ai-out {
  height: min(52vh, 420px); overflow-y: auto; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; color: var(--text);
  -webkit-overflow-scrolling: touch;
}
.ai-out .ph { color: var(--muted); font-size: 13px; }
.ai-out b { font-weight: 700; }
.ai-out code {
  background: rgba(125,125,125,.16); padding: 1px 5px; border-radius: 4px;
  font-family: ui-monospace, Consolas, monospace; font-size: .9em;
}
.ai-out .ul { display: block; padding-left: 4px; }
.ai-cursor {
  display: inline-block; width: 7px; height: 15px; vertical-align: -2px;
  background: var(--accent); animation: aiblink .9s steps(2, start) infinite;
}
@keyframes aiblink { to { visibility: hidden; } }
body.no-animations .ai-cursor { animation: none; }
.ai-ask { display: flex; gap: 8px; margin-top: 10px; }
.ai-ask input {
  flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--text); font: inherit; font-size: 14px;
}
.ai-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ai-quick button {
  padding: 5px 11px; font-size: 12px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--card); color: var(--muted); cursor: pointer; font: inherit;
}
.ai-quick button:hover { color: var(--text); border-color: var(--accent); }
.ai-hits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.ai-hit {
  width: 58px; height: 58px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--card); cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-size: 22px; color: var(--text);
}
.ai-hit span { font-size: 10px; color: var(--muted); margin-top: 2px; }
.ai-hit:hover { border-color: var(--accent); }
/* v0.2.5：找字结果右上角的一键收藏小星 */
.ai-hit { position: relative; }
.ai-hit-fav {
  position: absolute; top: 2px; right: 3px;
  font-size: 12px !important; margin: 0 !important;
  color: var(--border); cursor: pointer; line-height: 1;
}
.ai-hit-fav.on { color: #f5a623; }
.ai-hit-fav:hover { transform: scale(1.25); }
.ai-hit-star {
  position: absolute; top: 2px; left: 3px;
  font-size: 10px !important; margin: 0 !important; color: #f5a623; line-height: 1;
}
.ai-meta { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
.ai-err { color: #c62828; }
body.dark .ai-err { color: #ef9a9a; }
.ai-set-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.ai-set-row label { font-size: 13px; color: var(--muted); min-width: 72px; }
.ai-set-row input[type=text], .ai-set-row input[type=password] {
  flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: 13px;
}

/* ===== AI 助手页（v0.2.0）：独立的对话页 ===== */
.ai-page { display: flex; flex-direction: column; gap: 12px; }
.ai-page-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ai-page-head .spacer { flex: 1; }
.ai-chip {
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--muted); background: var(--card);
}
.ai-linkbtn {
  font-size: 12px; border: none; background: none; color: var(--accent);
  cursor: pointer; padding: 4px 6px; border-radius: 6px;
}
.ai-linkbtn:hover { background: var(--bg); }
/* v0.2.4：AI 回答里的 U+码点 变成可点的字符卡 */
.ai-cp {
  display: inline-flex; align-items: center; gap: 4px;
  margin: 1px 2px; padding: 1px 8px 1px 6px;
  border: 1px solid var(--accent); border-radius: 999px;
  background: transparent; color: var(--accent);
  font-size: 15px; line-height: 1.6; cursor: pointer;
  font-family: inherit; vertical-align: baseline;
}
.ai-cp span { font-size: 10px; color: var(--muted); }
.ai-cp:active { transform: scale(.95); }
/* v0.2.7：AI 回答下方的「存进自定义释义」操作行 + 选字弹窗 */
.ai-saverow { margin-top: 4px; }
.ai-cp.sel { background: var(--accent); color: #fff; }
.ai-cp.sel span { color: rgba(255,255,255,.75); }
.ai-setup {
  padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
}
.ai-setup h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 8px; }
.ai-setup p { font-size: 13px; color: var(--muted); line-height: 1.8; margin-bottom: 8px; }
.ai-setup ol { font-size: 13px; color: var(--muted); line-height: 1.9; padding-left: 20px; margin: 6px 0 12px; }
.ai-log { display: flex; flex-direction: column; gap: 10px; }
.ai-msg { display: flex; }
.ai-msg.user { justify-content: flex-end; }
.ai-bubble {
  max-width: 88%; padding: 10px 13px; border-radius: 14px;
  font-size: 14px; line-height: 1.75; word-break: break-word;
}
.ai-msg.user .ai-bubble {
  background: var(--accent); color: #fff; border-bottom-right-radius: 5px;
}
.ai-msg.bot .ai-bubble {
  background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 5px;
}
.ai-bubble .ul { display: block; }
.ai-bubble code {
  background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13px;
}
.ai-msg.user .ai-bubble code { background: rgba(255, 255, 255, .2); }
.ai-msg .ai-meta { margin-top: 4px; font-size: 11px; color: var(--muted); }
.ai-empty {
  padding: 26px 18px; text-align: center;
  border: 1px dashed var(--border); border-radius: 12px;
}
.ai-empty .ico { color: var(--accent); margin-bottom: 8px; }
.ai-empty h3 { font-size: 15px; margin-bottom: 6px; }
.ai-empty p { font-size: 12px; color: var(--muted); line-height: 1.75; margin-bottom: 14px; }
.ai-chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
.ai-chips button {
  font-size: 12px; padding: 7px 11px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
}
.ai-chips button:hover { border-color: var(--accent); color: var(--accent); }
.ai-composer {
  display: flex; gap: 8px; align-items: flex-end; padding: 10px;
  border: 1px solid var(--border); border-radius: 14px; background: var(--card);
}
.ai-composer textarea {
  flex: 1; min-height: 44px; max-height: 140px; resize: none;
  border: none; outline: none; background: transparent; color: var(--text);
  font: inherit; font-size: 14px; line-height: 1.6;
}
.ai-composer .ai-send {
  flex: 0 0 auto; padding: 9px 16px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.ai-composer .ai-send:disabled { opacity: .55; cursor: default; }
.ai-composer .ai-stop {
  flex: 0 0 auto; padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 14px; cursor: pointer; white-space: nowrap;
}
.ai-hint { font-size: 11px; color: var(--muted); text-align: right; margin-top: -4px; }
</style>

<div class="modal-overlay" id="zoomOverlay" onmousedown="overlayPressOn(this, event)" onclick="overlayClickMaybe(this, event, closeZoomPreview)">

    <div class="modal-header">
      <div class="name" id="zoomTitle" style="display:flex;align-items:center;gap:8px"><svg class="ni sm"><use href="#i-eye" xlink:href="#i-eye"/></svg>放大预览</div>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px">
      <canvas id="zoomCanvas" width="400" height="400" style="border:1px solid var(--border);border-radius:8px;background:white"></canvas>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center">
        <label style="font-size:14px;color:var(--muted)">字号:</label>
        <input type="range" id="zoomSize" min="100" max="400" value="250" oninput="updateZoomPreview()" style="width:150px">
        <span id="zoomSizeValue" style="font-size:14px;color:var(--muted);min-width:40px">250</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center">
        <label style="font-size:14px;color:var(--muted)">颜色:</label>
        <input type="color" id="zoomColor" value="#000000" onchange="updateZoomPreview()">
        <label style="font-size:14px;color:var(--muted)">背景:</label>
        <input type="color" id="zoomBgColor" value="#ffffff" onchange="updateZoomPreview()">
        <label style="font-size:14px;color:var(--muted)">粗体:</label>
        <input type="checkbox" id="zoomBold" onchange="updateZoomPreview()">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button onclick="exportImage('png')" style="padding:8px 16px;background:#666;color:white;border:none;border-radius:4px;cursor:pointer">导出 PNG</button>
        <button onclick="exportImage('jpeg')" style="padding:8px 16px;background:#666;color:white;border:none;border-radius:4px;cursor:pointer">导出 JPG</button>
        <button onclick="exportImage('webp')" style="padding:8px 16px;background:#666;color:white;border:none;border-radius:4px;cursor:pointer">导出 WebP</button>
        <button onclick="exportImage('svg')" style="padding:8px 16px;background:#666;color:white;border:none;border-radius:4px;cursor:pointer">导出 SVG</button>
      </div>
    </div>
  </div>
</div>

    <div class="scard-handle"></div>
    <div class="scard-head">
      <span class="sc-hicon" id="settingsCardIcon"><svg class="ni"><use href="#i-settings" xlink:href="#i-settings"/></svg></span>

<!-- 自定义确认/输入弹窗（v0.2.12）：替代原生 confirm/prompt。
     file:// 下原生弹窗顶着「网址为"file://"的网页显示」的抬头，又丑又吓人；
     这里用应用内弹窗，样式和设置/详情弹窗一致。z-index 400 盖过设置(200)/更新条(320)/toast(300)。 -->
<div class="modal-overlay" id="confirmOverlay" style="z-index:500" onmousedown="overlayPressOn(this, event)" onclick="overlayClickMaybe(this, event, cancelConfirmOverlay)">
  <div class="modal" style="width:380px;max-width:88vw">
    <div class="modal-header" style="padding-top:22px">
      <div class="name" id="confirmTitle" style="font-size:16px">确认操作</div>
    </div>
    <div class="modal-body" id="confirmMsg" style="text-align:center;font-size:13px;line-height:1.9;white-space:pre-line"></div>
    <div id="confirmInputRow" style="display:none;padding:0 24px 4px">
      <input type="text" id="confirmInput" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px">
    </div>
    <div style="display:flex;gap:10px;padding:14px 24px 20px">
      <button id="confirmCancelBtn" onclick="finishConfirm(false)" style="flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px">取消</button>
      <button id="confirmOkBtn" onclick="finishConfirm(true)" class="file-upload-btn" style="flex:1;padding:9px 0;font-size:13px;border-radius:8px;border:none">确定</button>
    </div>
  </div>
</div>

const EGG_FOUND_STORE = 'unicode_egg_found_v2';
const EGG_DAY_STORE = 'unicode_egg_day_v2';
const EGG_CATS = ['暗号', '字符', '键盘', '手势', '时间', '游戏', '开发者'];
let _eggFoundCache = null;

function eggFoundSet() {
  if (_eggFoundCache) return _eggFoundCache;
  var s = new Set();

const EGG_KW_ALT = {};

const EGG_CP = {
  0xFEFF:'cp-feff', 0x200B:'cp-feff', 0x202E:'cp-202e', 0xFFFD:'cp-fffd',
  0x1F4A9:'cp-1f4a9', 0x10FFFF:'cp-10ffff', 0x0000:'cp-0', 0x2603:'cp-2603',

  0xD800:'cp-d800', 0x0301:'cp-0301', 0x1F1E8:'cp-1f1e8'
};
function eggKw(q) {
  var key = String(q || '').trim().toLowerCase().replace(/\s+/g, ' ');
  // v0.2.25：全端替代暗号优先，且一律 soft（彩蛋照放，不拦搜索）
  var altId = EGG_KW_ALT[key];
  if (altId) { eggFire(altId); return false; }
  var id = EGG_KW[key];
  if (!id) return false;
  // 这俩属于「打字顺手敲出来」的，只走全局键盘缓冲，别在搜索框里抢正常查询
  if (id === 'key-unicode' || id === 'key-xyzzy') return false;
  eggFire(id);
  // 42 / 5B57 / U+5B57 是有人真会拿来查的正经输入：彩蛋照放，但不拦搜索
  var soft = (key === '42' || key === '5b57' || key === 'u+5b57');
  return !soft;
}
function eggCp(cp) {
  var id = EGG_CP[cp];
  return id ? eggFire(id, cp) : false;
}

window.addEventListener('devicemotion', function (e) {

  // 只盯 #settingsBody 会让「滑到底」这个彩蛋三个端都触发不了
  var isSettings = (t.id === 'settingsBody') ||
    (t.classList && t.classList.contains && t.classList.contains('scard-body'));
  if (!isSettings) return;
  // v0.2.28：scroll 是高频事件，贴着底部继续滑会一帧加一次，

  // 离开底部才允许下一轮」，并且图鉴集齐后不再打扰。
  var atBottom = t.scrollTop + t.clientHeight >= t.scrollHeight - 12;

  var pick = '';
  var mo = now.getMonth() + 1, d = now.getDate(), wd = now.getDay(), hr = now.getHours();
  if (mo === 2 && d === 29) pick = 'tm-leap';
  else if (mo === 4 && d === 1) pick = 'tm-april';
  else if ((mo === 1 && d === 1) || (mo === 12 && d === 25) || (mo === 10 && d === 31) || (mo === 8 && d === 15)) pick = 'tm-festival';
  else if (typeof navigator.onLine === 'boolean' && !navigator.onLine) pick = 'env-offline';
  else if (wd === 5) pick = 'tm-friday';
  else if (hr >= 0 && hr < 5) pick = 'tm-night';

// 否则：顶层抛错 → 后续函数定义与初始化全部不执行 → 界面完好但所有按钮都是死的，且不报错
// ============================================================
let _fatalShown = false;
function _escLite(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 只清本应用自己的数据：localStorage 里只删 unicode_* / 几个已知键，
// 不清整个源（部署在 github.io 这类共享源上会误伤隔壁项目）；
// 同时删掉 IndexedDB —— 否则"清空数据"清不掉用户上传的那 2MB 字符数据。
function wipeAppDataAndReload() {
  try {
    const keep = k => k.indexOf('unicode_') === 0 || k === 'recentSearches' || k === 'managePin' || k === 'manageMode';
    Object.keys(localStorage).filter(keep).forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  } catch (e) {}
  try { indexedDB.deleteDatabase('unicode-tool-db'); } catch (e) {}
  try { location.reload(); } catch (e) {}
}

// 只用于「初始化级失效」：脚本顶层抛错导致后续全部函数没定义、界面看似正常但按钮全死
function showFatalBanner(msg) {
  if (_fatalShown) return;   // 多个错误只提示一次
  _fatalShown = true;
  try { const _sp = document.getElementById('loadingSplash'); if (_sp) _sp.remove(); } catch (_) {}
  try {
    let el = document.getElementById('fatalBanner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'fatalBanner';
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 14px;font-size:13px;line-height:1.6;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;box-shadow:0 -2px 12px rgba(0,0,0,.35)';
      (document.body || document.documentElement).appendChild(el);
    }
    el.innerHTML = '⚠️ 页面未能正常启动：' + _escLite(msg || '未知错误')
      + ' <button onclick="wipeAppDataAndReload()" style="margin-left:10px;padding:3px 10px;border:none;border-radius:5px;background:#fff;color:#7f1d1d;cursor:pointer;font-size:12px">清空本应用数据并刷新</button>'
      + ' <button onclick="closeFatalBanner()" style="margin-left:6px;padding:3px 10px;border:1px solid #fff;border-radius:5px;background:transparent;color:#fff;cursor:pointer;font-size:12px">关闭</button>';
    // 让底部固定的横幅不盖住分页栏
    document.body.classList.add('has-fatal');
  } catch (e) { /* 错误处理本身不再抛错 */ }
}

function closeFatalBanner() {
  const el = document.getElementById('fatalBanner');
  if (el) el.remove();
  document.body.classList.remove('has-fatal');
}

// 脚本同步错误：只有「初始化阶段」才算致命——那时后续函数可能根本没定义，
// 界面看着正常但按钮全死，才是这个横幅存在的理由。
// 初始化完成之后的运行时错误是可恢复的（某个 onclick 里抛个 TypeError 而已），
// 必须降级成 warn + 轻提示，不能对用户说「页面未能正常启动」并建议清空数据。
let appReady = false;
window.addEventListener('error', e => {
  // img/script/link 之类资源加载失败没有 message，记个 warn 就行
  if (e && !e.message && e.target && e.target !== window) {
    console.warn('[资源加载失败]', (e.target && (e.target.src || e.target.href)) || e.target);
    return;
  }
  if (!appReady) { showFatalBanner(e && e.message); return; }
  console.warn('[运行时错误]', e && e.message, (e && e.filename) + ':' + (e && e.lineno));
  try { showToast('操作失败：' + ((e && e.message) || '未知错误')); } catch (_) {}
});

// 未处理的 Promise 失败大多是可恢复的（某次读盘/写盘/字体加载失败），不该升级成"建议删数据"
let _lastAsyncErrAt = 0;
window.addEventListener('unhandledrejection', e => {
  const r = e && e.reason;
  if (r && (r.name === 'AbortError' || r.name === 'NotFoundError')) return;
  console.warn('[未处理的 Promise 异常]', r);
  const now = Date.now();
  if (now - _lastAsyncErrAt < 5000) return;   // 5 秒内只提示一次，避免连弹
  _lastAsyncErrAt = now;
  try { showToast('操作失败：' + ((r && (r.message || r)) || '未知错误')); } catch (_) {}
});

function detachBlockScroll() {
  const cs = document.getElementById('contentScroll');
  if (blockScrollState._scrollHandler) { cs.removeEventListener('scroll', blockScrollState._scrollHandler); blockScrollState._scrollHandler = null; }

  blockScrollState.blockName = '';
}

// v0.2.18：从 HTML 里搬出去，改成按需加载
//   以前：base64 内嵌 2.28MB，每次打开都要 atob 2.3MB + brotli 解压 + JSON.parse 5.4MB 同步跑完，
//         光这一块就占 index.html 的 78%，低端机光启动就要多卡几百毫秒；
//   现在：unicode_data/worddict.br（1.71MB 二进制 brotli），第一次真正要用时才读，
//         读完常驻内存，同一次会话里再点开别的字零等待。
const WORD_DICT_URL = 'unicode_data/worddict.br';
let WORD_DICT = null;              // null = 还没加载（区别于「查了但没有」）
let _wordDictPromise = null;
function xhrBinary(url) {
  return new Promise(function (resolve, reject) {
    try {
      const x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.responseType = 'arraybuffer';
      x.onload = function () {
        if (x.status === 0 || x.status === 200) resolve(x.response);   // file:// 下 status 是 0
        else reject(new Error('HTTP ' + x.status));
      };
      x.onerror = function () { reject(new Error('读取失败')); };
      x.send();
    } catch (e) { reject(e); }
  });
}
function wordDictEnsure() {
  if (WORD_DICT) return Promise.resolve(WORD_DICT);
  if (_wordDictPromise) return _wordDictPromise;
  _wordDictPromise = xhrBinary(WORD_DICT_URL).then(function (buf) {
    if (!buf || !buf.byteLength) return null;
    const out = BrotliDecode(new Uint8Array(buf));
    WORD_DICT = JSON.parse(new TextDecoder('utf-8').decode(out));
    wordDictOnLoaded();
    return WORD_DICT;

function wordDictOnLoaded() {
  // 详情弹窗开着、当时还没字典 → 原地补上（silent 模式会保留滚动位置）
  if (detailCP !== null) {
    const ov = document.getElementById('modalOverlay');
    if (ov && ov.classList.contains('show')) showDetail(detailCP, true);
  }
}


// ===== 应用版本 =====
const APP_VERSION = '0.2.29';
const APP_UNICODE_VERSION = '17.0';   // 内置区块数据版本

// 更新检查用的版本清单（静态 JSON，由 Cloudflare Pages 托管，仓库根目录 version.json）
// 只 GET 一个文件，不带任何参数/标识，服务器无从知道你查了什么；
// 不想要可以在设置里关掉「启动时自动检查更新」，关掉后不点按钮就一次请求都不会发
const UPDATE_MANIFEST_URL = 'https://unchaxun.pages.dev/version.json';
const UPDATE_STORE = 'unicode_update';
const UPDATE_DEFAULTS = { auto: true, skip: '' };   // skip：选择「以后再说」的版本号

const PAGE_SIZE = 96;

// ============================================================
// 存储读写统一入口
// 任何损坏数据 / 禁用存储 / 配额超限都在这里被兜住，
// 绝不让顶层初始化抛错（否则后续所有函数定义与初始化都不再执行，
// 界面看起来正常但每个按钮都是死的，且不报任何错）
// ============================================================
function lsGet(key, fallback, ok) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === undefined) return fallback;
    const v = JSON.parse(raw);
    if (typeof ok === 'function' && !ok(v)) {
      console.warn('[存储] 结构异常，已重置为默认值:', key);
      return fallback;
    }
    return v;
  } catch (e) {
    console.warn('[存储] 读取失败，已重置为默认值:', key, e && e.message);
    return fallback;
  }
}

function lsGetRaw(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}

// 写失败提示按 5 秒节流：配额满时 addToHistory 每次点字符都会写一次，
// 不节流的话点十个字符会弹十条提示
let _lsToastAt = 0;
function _lsWriteFailed(key, e) {
  console.warn('[存储] 写入失败:', key, e && e.message);
  const now = Date.now();
  if (now - _lsToastAt < 5000) return;
  _lsToastAt = now;
  try { showToast('存储空间已满，本次修改未保存'); } catch (_) {}
}
function lsSet(key, val) {

// Unicode 数据库管理（新增）
// ============================================================
const IDB_NAME = 'unicode-tool-db';
const IDB_VERSION = 1;
const IDB_STORE = 'data';

// 全局 Unicode 数据对象
let unicodeData = {
  version: '内置 (Unicode 17.0 区块)',
  source: 'builtin',
  blocks: null,        // [[enName, start, end], ...]  来自外部 Blocks.txt
  charMap: null,       // Map: codepoint → {name, category, bidi, combining, decomposition, mirrored, upper, lower}
  loaded: false,
};

// A7：本地数据加载的 Promise。上传/在线获取前必须等它完成，
// 否则会把还没加载出来的 charMap 当成空表写回 IndexedDB，清掉已存的全部字符数据。
let unicodeDataReady = null;
async function ensureDataReady() {
  if (!unicodeDataReady) return;
  try { await unicodeDataReady; } catch(e) { console.warn('数据加载等待失败:', e && e.message); }
}

// --- 外置字体管理 ---
let customFonts = [];  // [{name, type, size, addedAt}]
const ORIGINAL_FONT = document.body.style.fontFamily || getComputedStyle(document.body).fontFamily;

// --- IndexedDB 简易封装 ---
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    // 原来 return 一个会 reject 的 Promise，事务失败时异常逃出 try，
    // 变成未处理的 Promise 拒绝 → 触发全局错误提示。这里统一收敛成 null。
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      tx.onabort = () => reject(tx.error || new Error('事务被中止'));
    });
  } catch(e) { console.warn('IDB读取失败:', key, e && e.message); return null; }
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    // 注意：必须 await 内部 Promise，否则事务失败时异常逃出 try，调用方无法感知
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('事务被中止'));
    });
    return true;
  } catch(e) { console.warn('IDB写入失败:', key, e && e.message); return false; }
}
async function idbDel(key) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('事务被中止'));
    });
    return true;
  } catch(e) { console.warn('IDB删除失败:', key, e && e.message); return false; }
}

// --- 内置离线数据包（v0.2.2）---
// APK 把 4 个 UCD 文件打进 assets/unicode_data/，桌面版打进 exe 包，
// 首次打开不用联网就有完整数据；读进 IndexedDB 缓存后就不再重复解包。
// 注意：file:// 页面读 file 资源只能用 XHR（fetch 对 file: 一律拒绝），
// 这依赖 Android 端 setAllowFileAccessFromFileURLs(true)。
function xhrText(url) {
  return new Promise(function (resolve, reject) {
    try {
      const x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.onload = function () {
        // file:// 读取成功时 status 是 0
        (x.status === 0 || x.status === 200) ? resolve(x.responseText) : reject(new Error('HTTP ' + x.status));
      };
      x.onerror = function () { reject(new Error('读取失败')); };
      x.send();
    } catch (e) { reject(e); }
  });
}

const BUNDLED_FILES = [
  { url: 'unicode_data/UnicodeData.txt', label: 'UnicodeData.txt' },
  { url: 'unicode_data/Blocks.txt',      label: 'Blocks.txt' },
  { url: 'unicode_data/Scripts.txt',     label: 'Scripts.txt' },
  { url: 'unicode_data/LineBreak.txt',   label: 'LineBreak.txt' },
];

// 拆成两层（v0.2.6 修复）：启动链里直接调 loadBundledUCD 会自锁死——
// 它 await ensureDataReady()，而 ensureDataReady 等的 unicodeDataReady
// 正是「等本次解包跑完才算完成」的那条 Promise，互相等永远卡住，
// 导致 APK/桌面版首次自动解包永远不完成、概览页提示一直挂着。
// Core 版不做等待；外层 loadBundledUCD 保留等待语义，供手动触发路径使用。
async function loadBundledUCD(silent) {
  await ensureDataReady();
  return loadBundledUCDCore(silent);
}
async function loadBundledUCDCore(silent) {
  const isFile = location.protocol === 'file:';
  try {
    const results = {};
    for (let i = 0; i < BUNDLED_FILES.length; i++) {
      const f = BUNDLED_FILES[i];
      if (!silent) setProgress('正在解包内置数据 ' + f.label + '（' + (i + 1) + '/4）…');
      results[f.label] = isFile ? await xhrText(f.url) : await (await fetch(f.url)).text();
    }
    if (!silent) setProgress('正在解析内置数据…');
    const charMap = parseUCD(results['UnicodeData.txt']);
    const blocks = parseBlocks(results['Blocks.txt']);
    const scripts = parseUCDScalar(results['Scripts.txt']);
    const lineBreak = parseUCDScalar(results['LineBreak.txt']);
    let ver = 'Unicode 17.0（内置）';
    const vm = (results['Blocks.txt'] || '').match(/(?:Blocks|version)[^\d]*(\d+\.\d+\.\d+)/i);
    if (vm) ver = 'Unicode ' + vm[1] + '（内置）';

    const saveOk = await idbSet('unicodeData', {
      version: ver,
      source: 'bundled',
      blocks: blocks,
      charMapData: [...charMap.entries()],
      scriptsData: [...scripts.map.entries()],
      scriptExtData: [...scripts.ext.entries()].map(([cp, arr]) => [cp, arr]),
      lineBreakData: [...lineBreak.map.entries()],
      timestamp: Date.now(),
    });
    unicodeData = {
      version: ver, source: 'bundled',
      blocks: blocks, charMap: charMap, loaded: true,
      scripts: scripts.map, scriptExts: scripts.ext,
      lineBreak: lineBreak.map,
    };
    nameIndex = null; categoryIndex = null;
    updateVersionDisplay();
    addLog('内置数据', ver + '（' + charMap.size + ' 字符）');
    if (!silent) {
      setProgress('✅ 内置数据就绪：' + charMap.size.toLocaleString() + ' 个字符 · ' + (blocks.length || 346) + ' 个区块' + (saveOk ? '' : '（⚠️ 未能写入本地存储，重启会再解一次）'), 'success');
      refreshSettingsDisplay();
    }
    return true;
  } catch (e) {
    console.warn('内置数据包读取失败:', e && e.message);
    if (!silent) setProgress('❌ 内置数据读取失败：' + (e && e.message ? e.message : '') + '。可到设置里「一键在线获取」', 'error');
    return false;
  }
}
